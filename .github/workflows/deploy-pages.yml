name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/math-text-editor-4gmzl2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site (exclude repo internals)
        run: |
          mkdir site
          cp index.html site/
          cp manifest.webmanifest sw.js site/
          cp icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png site/
          sed -i "s/__BUILD__/${GITHUB_SHA}/" site/sw.js
          grep -q "calcuta-shell-${GITHUB_SHA}" site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
