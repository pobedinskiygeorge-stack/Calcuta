<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calcuta — редактор с математикой</title>
<!-- PWA: installable, launches full-screen, works offline (see sw.js / manifest). -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1012">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Calcuta">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head>
<body>
<!-- Apply the saved theme before first paint so there's no dark→light flash. -->
<script>try{if((localStorage.getItem('calcuta.theme')||'dark')==='light')document.documentElement.classList.add('light');}catch(e){}</script>
<!-- Register the service worker (offline + fast launch). Relative path so it
     works under a GitHub Pages project subpath; failures are non-fatal. -->
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
<!-- Firebase (Google sign-in + Firestore sync) is NOT loaded here. As three
     `defer` tags it was ~512 KB that had to download, parse and execute before
     DOMContentLoaded — which is what boot() waits for — so the editor could not
     appear until the network had answered, even though every note was already
     in localStorage. loadFirebase() now injects the same bundles after the
     first render (see the [SYNC] section). These hints just warm the
     connections so that later load is quick. -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>

     engine, inspired by numbr.dev. Single self-contained file.
     Sections: [STYLE] · [MARKUP] · [ENGINE] · [EDITOR] · [SYNC] · [BOOT]
     ============================================================ -->

/* ---------- Theme (near-neutral dark, Telegram-like — faint cool tint) ---------- */
:root{
  --bg:#0f1012;
  --bg-editor:#191a1d;
  --bg-panel:#0d0e10;
  --border:#26282c;
  --border-soft:#1d1f22;
  --text:#d9dbdf;          /* default / subtask text */
  --text-strong:#f0f2f4;   /* subtasks (white) */
  --dim:#7c8086;           /* muted */
  --dim-2:#4a4d53;
  /* ---- The five base hues. These are the ONLY chromatic literals in the app;
     every other colour token below is an alias of one of them, which is what
     keeps the palette closed. Adding a sixth hue means adding it here. ---- */
  --accent:#e8802c;        /* Half-Life orange, held to the same 80% saturation as the
                              rest of the base hues so it reads as one of them rather
                              than shouting over them */
  --var:#5ecb7e;           /* the one green — variables, results, checkmarks */
  --super:#b98cf5;         /* purple — "#" headings, quotes */
  --num:#7ec8f5;           /* sky blue — numbers, links */
  --date:#e3b755;          /* yellow — dates dd.mm, currency, search */

  /* ---- Aliases: no hue of their own, so a base change propagates. ---- */
  --op-work:var(--accent); /* working arithmetic signs */
  --label:var(--accent);   /* "текст:" labels */
  --cbox:var(--accent);    /* empty checkbox marker "[ ]" */
  --result:var(--var);     /* right-column results, "[x]" checkmark */
  --link:var(--num);       /* URL + !document pills */
  --cur:var(--date);       /* "/usd" "/euro" "/yuan" command */
  --brk0:var(--var);       /* matched brackets that participate in a calculation, by
                              nesting depth — outermost green, then orange, then purple,
                              cycling every BRK_N levels */
  --brk1:var(--accent);
  --brk2:var(--super);

  /* ---- Soft washes derived from the base hues. ---- */
  --accent-soft:rgba(232,128,44,.16);
  --pill-hover-bg:rgba(94,203,126,.18); /* oval bg behind a variable + usage pills */
  --super-soft:rgba(185,140,245,.14);   /* whole-row fill of a "#" heading */
  --date-spot:rgba(227,183,85,.16);     /* whole-line tint for "/dd.mm" spotlight */
  --link-soft:rgba(126,200,245,.14);    /* URL pill fill */
  --search-mark:rgba(227,183,85,.30);
  --search-mark-active:rgba(227,183,85,.62);
  --checked-bg:rgba(94,203,126,.13);
  --row-src:rgba(232,128,44,.13);

  /* ---- Beyond the base five. ---- */
  --sel:rgba(122,214,209,.24);  /* pale turquoise, Claude-Code style — translucent, so
                                   every syntax colour still reads through it. This hue
                                   is EXCLUSIVE to text selection: it must not appear on
                                   any other element. */
  --danger:#f14065;             /* the one red — destructive actions and errors only.
                                   Deliberately identical in both themes: a single
                                   fixed shade, not a per-theme pair. */
  --danger-soft:rgba(241,64,101,.16);

  /* ---- Neutrals. ---- */
  --comment:#8f897c;       /* "//" note lines: muted but readable gray */
  --op:#8c8778;            /* assignment "=" (muted) */
  --checked-text:#79856f;  /* faded text of a completed task */
  --row-hover:rgba(255,255,255,.035);
  --pill-bg:rgba(160,158,150,.22);        /* inline result pill inside the text */
  --pill-col:rgba(160,158,150,.16);       /* results-column pill */
  --pill-col-hover:rgba(160,158,150,.28);
  --caret-glyph:#1a0e00;   /* the character under the block caret, forced for contrast */
  --scroll-thumb:#313439;

  --font-mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace;
  --font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --fs:16px;   /* numbr-like scale: fewer lines on screen, better legibility */
  --lh:28px;
  --ls:0px;                /* normal spacing, like numbr (the old -0.5px packed glyphs and read darker); kept in the char-width probe too so the caret stays aligned */
  --pad-y:14px;
  --pad-x:16px;
  --results-w:150px;
}

/* ---------- Light theme (warm paper) — toggled via <html class="light">.
   Only colours are overridden; fonts/sizes/layout come from :root above.
   Syntax colours are darkened so they stay readable on a light background. */
:root.light{
  --bg:#f6f3ec;
  --bg-editor:#fdfbf7;
  --bg-panel:#eeeae1;
  --border:#e2ddd2;
  --border-soft:#eae6dc;
  --text:#413c34;
  --text-strong:#26221c;
  --dim:#9c968a;
  --dim-2:#bcb6aa;
  /* ---- The same five base hues, darkened for paper. --accent has to go
     deeper still: at the dark theme's lightness it sits near 2.4:1 on
     #fdfbf7, and operators and labels stop being readable at body size. ---- */
  --accent:#c16315;
  --var:#2da44e;
  --super:#7c4dd6;
  --num:#2b7fc4;
  --date:#b07d10;

  /* ---- Aliases (identical structure to the dark block). ---- */
  --op-work:var(--accent);
  --label:var(--accent);
  --cbox:var(--accent);
  --result:var(--var);
  --link:var(--num);
  --cur:var(--date);
  --brk0:var(--var);
  --brk1:var(--accent);
  --brk2:var(--super);

  /* ---- Soft washes. ---- */
  --accent-soft:rgba(193,99,21,.14);
  --pill-hover-bg:rgba(45,164,78,.15);
  --super-soft:rgba(124,77,214,.12);
  --date-spot:rgba(176,125,16,.14);
  --link-soft:rgba(43,127,196,.12);
  --search-mark:rgba(176,125,16,.28);
  --search-mark-active:rgba(176,125,16,.55);
  --checked-bg:rgba(45,164,78,.13);
  --row-src:rgba(193,99,21,.12);

  /* ---- Beyond the base five. ---- */
  --sel:rgba(60,160,155,.20);   /* the same exclusive turquoise, tuned for paper */
  --danger:#f14065;
  --danger-soft:rgba(241,64,101,.14);

  /* ---- Neutrals. ---- */
  --comment:#8e887b;
  --op:#8a8272;
  --checked-text:#9a9488;
  --row-hover:rgba(0,0,0,.045);
  --pill-bg:rgba(140,136,126,.20);
  --pill-col:rgba(140,136,126,.15);
  --pill-col-hover:rgba(140,136,126,.26);
  --caret-glyph:#fff6ec;
  --scroll-thumb:#cfc9bd;
}

*{box-sizing:border-box}
/* Never let mobile browsers auto-inflate text ("text autosizing"). A <textarea>
   and a <pre>/<div> get inflated by DIFFERENT factors, so the invisible input
   layer lays its text out taller/wider than the colored overlay — the native
   caret (input layout) then drifts away from the visible glyphs (overlay
   layout). Pinning to 100% makes both layers lay out identically. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-ui);font-size:var(--fs);
  -webkit-font-smoothing:antialiased;overflow:hidden;
  /* iOS: a long-press anywhere on the UI chrome otherwise fires native text
     selection (blue handles) + the Copy·Find·Translate callout on top of our
     own menus — most visibly when long-pressing a document row, where the
     selection latched onto the pop-up menu's own label. Kill selection and the
     callout globally; the real editable fields opt back in right below. */
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
/* No forced text colour: the turquoise is translucent, so every syntax hue
   still reads through it (a bracket keeps its depth colour while selected). */
::selection{background:var(--sel)}
/* Editable fields re-enable text selection (typing, caret, drag-select). The
   editor (#input) keeps callout:none from its own rule; other fields (search,
   tag, rename) get the normal paste callout back. */
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font-family:inherit;color:inherit}

#app{display:flex;height:100vh;width:100vw;position:relative}
/* Fixed narrow "vertical" web layout (numbr-style): cap the workspace width
   so the text column sits right next to the results; a wide monitor gets
   empty side gutters instead of a stretched editor. Phones keep full width
   (the max-width:720px block below already restyles them). */
@media (min-width:721px){
  #app{justify-content:center}
  #workspace{max-width:720px;border-left:1px solid var(--border-soft);border-right:1px solid var(--border-soft)}
}

/* ---------- Top bar: brand menu + document tabs ---------- */
.brand-name{
  font-family:var(--font-mono);font-weight:600;font-size:15px;
  color:var(--text-strong);letter-spacing:.5px;
  background:none;border:0;padding:2px;cursor:pointer;flex:0 0 auto;
}
/* accent only while the dropdown is open (aria-expanded flips on open/close),
   never on plain hover */
.brand-name[aria-expanded="true"]{color:var(--accent)}

/* generic dropdown anchored under a top-bar control */
.tb-menu-wrap{position:relative;display:inline-flex;flex:0 0 auto}
.tb-menu{
  position:absolute;top:calc(100% + 6px);left:0;z-index:50;
  background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;
  padding:5px;box-shadow:0 12px 34px rgba(0,0,0,.4);
}
.tb-menu[hidden]{display:none}
/* calcuta menu is wide (theme + tags + reference) and scrolls internally */
.brand-menu{width:302px;max-width:calc(100vw - 20px);max-height:calc(100vh - 58px);
  overflow-y:auto;padding:10px 12px 14px}
.bm-sep{height:1px;background:var(--border-soft);margin:9px 2px}
.bm-title{font-size:11px;color:var(--dim);padding:4px 8px 5px;letter-spacing:.3px}
/* theme choice: both options on one row; the active one is an oval pill */
.theme-row,.doc-row{display:flex;gap:6px;padding:3px 4px}
.doc-opt{flex:0 0 auto;padding:6px 15px;border:0;border-radius:999px;background:none;
  color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}
.doc-opt:hover{background:var(--bg-editor)}
.theme-opt{flex:0 0 auto;padding:6px 15px;border:0;border-radius:999px;background:none;
  color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}
.theme-opt:hover{background:var(--bg-editor)}
.theme-opt.active{background:var(--accent-soft);color:var(--text-strong)}

/* document tabs: Задачи · Личное · третий слот. Tab names are plain white;
   the open one is marked by the gray background alone. The third slot shows
   the open non-pinned document's name (or a dim "документы" placeholder when
   a pinned doc is open) and opens the document manager popover. */
.doc-tabs{display:flex;align-items:center;gap:4px;min-width:0;margin-left:24px}
.doc-tab{
  flex:0 0 auto;max-width:170px;padding:5px 11px;border-radius:8px;border:1px solid transparent;
  background:none;color:var(--text-strong);font-size:13px;font-family:var(--font-mono);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.doc-tab:hover{background:var(--bg-editor)}
.doc-tab.active{background:var(--bg-editor);border-color:var(--border)}
.doc-tab.placeholder{color:var(--dim)}
/* the loupe popover: the whole document manager (search, create, list) */
.docfind-menu{width:270px;max-width:calc(100vw - 20px)}
/* one control row: loupe smoothly unfolds the search box, "+" creates */
.docfind-bar{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.docfind-bar .icon-btn{border:1px solid var(--border)}
/* the collapsible search field ONLY — scoped by id so it never hits the inline
   rename box that also lives inside .docfind-menu (that box was inheriting
   width:0;opacity:0 here and rendering invisibly) */
#docfind-input{
  width:0;opacity:0;padding:7px 0;border:1px solid transparent;
  flex:0 1 auto;min-width:0;background:var(--bg-editor);border-radius:7px;
  color:var(--text);font-size:13px;outline:none;
  transition:width .18s ease,opacity .18s ease,padding .18s ease;
}
.docfind-bar.open input{width:170px;opacity:1;padding:7px 9px;border-color:var(--border)}
.docfind-bar.open input:focus{border-color:var(--accent)}
.doc-add-row{
  flex:0 0 auto;width:30px;height:30px;margin-left:auto;padding:0;border-radius:7px;
  border:1px dashed var(--border);background:none;color:var(--dim);cursor:pointer;
  font-size:17px;line-height:1;font-family:var(--font-ui);
}
.doc-add-row:hover{border-color:var(--accent);color:var(--accent)}
#pinned-tabs{display:contents}
.docfind-list{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow-y:auto}
.docfind-empty{font-size:12px;color:var(--dim);padding:6px 8px}

/* tags */
.tag-form{display:flex;gap:7px;align-items:center;margin-bottom:12px}
.tag-form input[type=text]{
  flex:1 1 auto;min-width:0;background:var(--bg-editor);border:1px solid var(--border);
  color:var(--text);border-radius:7px;padding:7px 9px;font-size:13px;outline:none;
}
.tag-form input[type=text]:focus{border-color:var(--accent)}
.swatch-btn{
  flex:0 0 auto;width:30px;height:30px;border-radius:7px;border:1px solid var(--border);
  cursor:pointer;padding:0;position:relative;overflow:hidden;
}
.tag-list{display:flex;flex-direction:column;gap:6px}
.tag-chip{
  display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;
  background:var(--bg-editor);border:1px solid var(--border-soft);
}
/* the colour dot doubles as a tap target to recolour an existing tag */
.tag-chip .dot{width:15px;height:15px;border-radius:50%;flex:0 0 auto;position:relative;
  cursor:pointer;border:1px solid var(--border);padding:0;-webkit-appearance:none;appearance:none}
.tag-chip .dot.picking{box-shadow:0 0 0 2px var(--accent-soft)}
.tag-chip .label{flex:1 1 auto;font-size:13px;font-family:var(--font-mono);color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag-chip .del{border:none;background:none;color:var(--dim);cursor:pointer;font-size:15px;padding:0 2px}
.tag-chip .del:hover{color:var(--accent)}
.empty-hint{font-size:12px;color:var(--dim);line-height:1.5}

/* document rows inside the rest / find-document menus */
.doc-item{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;
  border:1px solid transparent;-webkit-user-select:none;user-select:none;
}
.doc-item:hover{background:var(--bg-editor)}
.doc-item.active{background:var(--bg-editor);border-color:var(--border)}
.doc-item.active .doc-name{color:var(--text-strong)}
.doc-item .doc-name{
  flex:1 1 auto;min-width:0;font-size:13px;font-family:var(--font-mono);color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* Standalone class (NOT scoped to .doc-item): the rename box is also injected
   into a top-bar pinned tab, which is not inside a .doc-item — a descendant
   selector left it unstyled there, so it fell back to browser defaults and the
   typed text was invisible. -webkit-text-fill-color is pinned too so it can never
   inherit the transparent fill used by the main editor textarea. */
.doc-name-input{
  flex:1 1 auto;min-width:0;font-size:13px;font-family:var(--font-mono);
  background:var(--bg-panel);border:1px solid var(--accent);border-radius:5px;
  color:var(--text-strong);-webkit-text-fill-color:var(--text-strong);
  caret-color:var(--accent);padding:2px 6px;outline:none;
}
.doc-item .doc-badge{
  flex:0 0 auto;font-size:10.5px;background:var(--date);color:#22200f;border-radius:9px;
  padding:0 6px;line-height:16px;font-variant-numeric:tabular-nums;
}

/* ---------- Workspace ---------- */
#workspace{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;background:var(--bg-editor);position:relative}

/* Ctrl+F find bar (overlay near the top-right of the editor) */
#findbar{
  position:absolute;top:52px;right:18px;z-index:30;display:none;align-items:center;gap:6px;
  background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;
  padding:6px 8px;box-shadow:0 10px 30px rgba(0,0,0,.45);
}
#findbar.open{display:flex}
#findbar svg{color:var(--dim);flex:0 0 auto}
#findbar input{background:var(--bg-editor);border:1px solid var(--border);border-radius:7px;
  color:var(--text);font-size:13px;padding:6px 9px;outline:none;width:180px}
#findbar input:focus{border-color:var(--accent)}
.find-count{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:66px;text-align:right}

/* draggable divider to resize the results column */
#results-resize{
  flex:0 0 7px;min-height:100%;cursor:col-resize;position:relative;z-index:3;
  background:transparent;
}
#results-resize::before{content:"";position:absolute;top:0;bottom:0;left:3px;width:1px;background:var(--border-soft)}
#results-resize:hover::before,#results-resize.dragging::before{background:var(--accent);left:2px;width:2px}
.topbar{
  height:44px;flex:0 0 auto;display:flex;align-items:center;gap:8px;position:relative;
  padding:0 12px;border-bottom:1px solid var(--border-soft);background:var(--bg-panel);
}
.icon-btn{
  width:30px;height:30px;border-radius:7px;border:1px solid transparent;background:none;
  color:var(--dim);cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.icon-btn:hover{background:var(--bg-editor);color:var(--text)}
.topbar .spacer{flex:1 1 auto}
/* sync status: a small cloud at the right of the top bar. saved = dim,
   saving = clay + pulse, offline = clay + strike badge. Laconic. */
#sync-status{flex:0 0 auto;position:relative;display:grid;place-items:center;width:26px;height:26px;
  color:var(--dim);transition:color .2s,opacity .3s;cursor:pointer;border-radius:7px}
#sync-status:hover{background:var(--row-hover)}
#sync-status.sync-hidden{opacity:0;pointer-events:none}
/* hard-save cloud popover */
.cloud-menu{width:210px;max-width:calc(100vw - 20px);padding:8px}
.cloud-save-btn{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg-editor);
  color:var(--text-strong);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s}
.cloud-save-btn:hover{background:var(--row-hover)}
.cloud-save-btn:disabled{opacity:.55;cursor:default}
.cloud-done{display:none;align-items:center;gap:6px;color:var(--result);font-weight:600;
  font-size:12.5px;padding:8px 2px 0}
.cloud-done.show{display:flex}
.cloud-done svg{flex:0 0 auto}
#sync-status .sync-badge{position:absolute;right:1px;bottom:1px;opacity:0}
#sync-status.sync-saving{color:var(--accent);animation:sync-pulse 1.1s ease-in-out infinite}
#sync-status.sync-saved{color:var(--dim)}
#sync-status.sync-saved .sync-badge-check{opacity:1;color:var(--result)}
#sync-status.sync-offline{color:var(--accent);animation:none}
#sync-status.sync-offline .sync-badge-off{opacity:1;color:var(--accent)}
@keyframes sync-pulse{0%,100%{opacity:.5}50%{opacity:1}}
/* caret-anchored autocomplete / doc-link popup */
#acbox{position:fixed;z-index:60;min-width:150px;max-width:280px;max-height:210px;overflow-y:auto;
  background:var(--bg-panel);border:1px solid var(--border);border-radius:9px;padding:4px;
  box-shadow:0 10px 30px rgba(0,0,0,.38);font-family:var(--font-ui)}
#acbox[hidden]{display:none}
.ac-item{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:6px;cursor:pointer;
  font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-item .ac-ic{flex:0 0 auto;width:14px;color:var(--dim);font-size:12px}
.ac-item.sel{background:var(--bg-editor)}
.ac-item .ac-val{margin-left:auto;color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}

/* editor grid — single vertical scroller; children grow to content height so
   the textarea and the highlight overlay scroll together (no caret desync) */
#editor{
  flex:1 1 auto;display:flex;align-items:flex-start;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  font-family:var(--font-mono);font-size:var(--fs);line-height:var(--lh);
}
#editor::-webkit-scrollbar{width:11px}
#editor::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:8px;border:3px solid var(--bg-editor)}

/* stack: layered highlight / textarea / hotspots. Height driven by in-flow
   #highlight; min-height fills the viewport for short documents. */
#stack{flex:1 1 auto;position:relative;min-width:0;overflow:hidden;min-height:100%}

.layer{
  margin:0;padding:var(--pad-y) var(--pad-x);
  font-family:var(--font-mono);font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls);
  /* Wrap only at word boundaries — never split a word across rows. A single
     token longer than the whole line still breaks (last resort) so it can't
     overflow and desync the overlay. #input below must carry the identical
     rule or the caret would drift from the highlighted text. */
  white-space:pre-wrap;word-break:normal;overflow-wrap:break-word;tab-size:4;border:0;
}

/* highlight is the in-flow layer that gives #stack its height */
#highlight{position:relative;z-index:1;pointer-events:none;color:var(--text);
  width:100%;min-height:100%}
/* min-height (not height): a line that doesn't fit the available width wraps
   instead of being clipped; JS keeps the results rows the same height
   as their matching (possibly wrapped) highlight row, see render(). */
/* border-radius so every row-level background on a line — hover-source (clay),
   done/checked tint, and the /tag & /date spotlight washes
   (inset box-shadows) — renders with soft rounded corners, never a hard
   rectangle. Radius clips the inset box-shadows too. */
.hl-line{min-height:var(--lh);width:100%;border-radius:9px}
/* "#" supertask heading: the purple fills the WHOLE row, not just the text.
   Declared before .src so the transient "source line" reference still wins on
   a heading. Rounding and the same-tint row merging come from .hl-line above. */
.hl-line.superrow{background:var(--super-soft)}
.hl-line.src{background:var(--row-src)}
.hl-line.checked{background:var(--checked-bg)}
#highlight .num{color:var(--num)}
#highlight .op{color:var(--op)}
#highlight .opx{color:var(--op-work);font-weight:600}
#highlight .brk0{color:var(--brk0);font-weight:600}
#highlight .brk1{color:var(--brk1);font-weight:600}
#highlight .brk2{color:var(--brk2);font-weight:600}
#highlight .date{color:var(--date);font-weight:500}
#highlight .label{color:var(--label);font-weight:500}
#highlight .quote{color:var(--super)}
#highlight .super{color:var(--super);font-weight:700}   /* "#" heading: bold (mono bold keeps the advance, so the overlay stays aligned) */
#highlight .header{color:var(--comment)}
#highlight .cur{color:var(--cur);font-weight:600}   /* "/usd" "/euro" "/yuan" currency command */
#highlight .var{color:var(--var);font-weight:500}
/* A USAGE of a variable is a label pill (same green as the hover oval);
   the defining occurrence (LHS of "name = ...") stays plain green - only the
   original is pill-less. Same no-layout-shift trick as .rpill. */
#highlight .varu{background:var(--pill-hover-bg);box-shadow:0 0 0 2px var(--pill-hover-bg);border-radius:6px}
#highlight .tag{font-weight:500;border-radius:4px}
#highlight .sub{color:var(--text-strong)}
/* Inline result pill. Horizontal padding gives breathing room; the equal
   negative margin cancels its layout width so monospace alignment/caret are
   untouched (the outline extends over the spaces around the number). */
/* Inline result pill: soft gray fill via box-shadow spread (no layout width
   change, no overhang) so operators keep their normal gap from the number. */
/* Inline result pill: horizontal padding gives breathing room around the
   number; the equal negative margin cancels the added layout width so
   monospace alignment and the caret stay untouched. The overhang is kept
   smaller than the operator-padding space, so an adjacent math operator keeps
   a visible gap from the pill edge (like every other token) instead of
   touching it. */
#highlight .rpill{color:var(--text-strong);border-radius:7px;
  background:var(--pill-bg);padding:0 4px;margin:0 -4px}
/* Link pill: soft blue fill + underline; opens on click via the #stack
   handler (this overlay is pointer-events:none, so the click passes through). */
#highlight .link{color:var(--link);text-decoration:underline;text-underline-offset:2px;
  border-radius:6px;background:var(--link-soft);box-shadow:0 0 0 2px var(--link-soft)}
/* link to another Calcuta document ("!Название"): purple pill, click to open */
/* link to another Calcuta document ("!Название"): same blue as a pasted URL,
   underlined, but with no pill background — click to open the document */
#highlight .doclink{color:var(--link);text-decoration:underline;text-underline-offset:2px}
#highlight .checkmark{color:var(--result);font-weight:600}
#highlight .cbox{color:var(--cbox);font-weight:600}
.hl-line.checked{color:var(--checked-text)}
.hl-line.checked .num,.hl-line.checked .var,.hl-line.checked .op,.hl-line.checked .opx,
.hl-line.checked .date,.hl-line.checked .tag,.hl-line.checked .sub,
.hl-line.checked .brk0,.hl-line.checked .brk1,.hl-line.checked .brk2{
  color:var(--checked-text)!important;font-weight:400}
.hl-line.checked .checkmark{color:var(--result)!important}

#input{
  position:absolute;top:0;left:0;width:100%;height:100%;z-index:3;resize:none;overflow:hidden;
  background:transparent;color:transparent;caret-color:transparent;   /* real caret hidden -- #caretlayer draws a custom block instead */
  outline:none;white-space:pre-wrap;word-break:normal;overflow-wrap:break-word;
  -webkit-touch-callout:none;   /* mobile: no long-press Copy/Look-Up callout over the editor text */
}
/* The native selection is made invisible in the editor: a custom rounded
   overlay (#sellayer) draws the selection instead, so it can have oval corners
   like the row tints (native ::selection can't be rounded). The
   text itself is never obscured — the tint sits BEHIND #highlight's glyphs. */
#input::selection{background:transparent;color:transparent}

/* search highlight layer (yellow behind text) */
#searchlayer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.search-mark{position:absolute;height:var(--lh);background:var(--search-mark);border-radius:3px}
.search-mark.active{background:var(--search-mark-active);box-shadow:0 0 0 1px var(--date)}

/* "#" section rail: a thin gray guide that drops from under a heading's "#"
   and frames what is written in the section (see renderRails), like an
   indent guide in a code editor.
   It sits BEHIND the text layer: the wrapped rows of an indented line restart
   at column 0, right under the "#", and their glyphs must paint over it. */
#sectionlayer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.sec-rail{position:absolute;width:1px;background:var(--dim);opacity:.5}
/* horizontal divider above each "#" section (see renderRails): full text width, quiet */
.sec-divider{position:absolute;left:16px;right:16px;height:1px;background:var(--dim-2);opacity:.8}

/* custom rounded text-selection overlay (behind the highlighted text) */
#sellayer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.sel-rect{position:absolute;height:var(--lh);background:var(--sel);border-radius:7px}

/* oval pill background behind a variable, shown ONLY while hovering it —
   sits behind #highlight's text (lower in the DOM, same z-index) so the
   green .var glyphs paint on top of it, not the other way round. */
#pillhover{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
.pill-hover-box{position:absolute;height:var(--lh);border-radius:7px;background:var(--pill-hover-bg)}

/* box behind a bracket's matching partner, shown while the caret sits right
   next to either one — reuses the "source line" reference tint (--row-src)
   so it reads as the same "this corresponds to that" language, just scoped
   to a single character instead of a whole line. */
#brackethover{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
.brk-match-box{position:absolute;height:var(--lh);border-radius:4px;background:var(--row-src)}

#hotspots{position:absolute;top:0;left:0;width:100%;height:100%;z-index:4;pointer-events:none}
.cbox-hit{
  position:absolute;width:3ch;height:var(--lh);cursor:pointer;pointer-events:auto;border-radius:4px;
}
.cbox-hit:hover{background:var(--row-hover)}

/* custom block caret: solid, non-blinking, terminal-style. It covers the
   character AFTER the caret offset (not before, like the native thin caret) --
   .caret-glyph redraws that one character in a forced-contrast color on top,
   so it stays readable no matter what its underlying syntax color was. */
#caretlayer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none}
.caret-block{position:absolute;background:var(--accent)}
.caret-glyph{
  position:absolute;height:var(--lh);line-height:var(--lh);
  font-family:var(--font-mono);font-size:var(--fs);letter-spacing:var(--ls);
  color:var(--caret-glyph);white-space:pre;overflow:hidden;
}
.caret-ghost{
  position:absolute;height:var(--lh);line-height:var(--lh);
  font-family:var(--font-mono);font-size:var(--fs);letter-spacing:var(--ls);
  color:var(--dim);opacity:.55;white-space:pre;
}

/* results column */
#results{
  flex:0 0 var(--results-w);padding:var(--pad-y) 0;position:relative;z-index:2;
  border-left:1px solid var(--border-soft);user-select:none;min-height:100%;
}
.result-line{
  height:var(--lh);line-height:var(--lh);padding:0 12px;display:flex;justify-content:flex-start;
  align-items:center;position:relative;
}
.result-line .pill{
  max-width:100%;box-sizing:border-box;
  border:1px solid transparent;border-radius:999px;padding:0 11px;height:22px;line-height:21px;
  background:var(--pill-col);color:var(--text-strong);font-size:13.5px;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;transition:border-color .12s,background .12s,color .12s;
}
.result-line.has:hover .pill{background:var(--pill-col-hover);color:var(--text-strong)}
.result-line.copied .pill{background:var(--accent);color:#fff}
/* currency conversion result: gold-tinted pill */
.result-line .pill.cur{background:color-mix(in srgb, var(--cur) 20%, transparent);color:var(--cur)}
.result-line.has:hover .pill.cur{background:color-mix(in srgb, var(--cur) 30%, transparent)}
/* calc error: a muted "??" token, not copyable */
.result-line .pill.err{background:var(--danger-soft);color:var(--danger);cursor:default}
/* gentle fade when a result value appears or changes (only the changed pill) */
@keyframes pill-fade{from{opacity:.15}to{opacity:1}}
.result-line .pill.changed{animation:pill-fade .28s ease}

/* The swatch grid of the tag colour picker — limited to the app's base
   palette, so no colour outside it can enter a document. */
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.sw{width:22px;height:22px;border-radius:6px;cursor:pointer;border:1px solid var(--border)}
.sw:hover{transform:scale(1.12)}
.sw.sel{box-shadow:0 0 0 2px var(--bg-panel),0 0 0 3px var(--text-strong)}
.sw.clear{display:grid;place-items:center;background:var(--bg-editor);color:var(--dim);font-size:13px}
/* inline picker under the tag form; toggled by the swatch button / a chip dot */
.tag-swatches{margin:0 0 12px;padding:8px;border:1px solid var(--border-soft);border-radius:8px}
.tag-swatches[hidden]{display:none}

/* line context menu (delete completed) */
#linemenu,#docmenu{
  position:fixed;z-index:50;background:var(--bg-panel);border:1px solid var(--border);
  border-radius:10px;padding:5px;box-shadow:0 12px 34px rgba(0,0,0,.5);display:none;min-width:160px;
}
#linemenu.open,#docmenu.open{display:block}
.lm-item{
  display:block;width:100%;text-align:left;background:none;border:0;border-radius:7px;
  padding:8px 10px;font-size:13px;color:var(--text);cursor:pointer;
}
.lm-item:hover{background:var(--bg-editor)}
.lm-item.danger:hover{background:var(--danger-soft);color:var(--danger)}

/* confirmation modal */
#confirm-overlay{
  position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);
  display:none;align-items:center;justify-content:center;
}
#confirm-overlay.open{display:flex}
#confirm-box{
  background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;
  padding:20px;max-width:340px;width:calc(100% - 40px);box-shadow:0 20px 60px rgba(0,0,0,.55);
}
#confirm-msg{margin:0 0 18px;font-size:14px;color:var(--text);line-height:1.5}
.confirm-actions{display:flex;justify-content:flex-end;gap:9px}
.confirm-actions button{
  border:1px solid var(--border);background:var(--bg-editor);color:var(--text);
  border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;
}
.confirm-actions button:hover{border-color:var(--dim)}
.confirm-actions button.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.confirm-actions button.danger:hover{filter:brightness(1.08)}

/* toast */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--bg-panel);border:1px solid var(--border);color:var(--text);
  padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.45);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:720px){
  /* Tighten the top bar so the whole row (calcuta · Задачи · Личное ·
     поиск) fits without a horizontal scroll on phones. */
  .topbar{gap:5px;padding:0 8px}
  .brand-name{font-size:14px}
  .doc-tabs{gap:3px;margin-left:10px}
  .doc-tab{padding:5px 8px;max-width:120px}
  /* Bigger, more legible scale on phones — fewer lines fit vertically, which
     is the intended trade-off. font-size ≥16px also stops iOS from auto-
     zooming when the editor is focused. */
  :root{--fs:16px;--lh:28px;--results-w:104px}
  /* no results-column drag on phones */
  #results-resize{display:none}
  /* Every focusable text field must be ≥16px on iOS, otherwise Safari
     auto-zooms the whole page when the field gains focus (the loupe search,
     the tag-name box, inline document rename, and the Ctrl+F find field). */
  #docfind-input,
  .tag-form input[type=text],
  .doc-name-input,
  #findbar input{font-size:16px}
}

/* ---------- auth gate (Google sign-in) ----------
   Hidden by default. It used to default to display:flex, so an opaque overlay
   covered the app until Firebase Auth answered — even though load() had
   already read localStorage and rendered the editor underneath it. A returning
   user therefore waited on a network round trip to see notes that were sitting
   right there. Now boot() adds .show only when there is genuinely nothing to
   show (no prior session on this device and no local content). */
#authgate{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;
  background:var(--bg);}
#authgate.show{display:flex;}
.authgate-card{width:min(340px,86vw);text-align:center;padding:36px 28px;border:1px solid var(--border);
  border-radius:14px;background:var(--bg-panel);}
/* wordmark styled like the top-bar brand (mono, lowercase), scaled up for the
   login card hero */
.authgate-brand{font-family:var(--font-mono);font-weight:600;font-size:24px;
  color:var(--text-strong);letter-spacing:.5px;margin-bottom:4px}
.authgate-sub{margin-top:6px;font-size:12.5px;color:var(--dim);line-height:1.5}
.authgate-btn{margin-top:22px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;color:#1f1f1f;
  font-size:13.5px;font-weight:500;cursor:pointer;transition:filter .12s}
.authgate-btn:hover{filter:brightness(.95)}
.authgate-btn:disabled{opacity:.5;cursor:default}
.authgate-status{margin-top:14px;min-height:16px;font-size:11.5px;color:var(--dim)}
/* banner shown when viewing a shared "#doc=" link (read-only, no account) */
.shared-banner{position:fixed;left:0;right:0;bottom:0;z-index:9998;display:flex;align-items:center;gap:12px;
  padding:10px 16px;background:var(--bg-panel);border-top:1px solid var(--border);box-shadow:0 -6px 20px rgba(0,0,0,.25)}
.shared-banner .sb-txt{flex:1 1 auto;font-size:13px;color:var(--dim);font-family:var(--font-ui)}
.shared-banner .sb-btn{flex:0 0 auto;background:var(--accent);color:#fff;border:0;border-radius:7px;
  padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font-ui)}
.shared-banner .sb-btn:hover{filter:brightness(1.06)}
</style>

<script>
"use strict";
(function(){

/* ================================================================
   [ENGINE] — number formatting & math evaluation
   ================================================================ */

const NBSP = ' ';           // narrow no-break space — visual thousands separator
const GROUP_RE = new RegExp(NBSP, 'g');
const OSP  = ' ';      // U+00A0: padding older builds put around operators / "()"; never inserted any more
/* Formatter whitespace = characters the app inserts and owns. Only the digit
   grouping is left, and regroupText() re-derives it from the digits on every
   pass, so it can never be orphaned. U+00A0 is no longer one: dropPadding()
   removes old padding and turns any other U+00A0 into a plain space. */
function isFmtWS(ch){ return ch===NBSP; }

/* ---------- memoized word-boundary regexes ----------
   The tag/variable painters build a lookbehind regex per tag and per variable
   name — inside a loop that runs once per line. With 10 tags and 10 variables
   on a 300-line note that was ~6000 RegExp compilations per keystroke, all for
   the same handful of words, and all using \p{L} property escapes plus
   lookbehind (V8's slow path). The key IS the word, so nothing ever needs
   invalidating; the size cap only bounds a user with very many distinct
   variable names. */
const _reCache = new Map();
function _re(key, build){
  let r = _reCache.get(key);
  if(!r){ if(_reCache.size > 400) _reCache.clear(); r = build(); _reCache.set(key, r); }
  return r;
}
/* (?<![\p{L}\d_]) word (?![\p{L}\d_]) */
function wordBoundRe(word, flags){
  return _re('w\u0000'+flags+'\u0000'+word,
    ()=>new RegExp('(?<![\\p{L}\\d_])'+escapeRe(word)+'(?![\\p{L}\\d_])', flags));
}
/* (?<![\p{L}\d_ OSP]) / OSP? label (?![\p{L}\d_]) — the "/tag" spotlight trigger */
function slashTrigRe(label){
  return _re('t\u0000'+label,
    ()=>new RegExp('(?<![\\p{L}\\d_'+OSP+'])/'+OSP+'?'+escapeRe(label)+'(?![\\p{L}\\d_])','iu'));
}
const SENT = '\u2063';     // invisible marker: a copied result → inline pill
function isCore(ch){ return !isFmtWS(ch) && ch!==SENT; }
const TAG_SPOTLIGHT_ALPHA = 0.18;   // whole-line tint strength for an active "/tag" spotlight
const EMPTY_VARS = new Set(), EMPTY_OBJ = {};   // shared read-only fallbacks for sections with no vars

/* Group the integer part every 3 digits with NBSP. */
function groupDigits(intStr){
  return intStr.replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
}

/* Format a JS number for display: grouped integer, comma decimal. */
function fmt(n){
  if(n===null||n===undefined||!isFinite(n)) return '';
  const neg = n<0; let x = Math.abs(n);
  // results show at most 2 decimals (trailing zeros trimmed: 17,60 → 17,6, 3 → 3)
  let s = x.toFixed(2);
  s = s.replace(/\.?0+$/,'');           // trim trailing zeros / dot
  let [intPart, frac] = s.split('.');
  intPart = groupDigits(intPart);
  let out = intPart + (frac ? (','+frac) : '');
  return (neg?'-':'') + out;
}

/* Plain copy form: comma decimal, no grouping spaces. */
function plain(n){ return fmt(n).replace(GROUP_RE,''); }

/* Parse a numeric literal (already isolated) into a JS number.
   Accepts NBSP/space grouping and comma decimal; suffix k/M. */
function parseNum(raw){
  let s = raw.replace(GROUP_RE,'').replace(/\s/g,'');
  let mult = 1;
  const suf = s.slice(-1);
  if(suf==='k'||suf==='K'){ mult=1e3; s=s.slice(0,-1); }
  else if(suf==='M'){ mult=1e6; s=s.slice(0,-1); }
  s = s.replace(',', '.');
  const v = parseFloat(s);
  return isFinite(v) ? v*mult : NaN;
}

/* ---- Date detection: dd.mm with a 2-digit month. The 2-digit-month rule
   keeps dot-decimals ("3.14", "1234.56", "12.5") from being mistaken for
   dates — only a genuine "dd.mm" (e.g. "12.05") stays a date. ---- */
const DATE_SRC = '(\\d{1,2})\\.(\\d{2})(?:\\.(\\d{2,4}))?(?!\\d)';
function isDateMatch(d,m){ d=+d;m=+m; return d>=1&&d<=31&&m>=1&&m<=12; }
/* Sticky twin of DATE_SRC. dateAt() used to compile a fresh RegExp on every
   call AND be handed a fresh `s.slice(i)` — and it is called once per document
   character by five separate scanners, so that was the single hottest line in
   the file. dateAtIdx() anchors at an index instead: no allocation either side.
   dateAt(s) is kept as the offset-0 form for the __calcuta seam and callers
   that genuinely hold a standalone string. */
const DATE_AT_RE = new RegExp(DATE_SRC, 'y');
function dateAtIdx(s, i){
  DATE_AT_RE.lastIndex = i;
  const m = DATE_AT_RE.exec(s);
  return (m && isDateMatch(m[1], m[2])) ? m : null;
}
function dateAt(s){ return dateAtIdx(s, 0); }
function normYear(y){ y=+y; return y<100 ? 2000+y : y; }
/* A whole-line date range "21.08 - 25.08" -> number of days between them (4).
   Optional years; without years, an end earlier than the start wraps to next
   year ("25.12 - 05.01" = 11). Returns a day count or null (not a range). */
const DATE_RANGE_RE = new RegExp('^'+DATE_SRC+'\\s*[-\\u2013\\u2014]\\s*'+DATE_SRC+'$');
function dateRangeDays(s){
  const m = s.trim().match(DATE_RANGE_RE);
  if(!m) return null;
  if(!isDateMatch(m[1],m[2]) || !isDateMatch(m[4],m[5])) return null;
  const nowY = new Date().getFullYear();
  const y1 = m[3] ? normYear(m[3]) : nowY;
  const d1 = new Date(y1, +m[2]-1, +m[1]);
  let y2 = m[6] ? normYear(m[6]) : y1;
  let d2 = new Date(y2, +m[5]-1, +m[4]);
  if(!m[6] && d2 < d1) d2 = new Date(y1+1, +m[5]-1, +m[4]);   // wrap to next year
  const days = Math.round((d2 - d1) / 86400000);
  return isFinite(days) ? days : null;
}

/* ---- Number token regex.
   Alt 1: space-grouped thousands ("2 500 000", "1 234,5"). The separator class
   covers every space web/office content uses for digit grouping (U+0020,
   U+00A0, U+2007-U+200A, U+202F, U+205F) so numbers stay recognized even when
   text arrived without paste normalization (old app versions, cloud sync).
   A separator only joins when EXACTLY three digits follow, so U+00A0 operator
   padding ("100 + 200") can never glue numbers together.
   Alt 2: plain / NBSP-run / suffixed ("2500000", "500k", "12,5"). ---- */
const NUM_RE = /\d{1,3}(?:[ \u00a0\u2007\u2008\u2009\u200a\u202f\u205f]\d{3})+(?:[.,]\d+)?|\d[\d\u202f]*(?:[.,]\d+)?(?:[kKM])?/;
// Sticky twins of NUM_RE, anchored at an index instead of at the start of a
// freshly allocated tail string. The three call sites below sit inside
// per-character loops, where `new RegExp(...)` + `slice(i)` on every character
// was costing more than the matching itself.
const NUM_AT_RE = new RegExp('(?:'+NUM_RE.source+')', 'y');
const SIGNED_NUM_AT_RE = new RegExp('-?(?:'+NUM_RE.source+')', 'y');

/* ================================================================
   Tokenizer for math evaluation.
   Produces a flat token list; unknown words are dropped ("context").
   `vars` is a Set of known variable names (lower-cased).
   ================================================================ */
// Aggregation keywords (English + Russian aliases). NB: "итог/итого" are
// intentionally NOT keywords — they are commonly used as variable names.
const KEYWORDS = new Set([
  'sum','total','subtotal','сумм','сумма','сумму',
  'prev','previous','пред','предыдущее','предыдущий',
  'avg','average','mean','сред','среднее','средн'
]);

/* ================================================================
   [CURRENCY] Convert руб / USD / EUR at the OFFICIAL ЦБ РФ daily rate
   (cbr-xml-daily.ru — CORS-enabled mirror of the Central Bank fixing).
   Accuracy: the exact ЦБ rate. It updates ONCE per business day (~11:30 MSK),
   not intraday — so this is the accounting/reference rate, NOT a live exchange
   (MOEX) quote. Rates are cached in localStorage and refreshed hourly; a fresh
   rate re-renders open conversions and the hover popup.
   ================================================================ */
/* Currency slash-commands. Typing "/usd", "/euro" or "/yuan" (word-boundary
   aware, exactly like the "/tag" and "/dd.mm" triggers) shows the live ЦБ РФ
   rate in the results column as "1 <sym> = x ₽". Currency conversion of amounts
   no longer exists — these commands are the whole currency feature. */
const CUR_CMDS = [
  ['dollar','USD','$'],['usd','USD','$'],['доллар','USD','$'],
  ['euro','EUR','€'],['eur','EUR','€'],['евро','EUR','€'],
  ['yuan','CNY','¥'],['cny','CNY','¥'],['юань','CNY','¥'],
].sort((a,b)=>b[0].length-a[0].length);
/* A "/usd|/euro|/yuan" command at position i → {len,code,sym} or null. Same
   boundary rules as tagTriggerLenAt, so it's never tokenized as a division. */
function curCmdAt(text, i){
  if(text[i]!=='/') return null;
  const before = text[i-1]||' ';
  if(/[\p{L}\d_]/u.test(before) || before===OSP) return null;
  const skipOSP = text[i+1]===OSP ? 1 : 0;
  const start = i+1+skipOSP;
  for(const [w,code,sym] of CUR_CMDS){
    if(text.substr(start, w.length).toLowerCase()!==w) continue;
    const after = text[start+w.length]||' ';
    if(!/[\p{L}\d_]/u.test(after)) return { len:1+skipOSP+w.length, code, sym };
  }
  return null;
}
/* First currency command present on a line (or null). */
function lineCurCmd(text){
  for(let i=0;i<text.length;i++){ const c=curCmdAt(text,i); if(c) return {code:c.code, sym:c.sym}; }
  return null;
}
// FX: RUB per 1 unit of the currency (RUB itself = 1)
let fxRates={ RUB:1, USD:0, EUR:0, CNY:0 };
let fxMeta ={ date:'', fetchedAt:0, source:'ЦБ РФ', ok:false };
function loadFxCache(){
  try{ const c=JSON.parse(localStorage.getItem('calcuta.fx')||'null');
    if(c && c.rates && c.rates.USD){ fxRates=c.rates; fxMeta=c.meta||fxMeta; } }catch(e){}
}
/* The ЦБ РФ fixing changes once per business day, and most documents never
   mention a currency at all — yet this used to fire on every launch and again
   every hour, with {cache:'no-store'} defeating the HTTP cache each time.
   maybeRefreshFx() is called from render() instead: it goes to the network
   only when a rate command is actually on screen and the cache has aged out. */
const FX_MAX_AGE = 6*3600*1000;
let fxFetching=false;
function maybeRefreshFx(needed){
  if(!needed || fxFetching) return;
  if(fxMeta.ok && (Date.now()-fxMeta.fetchedAt) < FX_MAX_AGE) return;
  fetchFx();
}
function fetchFx(){
  fxFetching=true;
  fetch('https://www.cbr-xml-daily.ru/daily_json.js')
    .then(r=>r.ok?r.json():null)
    .then(d=>{
      if(!d || !d.Valute || !d.Valute.USD || !d.Valute.EUR) return;
      const rate=v=>v?v.Value/(v.Nominal||1):0;
      fxRates={ RUB:1, USD:rate(d.Valute.USD), EUR:rate(d.Valute.EUR), CNY:rate(d.Valute.CNY) };
      fxMeta={ date:(d.Date||'').slice(0,10), fetchedAt:Date.now(), source:'ЦБ РФ', ok:true };
      try{ localStorage.setItem('calcuta.fx', JSON.stringify({rates:fxRates, meta:fxMeta})); }catch(e){}
      if(typeof render==='function' && typeof input!=='undefined') render();
    }).catch(()=>{}).then(()=>{ fxFetching=false; });
}


function tokenizeMath(text, vars){
  const toks = [];
  let i=0; const n=text.length;
  // Build a sorted list of var names (longest first) for greedy matching.
  const varNames = [...vars].sort((a,b)=>b.length-a.length);
  while(i<n){
    const c = text[i];
    if(c===' '||c==='\t'||c===OSP||c===SENT){ i++; continue; }
    // URL -> skip entirely (its dots/slashes/digits are not math)
    const ul = urlLenAt(text, i);
    if(ul){ i+=ul; continue; }
    // date -> skip (treated as context for math)
    const dm = dateAtIdx(text, i);
    if(dm){ i+=dm[0].length; continue; }
    // "/tagname" spotlight trigger -> skip entirely, never a division op
    const tl = tagTriggerLenAt(text, i);
    if(tl){ i+=tl; continue; }
    // "/dd.mm" date-spotlight trigger -> skip entirely, never a division op
    const dl = dateTriggerLenAt(text, i);
    if(dl){ i+=dl; continue; }
    // "/usd" | "/euro" | "/yuan" currency command -> skip, never a division op
    const cc0 = curCmdAt(text, i);
    if(cc0){ i+=cc0.len; continue; }
    // "()" round-marker -> skip entirely, never an empty group
    if(c==='(' && text[i+1]===')'){ i+=2; continue; }
    // number
    NUM_AT_RE.lastIndex = i;
    const nm = NUM_AT_RE.exec(text);
    if(nm && /\d/.test(nm[0])){ toks.push({t:'num',v:parseNum(nm[0]),s:i,e:i+nm[0].length}); i+=nm[0].length; continue; }
    // operators & parens
    if('+-*/^()'.includes(c)){ toks.push({t:c,s:i,e:i+1}); i++; continue; }
    if(c==='x'||c==='X'){ // 'x' as multiply only between values
      const prev=toks[toks.length-1];
      const nextCh=text[i+1]||'';
      if(prev&&(prev.t==='num'||prev.t===')'||prev.t==='var'||prev.t==='agg')&&/[\s\d(]/.test(nextCh)){
        toks.push({t:'*',s:i,e:i+1}); i++; continue;
      }
    }
    if(c==='%'){ toks.push({t:'%',s:i,e:i+1}); i++; continue; }
    // word: keyword / variable / 'of' / context
    const wm = text.slice(i).match(/^[\p{L}\p{L}_][\p{L}\d_]*/u);
    if(wm){
      // try greedy multi-word variable match starting here
      let matchedVar = matchVarAt(text, i, varNames);
      if(matchedVar){ toks.push({t:'var',name:matchedVar.name,s:i,e:i+matchedVar.len}); i+=matchedVar.len; continue; }
      const w = wm[0].toLowerCase();
      const prev = toks[toks.length-1];
      const prevIsValue = prev && (prev.t==='num'||prev.t===')'||prev.t==='var'||prev.t==='agg'||prev.t==='%');
      // 'of' is the percent-of operator ONLY right after a value ("20% of 500").
      // In prose ("The Buddha of Suburbia (1993)") it used to become a dangling
      // operator that made the whole line unparseable — killing the result and
      // the number highlight. Now such an 'of' is plain context.
      if(w==='of'){ if(prevIsValue) toks.push({t:'of',s:i,e:i+wm[0].length}); i+=wm[0].length; continue; }
      if(KEYWORDS.has(w)){ toks.push({t:'agg',v:w,s:i,e:i+wm[0].length}); i+=wm[0].length; continue; }
      i+=wm[0].length; continue; // context word -> ignore
    }
    i++; // unknown char -> skip
  }
  // Post-pass: an aggregation keyword sitting right NEXT to a value in the
  // token stream ("сумма заказа 1 500" → [agg,num], "1500 сумма" → [num,agg],
  // "сумма (1+2)" → [agg,(...]) could never parse — evaluate() always returned
  // null, so the line lost its result and its numbers stayed unhighlighted.
  // Such a keyword is prose context, not an aggregation: drop the token.
  // Real aggregation lines (keyword alone, or with operators: "sum", "sum*2",
  // "sum - 100") keep their agg token unchanged.
  for(let k=toks.length-1;k>=0;k--){
    if(toks[k].t!=='agg') continue;
    const nx=toks[k+1], pv=toks[k-1];
    const nxIsValue=nx && (nx.t==='num'||nx.t==='var'||nx.t==='agg'||nx.t==='(');
    const pvIsValue=pv && (pv.t==='num'||pv.t===')'||pv.t==='var'||pv.t==='%');
    if(nxIsValue||pvIsValue) toks.splice(k,1);
  }
  return toks;
}

/* Match the longest known variable name at position i (word-boundary aware). */
function matchVarAt(text, i, varNames){
  const before = text[i-1]||' ';
  if(/[\p{L}\d_]/u.test(before)) return null; // must start at a word boundary
  for(const name of varNames){
    const seg = text.substr(i, name.length);
    if(seg.toLowerCase()===name){
      const after = text[i+name.length]||' ';
      if(!/[\p{L}\d_]/u.test(after)) return {name, len:name.length};
    }
  }
  return null;
}

/* Match a "/tagname" spotlight trigger at position i (word-boundary aware,
   like matchVarAt). Returns the matched length (consumed chars) or 0.
   Exists so a tag whose label collides with a variable name never gets
   tokenized as real division ("1000 /budget" must not compute 1000/budget).
   Mirrors activeSpotlightTags' OSP handling: older builds' operator padding
   masked a glued number ("1000/tag") by inserting OSP right before "/", so
   that must be rejected as a word boundary here (it's a fake one); an OSP
   right after "/" is just padding noise around a real trigger and is
   optionally consumed instead of counted as part of the label gap. */
function tagTriggerLenAt(text, i){
  if(text[i]!=='/') return 0;
  const before = text[i-1]||' ';
  if(/[\p{L}\d_]/u.test(before) || before===OSP) return 0; // must start at a real word boundary
  const skipOSP = text[i+1]===OSP ? 1 : 0;
  const labelStart = i+1+skipOSP;
  for(const tag of store.tags){
    if(!tag.label) continue;
    const seg = text.substr(labelStart, tag.label.length);
    if(seg.toLowerCase()===tag.label.toLowerCase()){
      const after = text[labelStart+tag.label.length]||' ';
      if(!/[\p{L}\d_]/u.test(after)) return 1+skipOSP+tag.label.length;
    }
  }
  return 0;
}

/* Match a "/dd.mm" date-spotlight trigger at position i — same shape as
   tagTriggerLenAt, but the "label" is a valid date matched via dateAt()
   instead of a fixed tag word. Guarantees "/27.06" is never tokenized as
   division, even when it's glued right after a number ("1000 /27.06"). */
function dateTriggerLenAt(text, i){
  if(text[i]!=='/') return 0;
  const before = text[i-1]||' ';
  if(/[\p{L}\d_]/u.test(before) || before===OSP) return 0; // must start at a real word boundary
  const skipOSP = text[i+1]===OSP ? 1 : 0;
  const dm = dateAtIdx(text, i+1+skipOSP);
  if(dm) return 1+skipOSP+dm[0].length;
  return 0;
}

/* ================================================================
   Recursive-descent parser over the token list.
   Values carry a `pct` flag for percentage semantics.
   Returns a JS number or null.
   ================================================================ */
/* Sentinel: a CLEANLY parsed expression that produced a non-finite value
   (division by zero, overflow). Distinct from null ("no expression at all")
   so the results column can show "??" for a real error but stay blank for a
   plain text line. Contained entirely within evaluate()/evaluateLenient(). */
const EVAL_ERR = {__err:true};
function evaluate(toks, scope, ctx){
  let p=0;
  const peek=()=>toks[p];
  const next=()=>toks[p++];
  const EOF={};   // sentinel: input ran out mid-expression (e.g. trailing "25 +")

  function val(v,pct){ return {v, pct:!!pct}; }
  function num(node){ return node.pct ? node.v/100 : node.v; }

  function parseExpr(){ return parseAdd(); }

  function parseAdd(){
    let a=parseMul();
    while(peek() && (peek().t==='+'||peek().t==='-')){
      const op=next().t;
      let b; try{ b=parseMul(); }catch(e){ if(e===EOF) return a; throw e; }
      if(b.pct)      a=val(op==='+'? a.v + a.v*b.v/100 : a.v - a.v*b.v/100);
      else if(a.pct) a=val(op==='+'? a.v/100 + b.v    : a.v/100 - b.v);
      else           a=val(op==='+'? a.v + b.v         : a.v - b.v);
    }
    return a;
  }
  function parseMul(){
    let a=parseUnary();
    while(peek() && (peek().t==='*'||peek().t==='/'||peek().t==='of')){
      const op=next().t;
      let b; try{ b=parseUnary(); }catch(e){ if(e===EOF) return a; throw e; }
      if(op==='of') a=val((a.pct? a.v/100 : a.v) * b.v);
      else if(op==='*') a=val(num(a)*num(b));
      else a=val(num(a)/num(b));
    }
    return a;
  }
  function parseUnary(){
    if(peek() && peek().t==='-'){ next(); const u=parseUnary(); return val(-u.v, u.pct); }
    if(peek() && peek().t==='+'){ next(); return parseUnary(); }
    return parsePow();
  }
  function parsePow(){
    let a=parsePostfix();
    if(peek() && peek().t==='^'){
      next();
      let b; try{ b=parseUnary(); }catch(e){ if(e===EOF) return a; throw e; }
      return val(Math.pow(num(a),num(b)));
    }
    return a;
  }
  function parsePostfix(){
    let a=parsePrimary();
    while(peek() && peek().t==='%'){ next(); a=val(a.v, true); }
    return a;
  }
  function parsePrimary(){
    const tk=peek();
    if(!tk) throw EOF;
    if(tk.t==='num'){ next(); return val(tk.v); }
    if(tk.t==='('){ next(); const e=parseExpr(); if(peek()&&peek().t===')') next(); else throw 0; return e; }
    if(tk.t==='var'){ next(); const key=tk.name.toLowerCase();
      const v=scope[key]; if(v===undefined||v===null||isNaN(v)) throw 0; return val(v); }
    if(tk.t==='agg'){ next();
      const w=tk.v;
      if(w==='prev'||w==='previous'||w==='пред'||w==='предыдущее'||w==='предыдущий')
        return val(ctx.prev==null?0:ctx.prev);
      const arr=ctx.contig;             // only the contiguous run directly above
      if(w==='avg'||w==='average'||w==='mean'||w==='сред'||w==='среднее'||w==='средн')
        return val(arr.length? arr.reduce((s,x)=>s+x,0)/arr.length : 0);
      return val(arr.reduce((s,x)=>s+x,0)); // sum/total/subtotal + сумм/сумма
    }
    throw 0;
  }

  try{
    if(toks.length===0) return null;
    const r=parseExpr();
    if(p!==toks.length) return null;      // leftover tokens -> not a clean expression
    const out = r.pct ? r.v/100 : r.v;
    return isFinite(out) ? out : EVAL_ERR;   // clean expr, bad value -> error
  }catch(e){ return null; }
}

/* Lenient wrapper around evaluate(): the strict path first (zero behavior
   change for any line that already computes). When strict parsing fails on
   leftover tokens, split the stream into segments at value|value boundaries
   ("85 - 92 (1992)" -> [85-92] [(1992)]), drop segments that are standalone
   parenthesized groups (no operator attaches them to the rest -> they simply
   don't participate), and evaluate what remains if it is unambiguous. This
   is why "album 85 - 92 (1 992)" now yields -7 instead of a dead line.
   Returns {v, range}; `range` is the [start,end) char span (in the tokenized
   string's coordinates) of the winning segment, or null when the whole line
   participated - the highlighter uses it to leave ignored numbers unpainted. */
function evaluateLenient(toks, scope, ctx){
  const direct = evaluate(toks, scope, ctx);
  if(direct===EVAL_ERR) return {v:null, range:null, err:true};
  if(direct!==null || toks.length===0) return {v:direct, range:null};
  const endsVal  = t=>t==='num'||t===')'||t==='%'||t==='var'||t==='agg';
  const startsVal= t=>t==='num'||t==='('||t==='var'||t==='agg';
  const segs=[]; let start=0;
  for(let k=1;k<toks.length;k++)
    if(endsVal(toks[k-1].t)&&startsVal(toks[k].t)){ segs.push(toks.slice(start,k)); start=k; }
  segs.push(toks.slice(start));
  if(segs.length<2) return {v:null, range:null};
  const isParen=s=>s[0].t==='(' && s[s.length-1].t===')';
  const rest=segs.filter(s=>!isParen(s));
  let target=null;
  if(rest.length===1) target=rest[0];
  else if(rest.length===0){
    // Every segment is a parenthesized group: pick the first one that actually
    // computes. A word-only group like "(Blackstar)" drops its word in
    // tokenization, leaving an empty "()" that evaluates to null — skip it
    // instead of letting it kill the line, so "(Blackstar) приоритет (2 016)"
    // yields 2016 rather than a dead line.
    for(const s of segs){ if(evaluate(s, scope, ctx)!==null){ target=s; break; } }
  }
  if(!target) return {v:null, range:null};
  const v=evaluate(target, scope, ctx);
  if(v===EVAL_ERR) return {v:null, range:null, err:true};
  return v===null ? {v:null, range:null}
                  : {v, range:[target[0].s, target[target.length-1].e]};
}

/* ================================================================
   Line classification & document analysis.
   ================================================================ */
const CB_RE   = /^(\s*)\[([ xX])\]\s?/;     // checkbox marker
const SUPER_RE= /^(\s*)#\s?/;               // supertask heading #
const HEADER_RE=/^(\s*)\/\/\s?/;            // note //  (kind 'header' is historical: it is the inert note)

function classify(line){
  let m;
  if((m=CB_RE.exec(line)))    return {kind:'checkbox', checked:/x/i.test(m[2]), markerLen:m[0].length, indent:m[1].length};
  if((m=SUPER_RE.exec(line))) return {kind:'super', markerLen:m[0].length};
  if((m=HEADER_RE.exec(line)))return {kind:'header', markerLen:m[0].length};
  return {kind:'text', markerLen:0};
}

/* Group 2 is an optional "()" round-marker between the name and "=" (e.g.
   "переменная () = 1000 * 1.25") - without it, "()" there would make the
   whole line fail to match at all (parens aren't in the name charset),
   silently dropping the assignment and the name's highlighting with it.
   NB: "//" is deliberately NOT in the prefix group - a "//" line is a note
   and must never define a variable or touch math in any way. */
/* The right side may be EMPTY: a bare "переменная =" with nothing typed yet
   (or whose expression continues on the next line) still counts as a real
   assignment - it's the "declared, value not entered yet" state, treated as
   0 until a real expression is typed (see the empty-rhs branch in analyze()). */
const ASSIGN_RE = /^\s*(?:\[[ xX]\]\s?|#\s?)?([\p{L}][\p{L}\d _]*?)\s*(\(\))?\s*=\s*(.*)$/u;
function assignHead(line){
  const m=ASSIGN_RE.exec(line);
  if(!m) return null;
  const name=m[1].trim().toLowerCase();
  if(!name || /^\d/.test(name) || KEYWORDS.has(name)) return null;
  return {name, roundMark:!!m[2], rhs:m[3]};
}
/* Multi-line variable assignment. After "имя =", the expression may continue
   onto the following physical lines (single Enter). Each continuation line is
   folded into the RHS as if it were one line, up until an EMPTY line (the "two
   line breaks in a row" the user asked to stop the chain), a "#" heading or "//" note,
   a checkbox, or a new "y =" assignment. A line is folded only while the joined
   expression is still "open" — the RHS so far ends on an operator, or the
   continuation begins with one (or the head's own RHS is empty) — so an ordinary
   independent calc line sitting right below an assignment is NOT swallowed.

   Two different kinds of "open" are folded differently:
   - the RHS trails off mid-expression (ends on an operator, or an unclosed
     "(" from any earlier line) → it's genuinely ONE expression split across
     lines by Enter, so the continuation is appended as plain text and normal
     operator precedence still applies within it ("500 +\n200 * 2" is
     500+(200*2), same as "500 + 200 * 2" on one line).
   - the RHS so far is already a complete, balanced expression and the new
     line simply opens with its own operator ("500 + 200\n-100\n/наценка") →
     each such line is its OWN top-to-bottom step applied to the running
     total, not a term in one flat expression - "-100" must subtract from the
     already-computed 700, never bind to "200" first via precedence. The
     running total is wrapped in "(...)" before appending so the existing
     evaluator's normal precedence rules do the strict left-to-right chaining
     for free, with no separate accumulator logic needed.
   Returns {heads:{idx->{name,roundMark,rhs,span}}, consumed:Set(idx)}. */
const OPEN_END_RE   = /[-+*\/^(]$/;      // RHS still waiting for more:  … +   … *   … (
const OPEN_START_RE = /^[-+*\/^%)]/;     // continuation opens with an operator
function parenDepth(s){ let d=0; for(let k=0;k<s.length;k++){ if(s[k]==='(') d++; else if(s[k]===')') d--; } return d; }
function computeAssignments(lines){
  const heads={}; const consumed=new Set();
  for(let i=0;i<lines.length;i++){
    if(consumed.has(i)) continue;
    const h=assignHead(lines[i]);
    if(!h) continue;
    let rhs=stripLineComment(h.rhs).trim();
    const span=[];
    for(let j=i+1;j<lines.length;j++){
      const ln=lines[j];
      if(ln.trim()==='') break;                 // empty line → chain stops (two \n in a row)
      if(classify(ln).kind!=='text') break;     // //, #, [ ] break the chain
      if(assignHead(ln)) break;                  // a new "y =" starts its own assignment
      const c=stripLineComment(ln).trim();
      const trailing = rhs==='' || OPEN_END_RE.test(rhs) || parenDepth(rhs)>0;
      const open = trailing || OPEN_START_RE.test(c);
      if(!open) break;                           // independent calc line below → leave it alone
      rhs = rhs==='' ? c : trailing ? rhs+' '+c : '('+rhs+') '+c;
      span.push(j);
    }
    // registered even when rhs stayed empty (no continuation line took it) -
    // a bare "имя =" is still a real, zero-valued assignment (see analyze()).
    heads[i]={name:h.name, roundMark:h.roundMark, rhs, span}; for(const s of span) consumed.add(s);
  }
  return {heads, consumed};
}

/* A "#" supertask line starts a brand-new variable-scope section (itself
   included); everything before the first "#" is section 0. Sections let
   the same variable name hold independent values under different "#"
   headings without colliding. */
function computeSections(lines){
  const sec=new Array(lines.length);
  let cur=0;
  for(let i=0;i<lines.length;i++){
    if(classify(lines[i]).kind==='super') cur++;
    sec[i]=cur;
  }
  return sec;
}

/* Collect variable-assignment names per section (mirrors the old whole-doc
   collectVars, just bucketed) so a name is only "variable-shaped" for the
   highlighter/tokenizer within the section that actually defines it. */
function collectVarsBySection(lines, secOf, heads){
  const bySec={};
  // `heads` already holds every assignment name (single- and multi-line),
  // so a bare "переменная =" that continues on the next line is registered too.
  for(const idx in heads){
    const s=secOf[+idx];
    (bySec[s] || (bySec[s]=new Set())).add(heads[idx].name);
  }
  return bySec;
}

/* Rounding marker: a literal "()" anywhere on the line rounds that line's
   computed result UP to the nearest 10 (1343 -> 1350, 15203551.58 ->
   15203560). tokenizeMath already skips "()" entirely (never an empty
   group), so detection here is a plain substring check independent of
   tokenization. */
function hasRoundMarker(s){
  // "()" inside a URL (site.com/path()) is link content, not a round marker —
  // the tokenizer/formatter already skip URLs, so the round check must too.
  if(s.indexOf('()')===-1) return false;
  let t=s;
  const rs=urlRanges(s);           // hoisted from [EDITOR]; same skip-set as tokenizeMath
  if(rs.length){ let out='', prev=0; for(const r of rs){ out+=s.slice(prev,r.start); prev=r.end; } t=out+s.slice(prev); }
  return t.indexOf('()')!==-1;
}
function applyRoundMarker(v){ return Math.ceil(v/10)*10; }

/* Analyze the full document top-to-bottom, producing per-line results.
   Variables are scoped per "#" section: each section gets its own `scope`
   (assignment values) and `varDefLine` (name -> first defining line index
   within that section), so the same name can hold a different value in
   parallel under a different heading. */
function analyze(text, pairAt){
  const lines=text.split('\n');
  // `pairAt`: offset of a "(" whose ")" autoPair just inserted, caret still
  // between them. That "()" is a bracket pair being typed, not the round
  // marker, so it must not round its line - unless the line has another "()".
  let pairLine=-1;
  if(pairAt>=0){
    let off=0;
    for(let k=0;k<lines.length;k++){
      const L=lines[k];
      if(pairAt<off+L.length){ const c=pairAt-off; if(L.slice(c,c+2)==='()' && (L.slice(0,c)+L.slice(c+2)).indexOf('()')<0) pairLine=k; break; }
      off+=L.length+1;
    }
  }
  const secOf=computeSections(lines);
  const {heads, consumed}=computeAssignments(lines);
  const varsBySection=collectVarsBySection(lines, secOf, heads);
  const scopesBySection={};
  const varDefLineBySection={};
  // `contig` = results of the unbroken run of lines directly above; a blank
  // line or a heading (// or #) breaks the run so `sum` only adds a column.
  const ctx={contig:[], prev:null};
  const out=[];

  lines.forEach((line, idx)=>{
    const cls=classify(line);
    const sec=secOf[idx];
    const content=line.slice(cls.markerLen);
    // A line folded into a preceding multi-line assignment's RHS (an expression
    // that kept going after "имя =" via single Enters) doesn't compute or
    // aggregate on its own — it only renders, with its numbers still lit.
    if(consumed.has(idx)){
      out.push({raw:line, cls, content, result:null, assignedName:null, calcRange:null, error:false, dateCount:false, currency:null, section:sec, contLine:true});
      return;
    }
    const vars=varsBySection[sec] || (varsBySection[sec]=new Set());
    const scope=scopesBySection[sec] || (scopesBySection[sec]={});
    const varDefLine=varDefLineBySection[sec] || (varDefLineBySection[sec]={});
    const isBlank=line.trim()==='';
    let result=null, assignedName=null, calcRange=null, error=false, dateCount=false;

    // run boundary: blank line or "#" heading resets the contiguous block.
    // A "//" note is transparent: it neither contributes nor breaks the
    // run, so sum/avg/prev see straight through it.
    if(isBlank || cls.kind==='super'){ ctx.contig=[]; }

    // assignment? (single-line, or multi-line with a folded RHS)
    const head=heads[idx];
    if(head && head.span.length>0){
      // multi-line: "имя =" whose expression spans several physical lines.
      // head.rhs is the already-joined, comment-stripped expression.
      const name=head.name, rhsCode=head.rhs;
      const toks=tokenizeMath(rhsCode, vars);
      const lr=evaluateLenient(toks, scope, ctx);
      let v=lr.v;
      const pend=(pairLine===idx || head.span.includes(pairLine)) && rhsCode.split('()').length===2;
      if(v!==null && !pend && (head.roundMark||hasRoundMarker(rhsCode))) v=applyRoundMarker(v);
      if(v!==null){ scope[name]=v; result=v; assignedName=name;
        const eq=line.lastIndexOf('='); if(eq>=0 && eq+1<line.length) calcRange=[eq+1, line.length]; }
      else if(lr.err) error=true;
      if(varDefLine[name]===undefined) varDefLine[name]=idx;
    } else {
      const am=ASSIGN_RE.exec(line);
      if(am){
        const name=am[1].trim().toLowerCase();
        if(name && !/^\d/.test(name) && !KEYWORDS.has(name)){
          const rhs=am[3];
          const rhsCode=stripLineComment(rhs);   // "x = 121 440 //note" -> "x = 121 440"
          if(rhsCode.trim()===''){
            // "имя =" with nothing typed after it yet: still a real
            // assignment (green, pill/backspace rules apply everywhere it's
            // used) with an implicit 0 - but nothing computed to show, so the
            // results column for THIS line stays empty (no calcRange).
            scope[name]=0; assignedName=name;
          } else {
            const toks=tokenizeMath(rhsCode, vars);
            const lr=evaluateLenient(toks, scope, ctx);
            let v=lr.v;
            if(v!==null && idx!==pairLine && (am[2]||hasRoundMarker(rhsCode))) v=applyRoundMarker(v);
            if(v!==null){ scope[name]=v; result=v; assignedName=name;
              // rhs runs to end of line, so its offset within the line is exact
              if(lr.range){ const off=line.length-rhs.length; calcRange=[lr.range[0]+off, lr.range[1]+off]; } }
            else if(lr.err) error=true;
          }
          if(varDefLine[name]===undefined) varDefLine[name]=idx;
        }
      }
    }

    if(result===null && !assignedName && cls.kind!=='super' && cls.kind!=='header'){
      const contentCode=stripLineComment(content);
      const toks=tokenizeMath(contentCode, vars);
      const lr=evaluateLenient(toks, scope, ctx);
      result=lr.v;
      if(result!==null && idx!==pairLine && hasRoundMarker(contentCode)) result=applyRoundMarker(result);
      if(result!==null && lr.range) calcRange=[lr.range[0]+cls.markerLen, lr.range[1]+cls.markerLen];
      if(result===null && lr.err) error=true;
      // a bare "dd.mm - dd.mm" range (no math) reports its day count
      if(result===null && !error){
        const dr=dateRangeDays(contentCode);
        if(dr!==null){ result=dr; dateCount=true; }
      }
    }

    // currency slash-command: "/usd" | "/euro" | "/yuan" on a non-heading,
    // non-assignment line shows the live rate ("1 <sym> = x ₽") in the results
    // column instead of any math result. Recomputed on every render, so an
    // hourly rate refresh live-updates both new and past lines.
    let rateCmd=null;
    if(cls.kind!=='super' && cls.kind!=='header' && !assignedName){
      rateCmd = lineCurCmd(stripLineComment(content));
      if(rateCmd) result=null;   // the rate display takes the results slot
    }

    // feed aggregation (skip boundary/heading lines and rate-command lines)
    if(result!==null && !rateCmd && cls.kind!=='super' && cls.kind!=='header'){
      ctx.contig.push(result);
      ctx.prev=result;
    }

    out.push({raw:line, cls, content, result, assignedName, calcRange, error, dateCount, rateCmd, section:sec});
  });

  return {lines:out, varsBySection, varDefLineBySection, scopesBySection};
}

/* ================================================================
   [HIGHLIGHT] — build colored spans per line, respecting priority:
   var > tag > super/header(line) > date > number > operator > text
   Also returns token ranges for hover source-mapping.
   ================================================================ */
function esc(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* Pair up "(" and ")" within [start,end), giving each matched pair a nesting
   depth (so the highlighter can tint corresponding brackets the same colour,
   depth 0 = outermost) and a partner index (so clicking/moving the caret onto
   one bracket can locate and highlight the other). Returns matched brackets
   only; unmatched ones are absent from both maps. */
const BRK_N=3;   // number of cycling bracket colours (--brk0..--brk2)
function bracketPairs(text, start, end){
  const depth=new Map(), partner=new Map(); const stack=[];
  for(let k=start;k<end;k++){
    const c=text[k];
    if(c==='(') stack.push(k);
    else if(c===')' && stack.length){
      const o=stack.pop();
      depth.set(o, stack.length); depth.set(k, stack.length);
      partner.set(o, k); partner.set(k, o);
    }
  }
  return {depth, partner};
}

function buildLineHTML(item, vars, varDefLine, tags, activeTags, activeDates){
  const {raw, cls} = item;
  const len=raw.length;
  const hasResult = item.result!==null || item.contLine;   // computes, or is folded into a multi-line assignment
  // When the lenient evaluator ignored part of the line (a standalone paren
  // group like "(1 992)"), only the participating span gets number/operator
  // colors; the ignored group stays plain text, numbr-style.
  const cr = item.calcRange;
  const inCalc = k => !cr || (k>=cr[0] && k<cr[1]);
  // char-class array; higher priority overrides
  const P={base:0, num:1, date:2, op:3, label:4, quote:5, cur:5.5, tag:6, varr:7, link:8, doclink:9, cmt:10};
  const cclass=new Array(len).fill('');   // css class per char
  const cmeta =new Array(len).fill(null); // {type, defLine} for hover
  const prio  =new Array(len).fill(-1);
  const color =new Array(len).fill(null); // inline color (tags)
  const pill  =new Array(len).fill(false);// number is a copied result → pill

  function paint(s,e,cls,pr,meta,col){
    for(let k=s;k<e&&k<len;k++){
      if(pr>=prio[k]){ prio[k]=pr; cclass[k]=cls; cmeta[k]=meta||cmeta[k]; color[k]=col||null; }
    }
  }

  // inline "//" note tail (text/checkbox lines only): computed once here,
  // painted over everything at the end, reused by the spotlight checks below
  const cmtStart=(cls.kind!=='super'&&cls.kind!=='header') ? lineCommentStart(raw) : -1;

  const markerLen=cls.markerLen;
  // Only checkboxes render their marker separately; super/header render the
  // whole line (marker included) so char widths match the textarea exactly.
  const bodyStart=(cls.kind==='checkbox')?markerLen:0;

  // ---- whole-line styles for super/header (include the # or // marker) ----
  if(cls.kind==='super'){ paint(0,len,'super',P.base); }
  else if(cls.kind==='header'){ paint(0,len,'header',P.base); }

  const scanText=raw;

  // ---- numbers (blue, only when the line computes) & dates (always) ----
  if(cls.kind!=='super'&&cls.kind!=='header'){
    let i=bodyStart;
    while(i<len){
      const ul=urlLenAt(scanText,i);
      if(ul){ i+=ul; continue; }   // digits/dots inside a URL aren't numbers or dates
      const dm=dateAtIdx(scanText, i);
      if(dm){ paint(i,i+dm[0].length,'date',P.date,{type:'date'}); i+=dm[0].length; continue; }
      NUM_AT_RE.lastIndex=i;
      const nm=NUM_AT_RE.exec(scanText);
      if(nm && /\d/.test(nm[0]) && !/[\p{L}_]/u.test(scanText[i-1]||' ')){
        if(hasResult && inCalc(i)) paint(i,i+nm[0].length,'num',P.num,{type:'num'});
        i+=nm[0].length; continue;
      }
      i++;
    }
    // ---- operators: working arithmetic signs green (only when computing);
    //      grouping/assignment ( ) = stay muted ----
    // A matched bracket pair gets a per-depth colour ONLY when it actually
    // takes part in the line's math (both ends fall inside calcRange, the
    // same span whose numbers turn blue) — a pair that merely brackets a word
    // ("заметка (важно) 100 + 50") stays plain text, like the word inside it.
    // Checked on "mathy" lines (a digit or arithmetic sign is present), so
    // prose parentheticals never even get considered — and it still works
    // while an expression is being typed, before it computes (no result yet):
    // calcRange is null until a partial lenient match narrows it, and inCalc()
    // treats null as "the whole line", so brackets stay lit while typing.
    // Unmatched brackets and "=" stay muted/plain, not part of a coloured pair.
    const brkEnd = cmtStart<0 ? len : cmtStart;
    if(/[\d+\-*\/^%]/.test(scanText.slice(bodyStart, brkEnd))){
      const {depth:brk, partner}=bracketPairs(scanText, bodyStart, brkEnd);
      for(let k=bodyStart;k<brkEnd;k++){
        const ch=scanText[k];
        if((ch==='('||ch===')') && prio[k]<P.op){
          const d=brk.get(k);
          if(d!==undefined && inCalc(k) && inCalc(partner.get(k)))
            paint(k,k+1, 'brk'+(d%BRK_N), P.op, {type:'brk', partner:partner.get(k)});
        }
      }
    }
    if(hasResult){
      for(let k=bodyStart;k<len;k++){
        const ch=scanText[k];
