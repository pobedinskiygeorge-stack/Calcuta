/* mousedown on a variable pill blocks the browser's default caret placement
   there (a plain click should only copy, not also start editing); click/
   dblclick above decide what actually happens. */
function onStackMouseDown(e){
  const {row,col}=hitTestChar(e.clientX,e.clientY);
  if(varPillHit(row,col,e.clientX,e.clientY)) e.preventDefault();
}
/* Double-click on a variable pill cancels the pending copy and places the
   caret at the exact double-click position instead, for normal editing. */
function onStackDblClick(e){
  const {row,col}=hitTestChar(e.clientX,e.clientY);
  if(!varPillHit(row,col,e.clientX,e.clientY)) return;
  clearTimeout(pillClickTimer);
  input.focus();

  input.setSelectionRange(off,off);
}

/* ---------- hover: row lighten + source-line highlight ---------- */
let hoverRow=-1, srcRow=-1;

  txt = txt.replace(/(?<![\d.,])\d{1,3}(?:\.\d{3}){2,}(?!\d)/g, s => s.replace(/\./g,''));
  // 1) normalize the non-breaking / narrow / thin / figure spaces web content
  //    uses for grouping into a regular space, then 2) collapse genuine
  //    space-grouped thousands ("1 234 567,89" → "1234567,89") so the
  //    decimal-aware pass sees a clean number (a lone "17 6" is NOT collapsed —
  //    "6" isn't a 3-digit group).
  txt = txt.replace(/[\u00a0\u2007\u2008\u2009\u200a\u202f\u205f]/g, ' ');
  txt = txt.replace(/\d{1,3}(?: \d{3})+(?:[.,]\d+)?/g, s => s.replace(/ /g, ''));
  return txt.replace(/\d[\d.,]*\d|\d/g, (m)=>{
    const dm=dateAt(m); if(dm && dm[0]===m) return m;   // keep pure dates
    const lastSep=Math.max(m.lastIndexOf(','), m.lastIndexOf('.'));
    let intp, frac='';
    if(lastSep>=0){
      const tail=m.slice(lastSep+1);
      if(/^\d+$/.test(tail)){ intp=m.slice(0,lastSep).replace(/[.,]/g,''); frac=tail; }
      else { intp=m.replace(/[.,]/g,''); }
    } else { intp=m; }
    if(!/^\d+$/.test(intp)) return m;
    return groupDigits(intp)+(frac?(','+frac):'');
  });
}

function copyText(t){

  else fallbackCopy(t);

function fallbackCopy(t){

  // a copy never visibly moves the user's caret (this path also runs LATE -
  // as the async .catch of navigator.clipboard - so callers can't restore).

}

function applyResultsWidth(w){
  bumpLayout();   // the text column narrows/widens, so every line can re-wrap
  if(window.innerWidth<=720){

    // width from the mobile media query governs instead.

    computeCharsPerLine();

  }

function initResultsResize(){
  const rz=$('results-resize'); let dragging=false;
  const move=(e)=>{
    if(!dragging) return;
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const w=editor.getBoundingClientRect().right - cx;
    store.resultsWidth=Math.max(90, Math.min(560, w));
    applyResultsWidth(store.resultsWidth);
    render();                  // live rewrap as the results column is dragged wider/narrower
    if(e.cancelable) e.preventDefault();
  };
  const stop=()=>{ if(dragging){ dragging=false; rz.classList.remove('dragging'); document.body.style.userSelect=''; persist(); } };
  rz.addEventListener('mousedown', e=>{ dragging=true; rz.classList.add('dragging'); document.body.style.userSelect='none'; e.preventDefault(); });

  document.addEventListener('mousemove', move);
  document.addEventListener('touchmove', move, {passive:false});
  document.addEventListener('mouseup', stop);
  document.addEventListener('touchend', stop);
}

/* ================================================================
   [SYNC] Merge-based cloud sync.

   The cloud doc holds the whole store as JSON. Rather than whole-store
   last-write-wins (which loses edits made on another device, is defeated by
   client-clock skew, and lets a freshly-seeded device's stock docs clobber
   real data), we MERGE PER DOCUMENT by each doc's own `updated` timestamp,
   with tombstones for deletions. Seeded stock docs carry updated:0 so a real
   cloud copy of the same doc always wins. The merge is deterministic and
   commutative, so every device converges to the same result. activeId and
   resultsWidth stay device-local (which doc you're viewing / how wide your
   results column is shouldn't jump around between devices).

   CRUCIALLY, the merge runs on the WRITE side too: every upload is a Firestore
   transaction that reads the current server copy, merges, and writes the
   result. A blind whole-store set() — what pushCloud() used to do — is
   last-write-wins at store level: a device that had not yet SEEN the latest
   cloud version (a laptop woken from overnight sleep, a cold cache, a write
   queued offline days ago) overwrote every newer edit in one shot. That was
   the "edited at work, came home, the stale Mac clobbered it" failure. With
   read-merge-write, a push physically cannot erase data it hasn't observed,
   no matter how stale the device is.
   ================================================================ */
let cloudRef=null, cloudReady=false, cloudSaveTimer=null;
/* Wall-clock of the last time THIS device read authoritative (non-cache)
   server state — via the snapshot listener, a wake-up pull, or a successful
   transactional push (whose tx.get is a server read). Gates the one remaining
   non-merging write path (keepaliveFlush). */
let serverSeenAt=0;

/* Canonical doc order: stock docs pinned first, then others by id (uid()
   encodes creation time), so all devices order identically → convergence. */
function orderDocs(docs){
  const rank=d=> d.protected==='tasks'?0 : d.protected==='personal'?1 : 2;
  return docs.slice().sort((a,b)=>{
    const ra=rank(a), rb=rank(b);
    if(ra!==rb) return ra-rb;
    return a.id<b.id?-1:(a.id>b.id?1:0);
  });
}
function docSig(d){ return JSON.stringify({n:d.name||'',t:d.text||''}); }

/* Deterministic, commutative per-document merge of two stores. */
function mergeStores(local, remote){
  local=local||{}; remote=remote||{};
  const tomb={};
  const addTomb=m=>{ if(m&&typeof m==='object') for(const id in m) tomb[id]=Math.max(tomb[id]||0, m[id]||0); };
  addTomb(local.deletedDocs); addTomb(remote.deletedDocs);

  const byId=new Map();
  const consider=d=>{
    if(!d||!d.id) return;
    const ex=byId.get(d.id);
    if(!ex){ byId.set(d.id,d); return; }
    const du=d.updated||0, eu=ex.updated||0;
    // higher timestamp wins; on an exact tie, break by content so the choice
    // is independent of argument order (keeps the merge commutative).
    if(du>eu || (du===eu && docSig(d)>docSig(ex))) byId.set(d.id,d);
  };
  (local.docs||[]).forEach(consider);
  (remote.docs||[]).forEach(consider);

  const docs=[];
  for(const [id,d] of byId){
    if(!d.protected && (tomb[id]||0) >= (d.updated||0)) continue;   // deletion wins
    docs.push(d);
  }
  // prune tombstones that no longer suppress anything (doc re-created/edited
  // after the delete, or a protected doc that can't really be deleted).
  for(const id in tomb){
    const d=byId.get(id);
    if(d && (d.protected || (d.updated||0) > tomb[id])) delete tomb[id];
  }

  // Tags merge PER TAG (keyed by lowercased label) with tombstones — exactly
  // like docs. Whole-list last-write-wins used to silently drop a tag added on
  // one device (and was defeated by client-clock skew, the same reason docs
  // moved off it). Now additions on different devices union, and a delete only
  // wins over versions of the tag at-or-older than the tombstone.
  const tagTomb={};
  const addTagTomb=m=>{ if(m&&typeof m==='object') for(const k in m) tagTomb[k]=Math.max(tagTomb[k]||0, m[k]||0); };
  addTagTomb(local.deletedTags); addTagTomb(remote.deletedTags);
  const tagByLabel=new Map();
  const considerTag=t=>{
    if(!t||!t.label) return;
    const k=t.label.toLowerCase();
    const ex=tagByLabel.get(k);
    if(!ex){ tagByLabel.set(k,t); return; }
    const tu=t.updated||0, eu=ex.updated||0;
    if(tu>eu || (tu===eu && JSON.stringify(t)>JSON.stringify(ex))) tagByLabel.set(k,t);
  };
  (local.tags||[]).forEach(considerTag);
  (remote.tags||[]).forEach(considerTag);
  const tags=[];
  for(const [k,t] of tagByLabel){
    if((tagTomb[k]||0) >= (t.updated||0)) continue;   // deletion wins
    tags.push(t);
  }
  for(const k in tagTomb){
    const t=tagByLabel.get(k);
    if(t && (t.updated||0) > tagTomb[k]) delete tagTomb[k];   // re-added after delete
  }
  // deterministic order (creation time, then label) so devices converge
  tags.sort((a,b)=>((a.updated||0)-(b.updated||0)) || (a.label.toLowerCase()<b.label.toLowerCase()?-1:1));

  const merged={
    docs: orderDocs(docs),
    deletedDocs: tomb,
    tags: tags,
    tagsUpdated: Math.max(local.tagsUpdated||0, remote.tagsUpdated||0),
    deletedTags: tagTomb,
    // Hard-save epoch is monotonic: whoever last pressed "save to all devices"
    // wins, and the value only ever climbs so a stale merge can't undo it.
    forceEpoch: Math.max(local.forceEpoch||0, remote.forceEpoch||0),
  };
  merged.updated=Date.now();
  return merged;
}

/* Canonical serialization of just the fields that should sync (device-local
   prefs excluded) so we can tell whether a merge actually changed anything
   versus the cloud — used to avoid pointless re-upload ping-pong. */
function syncPayload(s){
  const docs=(s.docs||[]).slice().sort((a,b)=>a.id<b.id?-1:1)
    .map(d=>({id:d.id,name:d.name||'',text:d.text||'',protected:d.protected||null,updated:d.updated||0}));
  const tomb={}; Object.keys(s.deletedDocs||{}).sort().forEach(k=>tomb[k]=s.deletedDocs[k]);
  const tags=(s.tags||[]).slice()
    .sort((a,b)=>(a.label||'').toLowerCase()<(b.label||'').toLowerCase()?-1:1)
    .map(t=>({label:t.label||'',color:t.color||'',updated:t.updated||0}));
  const tagTomb={}; Object.keys(s.deletedTags||{}).sort().forEach(k=>tagTomb[k]=s.deletedTags[k]);
  return JSON.stringify({docs, deletedDocs:tomb, tags, tagsUpdated:s.tagsUpdated||0, deletedTags:tagTomb});
}

function parseRemote(raw){
  if(!raw||!raw.data) return null;
  let s; try{ s=JSON.parse(raw.data); }catch(e){ return null; }
  if(!s||!Array.isArray(s.docs)) return null;
  s.docs.forEach(d=>{
    if(!d.id) d.id=uid();
    if(d.protected && d.protected!=='tasks' && d.protected!=='personal') delete d.protected;
    // fold legacy pre-fixed-id stock docs (recognized by exact reserved name) into the canonical pinned slot
    if(!d.protected && d.name==='Задачи') d.protected='tasks';
    if(!d.protected && d.name==='Личное') d.protected='personal';
    d.id=canonicalDocId(d);
    if(typeof d.updated!=='number') d.updated=0;
  });
  if(!s.tags) s.tags=[];
  if(typeof s.tagsUpdated!=='number') s.tagsUpdated=0;
  // older cloud copies stored tags without per-tag timestamps
  s.tags.forEach(t=>{ if(typeof t.updated!=='number') t.updated = s.tagsUpdated||1; });
  if(!s.deletedDocs || typeof s.deletedDocs!=='object') s.deletedDocs={};
  if(!s.deletedTags || typeof s.deletedTags!=='object') s.deletedTags={};
  return s;
}

/* Adopt a merged store into the app without yanking text the user is actively
   editing. Device-local view prefs are preserved from the current session. */
function adoptMerged(merged){
  merged.activeId=store.activeId;
  merged.resultsWidth=store.resultsWidth;
  merged.pinned=store.pinned;                 // pins are device-local, like activeId
  if(!merged.tags) merged.tags=[];
  if(!merged.deletedTags || typeof merged.deletedTags!=='object') merged.deletedTags={};
  if(!merged.docs.length) merged.docs.push(makeTasksDoc());          // never end up doc-less
  if(!merged.docs.some(d=>d.id===merged.activeId)) merged.activeId=merged.docs[0].id;

  // Protect the open doc from an incoming overwrite ONLY while the user is
  // actually typing (recent edit + focus). Mere focus used to freeze the doc
  // forever — on phones the textarea keeps focus indefinitely, so an idle
  // device never showed edits made elsewhere, and its next keystroke pushed
  // the stale text back over them.
  // If the active doc vanished remotely (deleted elsewhere), merged.activeId
  // now points at a FALLBACK doc. The editing branch below must then be dead:
  // it writes input.value (the DELETED doc's text!) into whatever doc it finds
  // under merged.activeId — i.e. straight into the fallback, corrupting it.
  const activeVanished = (merged.activeId !== store.activeId);
  let editing = !activeVanished && (document.activeElement===input) && (Date.now()-lastEditAt < 4000);
  let suppressed=false;
  if(editing){
    const cur=store.docs.find(d=>d.id===merged.activeId);
    const inc=merged.docs.find(d=>d.id===merged.activeId);
    // keep the in-editor text/edit-time for the doc under the cursor; other
    // docs and metadata still update live. The user's next save re-uploads it.
    if(cur && inc){ suppressed=(inc.text!==input.value); inc.text=input.value; inc.updated=cur.updated; }
    else editing=false;
  }

  store=merged;
  saveLocal();
  applyResultsWidth(store.resultsWidth);
  renderTags(); renderDocs();
  if(editing) render();
  else{
    // keep the caret roughly in place when the editor is focused but idle
    const focused=(document.activeElement===input);
    const caret=focused ? input.selectionStart : 0;
    loadActiveIntoEditor();
    if(focused){ const c=Math.min(caret, input.value.length); input.setSelectionRange(c,c); }
  }
  return suppressed;
}

/* Wholesale adopt a hard-saved remote version — no merge, no editing
   protection. Only device-local view prefs (active tab, pins, column width)
   are kept; every synced field is replaced with the forced version. */
function adoptForced(remote){
  const next=remote;
  next.activeId=store.activeId;
  next.resultsWidth=store.resultsWidth;
  next.pinned=store.pinned;
  if(!next.tags) next.tags=[];
  if(!next.deletedTags || typeof next.deletedTags!=='object') next.deletedTags={};
  if(!next.docs.length) next.docs.push(makeTasksDoc());
  if(!next.docs.some(d=>d.id===next.activeId)) next.activeId=next.docs[0].id;
  store=next;
  saveLocal();
  applyResultsWidth(store.resultsWidth);
  renderTags(); renderDocs();
  loadActiveIntoEditor();
}

/* Listen to the cloud doc. The FIRST snapshot reconciles this device with the
   cloud (merge, adopt, and push back anything the cloud was missing); later
   snapshots are live updates from other devices. cloudReady gates uploads so
   a save can never race ahead of that first reconciliation and clobber the
   cloud with un-merged local (e.g. freshly-seeded) content. */
function subscribeCloud(){
  if(!db||!currentUser) return;
  cloudReady=false;
  cloudRef=db.collection('users').doc(currentUser.uid);
  let first=true;
  if(cloudUnsub){ cloudUnsub(); cloudUnsub=null; }
  cloudUnsub=cloudRef.onSnapshot({includeMetadataChanges:true}, snap=>{
    if(snap.metadata.hasPendingWrites) return;      // our own optimistic write echoing back
    // Only ever SEED against authoritative server data. A fromCache snapshot that
    // reports the doc MISSING can be a cold-cache lie (offline/blocked boot) — acting
    // on it would run the "cloud empty → seed it" branch and push THIS device's
    // freshly-seeded STOCK content over the real cloud, wiping the user's notes. So
    // that specific case still waits for the server.
    // BUT a fromCache snapshot that HAS data is safe to merge against (merge is
    // non-destructive), and crucially it lets a device whose live server channel is
    // slow or blocked (corporate firewall/VPN, weak mobile) still flip cloudReady and
    // START UPLOADING. The writes then enter Firestore's durable offline queue and
    // flush the moment connectivity returns — instead of sitting only in this
    // device's localStorage all session and dying when it's shut down (the exact
    // cross-device "my last edits didn't show up" failure). includeMetadataChanges
    // still delivers the later cache→server transition, which re-merges and corrects.
    if(!snap.metadata.fromCache) serverSeenAt=Date.now();
    if(snap.metadata.fromCache && !snap.exists) return;
    if(!snap.exists){
      if(first){ first=false; cloudReady=true; pushCloud(); }   // cloud truly empty (server-confirmed): seed it
      return;
    }
    const remote=parseRemote(snap.data());
    if(!remote){ if(first){ first=false; cloudReady=true; } return; }
    const diverged=reconcileRemote(remote);
    if(first){ first=false; cloudReady=true; }
    if(diverged) pushCloud();                        // cloud was missing some of our data → push merge
  }, syncError);
}

/* Reconcile a parsed remote store into this device: advance the clock, honor
   a newer hard-save wholesale, otherwise merge per doc. Returns true when the
   cloud is missing something we have (caller should push the merge back).
   Shared by the live snapshot listener and the wake-up server pull so both
   paths behave identically. */
function reconcileRemote(remote){
  snapStoreColors(remote);   // a device that hasn't migrated yet can still send legacy colours
  normalizeStoreDocs(remote);   // …and legacy-markup docs
  observeStore(remote);   // advance the logical clock past everything the cloud has seen
  // HARD SAVE from another device: a higher forceEpoch means "make every device
  // exactly this version". Adopt it wholesale, discarding any local divergence
  // (even mid-typing) — strict by design, the whole point of the button.
  if((remote.forceEpoch||0) > (store.forceEpoch||0)){
    adoptForced(remote);
    lastSyncedPayload=syncPayload(remote);
    return false;
  }
  const merged=mergeStores(store, remote);
  const suppressed=adoptMerged(merged);
  if(suppressed) deferRemote(remote);              // re-merge once typing pauses
  else { deferredRemote=null; clearTimeout(deferredTimer); }  // newer snapshot superseded any deferral
  const diverged = syncPayload(merged)!==syncPayload(remote);
  if(!diverged) lastSyncedPayload=syncPayload(merged);   // cloud already has everything → mark clean
  return diverged;
}

/* Actively pull the authoritative server copy and reconcile — called when the
   tab wakes up (visibilitychange→visible, pageshow) or connectivity returns.
   After hours of sleep the push channel can take seconds-to-forever to notice
   it is stale; until then this device would both SHOW old data and treat its
   old copy as current. One explicit server read closes that window. */
let serverPullInflight=false;
function refreshFromServer(){
  if(!db||!currentUser||!cloudRef||serverPullInflight) return;
  serverPullInflight=true;
  refreshIdToken();   // sleep can outlive the ~1h ID token; keepaliveFlush needs a live one
  cloudRef.get({source:'server'}).then(snap=>{
    serverSeenAt=Date.now();
    if(!snap.exists){ if(cloudReady && isCloudDirty()) pushCloud(); return; }
    const remote=parseRemote(snap.data());
    if(!remote) return;
    const diverged=reconcileRemote(remote);
    cloudReady=true;   // we reconciled against authoritative data — uploads are safe
    if(diverged) pushCloud();
  }).catch(()=>{}).then(()=>{ serverPullInflight=false; });
}

/* An update that arrives mid-typing is held off the active doc (the user's
   in-progress text wins the moment). Retry the merge after the typing window
   so the newer remote text still lands once the user pauses — otherwise it
   would be lost until some unrelated future snapshot. */
let deferredRemote=null, deferredTimer=null;
function deferRemote(remote){
  deferredRemote=remote;
  clearTimeout(deferredTimer);
  deferredTimer=setTimeout(function retry(){
    if(!deferredRemote) return;
    const m=mergeStores(store, deferredRemote);
    if(adoptMerged(m)){ deferredTimer=setTimeout(retry, 4500); return; }  // still typing
    deferredRemote=null;
    pushCloud();   // publish the settled merge so every device converges
  }, 4500);
}
// Dirtiness is derived from CONTENT, not a hand-toggled flag: lastSyncedPayload
// holds the syncPayload() string that the server last confirmed (via an ack or a
// non-diverged snapshot). isCloudDirty() = the store's current syncPayload differs
// from that. This is immune to debounce/timer interleaving that made a boolean
// flag unreliable. `everEdited` avoids warning on a no-edit offline close.
let lastSyncedPayload=null, everEdited=false, cachedIdToken=null;
function isCloudDirty(){ return !!currentUser && everEdited && syncPayload(store)!==lastSyncedPayload; }
/* Read-merge-write upload. The transaction's get() sees the CURRENT server
   copy (even one written seconds ago by another device that this device's
   listener hasn't delivered yet), merges per doc, and commits — Firestore
   retries the whole callback on a concurrent write, so the merge is always
   against the version that actually wins. Offline the transaction FAILS
   rather than queueing a blind overwrite (the durable-queued set() of the old
   implementation was itself a clobber vector: it could land days later on top
   of much newer data). Nothing is lost by failing: the edit is already in
   localStorage, and the retry timer / 'online' / wake-up paths re-push. */
let pushInflight=false, pushRetryTimer=null;
function pushCloudNow(){
  if(!db||!currentUser||!cloudRef||!cloudReady) return;
  if(pushInflight) return;               // the in-flight push re-checks dirtiness when it lands
  pushInflight=true;
  clearTimeout(pushRetryTimer);
  setSyncStatus('saving');
  let adopt=null, sent=null;
  db.runTransaction(tx=>tx.get(cloudRef).then(snap=>{
    adopt=null;                          // reset per attempt — the callback re-runs on contention
    const remote=snap.exists?parseRemote(snap.data()):null;
    if(remote){ snapStoreColors(remote); normalizeStoreDocs(remote); observeStore(remote); }
    if(remote && (remote.forceEpoch||0)>(store.forceEpoch||0)){
      adopt={forced:remote}; sent=syncPayload(remote);
      return;                            // a newer hard save stands — adopt it, write nothing
    }
    const next=remote?mergeStores(store,remote):store;
    sent=syncPayload(next);
    if(remote && sent!==syncPayload(store)) adopt={merged:next};   // remote had news for us
    tx.set(cloudRef,{ data: JSON.stringify(next), updated: Date.now() });
  })).then(()=>{
    serverSeenAt=Date.now();
    if(adopt){ if(adopt.forced) adoptForced(adopt.forced); else adoptMerged(adopt.merged); }
    lastSyncedPayload=sent;
    syncError(null); setSyncStatus('saved');
    pushInflight=false;
    // content-only dirtiness (no everEdited): the store can differ from the
    // cloud without a this-session edit (e.g. last session's data never made
    // it up), and the user may also have kept typing while we were in flight
    if(syncPayload(store)!==lastSyncedPayload) pushCloud();
  }).catch(err=>{
    pushInflight=false;
    syncError(err);
    clearTimeout(pushRetryTimer);        // offline/unreachable: localStorage has it — retry soon
    pushRetryTimer=setTimeout(()=>{ if(syncPayload(store)!==lastSyncedPayload) pushCloud(); }, 15000);
  });
}
function pushCloud(){
  if(!db||!currentUser||!cloudRef||!cloudReady) return;
  clearTimeout(cloudSaveTimer);
  setSyncStatus('saving');
  cloudSaveTimer=setTimeout(pushCloudNow, 500);
}
function cloudSave(){ everEdited=true; if(cloudReady) pushCloud(); }

/* HARD SAVE — make sure THIS device's current content lands on the cloud and
   every other device (on or off). Reads the server copy in a transaction,
   MERGES (so a stale device pressing the button cannot roll every other
   device back to an old version — the exact disaster a blind forced write
   makes possible), then stamps the merged result with a strictly-newer
   forceEpoch so all devices adopt exactly it, even mid-typing. Offline the
   transaction fails; the press is remembered and retried when connectivity
   returns. */
let hardSaveWait=null, hardSaveDoneTimer=null, hardSavePending=false;
function hardSave(){
  if(!db||!currentUser||!cloudRef) return;
  // Wait for the first reconciliation before writing (online only) so a
  // fresh device can't overwrite the real cloud with un-synced stock content.
  if(!cloudReady && navigator.onLine){
    setSyncStatus('saving');
    clearTimeout(hardSaveWait); hardSaveWait=setTimeout(hardSave, 300); return;
  }
  const btn=$('cloud-save'), done=$('cloud-done');
  everEdited=true; persist();
  clearTimeout(cloudSaveTimer);                                    // cancel any pending debounced push
  if(btn) btn.disabled=true;
  setSyncStatus('saving');
  let adopt=null, sent=null;
  db.runTransaction(tx=>tx.get(cloudRef).then(snap=>{
    const remote=snap.exists?parseRemote(snap.data()):null;
    if(remote){ snapStoreColors(remote); normalizeStoreDocs(remote); observeStore(remote); }
    const next=remote?mergeStores(store,remote):store;
    next.forceEpoch=Math.max(store.forceEpoch||0, (remote&&remote.forceEpoch)||0, Date.now())+1;
    adopt=next; sent=syncPayload(next);
    tx.set(cloudRef,{ data: JSON.stringify(next), updated: Date.now() });
  })).then(()=>{
      serverSeenAt=Date.now(); hardSavePending=false;
      adoptMerged(adopt);                // pick up anything newer the server had
      lastSyncedPayload=sent; syncError(null); setSyncStatus('saved');
      if(btn) btn.disabled=false;
      if(done) done.classList.add('show');
      clearTimeout(hardSaveDoneTimer);
      hardSaveDoneTimer=setTimeout(()=>{ if(done) done.classList.remove('show'); closeMenus(); }, 1900);
    })
    .catch(err=>{ if(btn) btn.disabled=false; hardSavePending=true; syncError(err); });
}
/* Immediate push — no debounce. For moments when timers are about to freeze
   (phone backgrounds the tab / page is closing): the 300ms save and 500ms
   push timers never fire there, so an edit made just before switching apps
   used to sit only in memory until the tab came back — or die with it.
   Dirty-gated: an idle tab (e.g. one that just woke from overnight sleep with
   a stale copy) must never write to the cloud "just in case". */
function flushSync(){
  clearTimeout(saveTimer); persist();
  if(!db||!currentUser||!cloudRef||!cloudReady) return;
  if(!isCloudDirty()) return;
  clearTimeout(cloudSaveTimer);
  pushCloudNow();
}
/* Keep a fresh bearer token cached so the keepalive close-flush below can send
   an authenticated REST write synchronously (getIdToken is async and can't be
   awaited during page unload). Firebase ID tokens live ~1h; refresh well inside
   that. */
function refreshIdToken(){
  if(!currentUser||!currentUser.getIdToken) return;
  currentUser.getIdToken().then(t=>{ cachedIdToken=t; }).catch(()=>{});
}
/* Reliable last-write on close. The SDK's set() above is async and the browser
   does NOT wait for pending network work when the page unloads (or the OS shuts
   down), so the final edit could be lost. A fetch(..., {keepalive:true}) IS
   allowed to outlive the page (up to ~64KB), so we write the current store
   straight to the Firestore REST API here. Authenticated with the cached token,
   so it passes the same per-user security rules as the SDK path. Skipped when
   oversized (keepalive cap) — the SDK path still covers that.

   This is the ONE remaining non-merging write (a single REST PATCH cannot
   read-merge-write), so it is double-gated: only when there is actually
   something unsynced to say (dirty), and only when this device has read
   authoritative server state moments ago (so its store is a superset of the
   cloud and the blind overwrite is safe). A tab that slept for hours fails
   the freshness gate and skips — nothing is lost, the edit lives in
   localStorage and the next wake-up/open merges it in properly. */
const KEEPALIVE_FRESH_MS=3*60*1000;
function keepaliveFlush(){
  if(!currentUser||!cachedIdToken||!navigator.onLine) return;
  if(!isCloudDirty()) return;
  if(Date.now()-serverSeenAt > KEEPALIVE_FRESH_MS) return;
  const body=JSON.stringify({ fields:{
    data:{ stringValue: JSON.stringify(store) },
    updated:{ integerValue: String(Date.now()) },
  }});
  if(body.length>60000) return;                       // keepalive body cap (~64KB) — leave margin
  const url='https://firestore.googleapis.com/v1/projects/'+firebaseConfig.projectId+
    '/databases/(default)/documents/users/'+currentUser.uid+
    '?updateMask.fieldPaths=data&updateMask.fieldPaths=updated';
  try{
    fetch(url,{ method:'PATCH', keepalive:true,
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cachedIdToken },
      body });
  }catch(e){}
}

function buildExportHTML(){
  const title=(doc()&&doc().name)||'Calcuta';
  let rows='';
  const kids=highlight.children;
  for(let k=0;k<kids.length;k++){
    const left=kids[k].innerHTML || '&nbsp;';
    const it=model && model.data.lines[k];
    const res = it ? (it.error ? '⁇' : (it.result!=null ? esc(fmt(it.result)) : '')) : '';
    // row-level classes ("superrow", "checked") live on the .hl-line wrapper,
    // whose innerHTML alone would drop them — carry them onto the cell
    const rowCls=kids[k].className.replace('hl-line','').trim();
    rows += '<tr><td class="lcell'+(rowCls?' '+rowCls:'')+'">'+left+'</td><td class="rcell">'+res+'</td></tr>';
  }
  return '<!doctype html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>'+exportStyleBlock()+'</style></head>'
       + '<body><h2>'+esc(title)+'</h2><table>'+rows+'</table></body></html>';
}
function safeName(){ return ((doc()&&doc().name)||'calcuta').replace(/[\\/:*?"<>|]+/g,'_').slice(0,60); }
function downloadBlob(filename, mime, content){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportWord(){
  render();   // make sure the overlay matches the current text
  downloadBlob(safeName()+'.doc', 'application/msword', buildExportHTML());
  showToast('Скачивается Word');
}
function exportPDF(){
  render();
  const html=buildExportHTML();
  // Print from a hidden same-origin iframe INSIDE the app — never open a
  // separate window/tab (on mobile that tab can replace the app with no way
  // back). The iframe is removed after printing, so the app is never left.
  const frame=document.createElement('iframe');
  frame.setAttribute('aria-hidden','true');
  frame.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0';
  frame.srcdoc=html;
  let cleaned=false;
  const cleanup=()=>{ if(cleaned) return; cleaned=true; setTimeout(()=>{ if(frame.parentNode) frame.remove(); }, 800); };
  frame.onload=()=>{
    try{
      const w=frame.contentWindow;
      w.onafterprint=cleanup;
      w.focus();
      w.print();
    }catch(e){ cleanup(); }
    setTimeout(cleanup, 120000);   // safety net if onafterprint never fires
  };
  document.body.appendChild(frame);
  showToast('Печать в PDF');
}

/* ---- share a document via a compressed URL hash (no account needed) ---- */
async function gzipToB64(str){
  if(typeof CompressionStream==='undefined') return 'r'+btoa(unescape(encodeURIComponent(str)));  // raw fallback
  const cs=new CompressionStream('gzip');
  const w=cs.writable.getWriter(); w.write(new TextEncoder().encode(str)); w.close();
  const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());
  let bin=''; for(const b of buf) bin+=String.fromCharCode(b);
  return 'g'+btoa(bin);
}
async function b64ToText(tag){
  const kind=tag[0], b64=tag.slice(1);
  const bin=atob(b64);
  if(kind==='r') return decodeURIComponent(escape(bin));
  const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip');
  const w=ds.writable.getWriter(); w.write(bytes); w.close();
  return new Response(ds.readable).text();
}
let sharedMode=false;
/* Open a "#doc=<compressed>" share link as a read-only preview, bypassing the
   sign-in gate so it can be read without an account. "Сохранить у себя"
   imports it as a normal document (then the gate applies as usual). */
async function openSharedView(){
  const m=location.hash.match(/^#doc=(.+)$/);
  let data=null;
  if(m){ try{ data=JSON.parse(await b64ToText(decodeURIComponent(m[1]))); }catch(e){ data=null; } }
  if(!data || typeof data.t!=='string'){ initAuth(); return; }   // bad link -> normal app
  if((data.m|0)<MARKUP_V) data.t=upgradeMarkup(data.t, data.m|0);   // link made by an older build
  sharedMode=true;
  hideAuthGate();
  input.value=data.t; input.readOnly=true;
  render();
  const bar=document.createElement('div');
  bar.className='shared-banner';
  bar.innerHTML='<span class="sb-txt">Присланный расчёт'+(data.n?' · '+esc(data.n):'')+' — только просмотр</span>'
    +'<button class="sb-btn" id="sb-import" type="button">Сохранить у себя</button>';
  document.body.appendChild(bar);
  $('sb-import').addEventListener('click', ()=>importSharedDoc(data));
}
function importSharedDoc(data){
  const d={ id:uid(), name:data.n||'Присланный документ', text:data.t, updated:stamp(), markup:MARKUP_V };
  store.docs.push(d); store.activeId=d.id;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
  history.replaceState(null,'',location.pathname);   // drop the #doc= hash
  location.reload();                                 // reboot into the normal (gated) app
}
async function shareLink(){
  const d=doc(); if(!d) return;
  const payload=JSON.stringify({n:d.name||'Документ', t:input.value, m:MARKUP_V});
  const enc=await gzipToB64(payload);
  const base=location.origin+location.pathname;
  const url=base+'#doc='+encodeURIComponent(enc);
  copyText(url);
  showToast(url.length>1900 ? 'Ссылка скопирована (документ большой)' : 'Ссылка скопирована');
}

function boot(){

  // longer fired here — see maybeRefreshFx(), which only goes to the network
  // when the document actually contains a rate command and the cache is stale.

    openSharedView();   // read-only shared link — never touches Firebase
  }else{
    // Cover the app only when there is genuinely nothing to look at: no prior
    // session on this device AND no local content. Otherwise the editor is
    // live immediately and auth settles in the background.
    if(!wasSignedIn() && !hasLocalContent()) showAuthGate();
    // Load the SDK once the browser is idle, after the first paint.
    const startAuth=()=>loadFirebase().then(initAuth, ()=>initAuth());

  input.addEventListener('cut', stripOnCopy);

  stack.addEventListener('mouseleave', onStackLeave);
  stack.addEventListener('contextmenu', onStackCtx);
  stack.addEventListener('mousedown', onStackMouseDown);
  stack.addEventListener('click', onStackClick);
  stack.addEventListener('dblclick', onStackDblClick);
  stack.addEventListener('touchstart', onTouchStart, {passive:true});
  stack.addEventListener('touchmove', onTouchMove, {passive:true});
  stack.addEventListener('touchend', onTouchEnd);
  stack.addEventListener('touchcancel', onTouchEnd);

  hotspots.addEventListener('click', e=>{
    const hit=e.target.closest('.cbox-hit'); if(hit){ toggleCheckbox(+hit.dataset.i); }
  });

  // copying a result must not steal the caret: killing the mousedown's
  // default keeps focus in the editor (results are inert text anyway)
  results.addEventListener('mousedown', e=>e.preventDefault());
  results.addEventListener('click', onResultsClick);
  results.addEventListener('mouseover', onResultHover);
  results.addEventListener('mouseleave', onResultLeave);

  linemenu.addEventListener('click', e=>{
    const it=e.target.closest('.lm-item'); if(!it) return;
    if(it.dataset.act==='delete' && lineMenuTarget>=0) deleteLine(lineMenuTarget);
    closeLineMenu();
  });
  document.addEventListener('click', e=>{
    if(!linemenu.contains(e.target)) closeLineMenu();
    if(!docmenu.contains(e.target)) closeDocMenu();
  });
  document.addEventListener('contextmenu', e=>{
    if(!e.target.closest('#stack')&&!linemenu.contains(e.target)) closeLineMenu();
    if(!e.target.closest('#docfind-list')&&!e.target.closest('#pinned-tabs')&&!docmenu.contains(e.target)) closeDocMenu();
  });

  // add a tag by pressing Enter (the "+" button is gone)
  $('tag-name').addEventListener('keydown', e=>{ if(e.key==='Enter') addTag(); });
  // the new-tag swatch shows the pending colour and opens the base-palette grid
  paintTagSwatch();
  $('tag-swatch').addEventListener('click', e=>{ e.stopPropagation(); openTagPicker(null); });
  $('tag-swatches').addEventListener('click', e=>{
    const sw=e.target.closest('.sw'); if(!sw) return;
    e.stopPropagation(); pickTagColor(sw.dataset.c);
  });
  // tag list: delete via ×, recolour an existing tag via its colour dot
  $('tag-list').addEventListener('click', e=>{
    const dot=e.target.closest('.dot');
    if(dot){ e.stopPropagation(); openTagPicker(+dot.dataset.i); return; }
    const del=e.target.closest('.del'); if(!del) return;
    const i=+del.dataset.i, t=store.tags[i]; if(!t) return;
    const now=stamp();
    if(store.deletedTags) store.deletedTags[t.label.toLowerCase()]=now;   // tombstone so the delete syncs
    store.tags.splice(i,1); store.tagsUpdated=now; closeTagPicker(); renderTags(); render(); scheduleSave();
  });

  // theme + tags live in the calcuta dropdown; check-marks were set pre-paint
  applyTheme(currentTheme());

  // top-bar dropdown triggers (calcuta / documents-loupe)
  $('brand-btn').addEventListener('click', e=>{ e.stopPropagation(); toggleMenu('brand-menu'); });
  $('doc-find-btn').addEventListener('click', e=>{ e.stopPropagation(); toggleMenu('docfind-menu'); });
  // cloud icon → hard-save popover ("save this version to all devices")
  $('sync-status').addEventListener('click', e=>{ if(!currentUser) return; e.stopPropagation(); toggleMenu('cloud-menu'); });
  $('cloud-save').addEventListener('click', e=>{ e.stopPropagation(); hardSave(); });
  // right-click / long-press the active-doc slot → rename / delete it (the slot
  // only names an UNPINNED, non-stock doc; stock/pinned docs have their own tabs)
  $('doc-find-btn').addEventListener('contextmenu', e=>{
    const d=doc();
    if(!d || d.protected || (store.pinned||[]).includes(d.id)) return;
    e.preventDefault(); e.stopPropagation();
    closeMenus();
    openDocMenu(e.clientX, e.clientY, d.id);
  });
  // theme choice inside the calcuta menu (menu stays open for further tweaks)
  $('brand-menu').addEventListener('click', e=>{
    const th=e.target.closest('.theme-opt');
    if(th){ setTheme(th.dataset.theme); return; }   // stays open for further tweaks
    const it=e.target.closest('.doc-opt'); if(!it) return;
    if(it.id==='exp-word'){ exportWord(); closeMenus(); return; }
    if(it.id==='exp-pdf'){ exportPDF(); closeMenus(); return; }
    if(it.id==='share-link'){ shareLink(); closeMenus(); return; }
  });
  // pinned document tabs
  $('tab-tasks').addEventListener('click', ()=>switchDoc(TASKS_ID));
  $('tab-personal').addEventListener('click', ()=>switchDoc(PERSONAL_ID));
  // loupe popover = the document manager: search box, "+" creates, click on a
  // row opens (deferred so a dblclick can rename instead), × deletes
  $('doc-add').addEventListener('click', createDoc);
  // loupe unfolds the search box (explicit tap = explicit intent to type)
  $('docfind-loupe').addEventListener('click', ()=>{
    const bar=$('docfind-bar'), i=$('docfind-input');
    if(bar.classList.contains('open') && !i.value.trim()){ bar.classList.remove('open'); return; }
    bar.classList.add('open');
    i.focus();
  });
  // an emptied search box folds back behind the loupe when it loses focus
  $('docfind-input').addEventListener('blur', ()=>{
    if(!$('docfind-input').value.trim()) $('docfind-bar').classList.remove('open');
  });
  // pinned tabs: tap switches, right-click / long-press opens the doc menu
  $('pinned-tabs').addEventListener('click', e=>{
    if(Date.now()-pinTabTouchAt < 700) return;          // touchend already handled
    if(e.target.closest('.doc-name-input')) return;     // inline rename in progress
    const t=e.target.closest('.doc-tab'); if(t) switchDoc(t.dataset.id);
  });
  $('pinned-tabs').addEventListener('contextmenu', e=>{
    const t=e.target.closest('.doc-tab'); if(!t) return;
    e.preventDefault();
    openDocMenu(e.clientX, e.clientY, t.dataset.id);
  });
  let pinHoldTimer=null, pinHoldFired=false, pinX=0, pinY=0, pinMoved=false, pinTabTouchAt=0;
  const cancelPinHold=()=>{ if(pinHoldTimer){ clearTimeout(pinHoldTimer); pinHoldTimer=null; } };
  $('pinned-tabs').addEventListener('touchstart', e=>{
    const t=e.changedTouches[0]; pinX=t.clientX; pinY=t.clientY; pinMoved=false; pinHoldFired=false;
    cancelPinHold();
    const tab=e.target.closest('.doc-tab');
    if(tab && e.touches.length===1){
      const id=tab.dataset.id;
      pinHoldTimer=setTimeout(()=>{
        pinHoldTimer=null; pinHoldFired=true;
        openDocMenu(pinX, pinY, id);
        if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(err){} }
      }, 480);
    }
  }, {passive:true});
  $('pinned-tabs').addEventListener('touchmove', e=>{
    const t=e.changedTouches[0];
    if(Math.abs(t.clientX-pinX)>10 || Math.abs(t.clientY-pinY)>10){ pinMoved=true; cancelPinHold(); }
  }, {passive:true});
  $('pinned-tabs').addEventListener('touchend', e=>{
    cancelPinHold();
    if(pinHoldFired){ e.preventDefault(); return; }
    if(pinMoved) return;
    if(e.target.closest('.doc-name-input')) return;
    const tab=e.target.closest('.doc-tab'); if(!tab) return;
    e.preventDefault();
    pinTabTouchAt=Date.now();
    switchDoc(tab.dataset.id);
  });
  $('docfind-input').addEventListener('input', e=>{ docFindQuery=e.target.value; renderDocFind(); });
  $('docfind-input').addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); const first=$('docfind-list').querySelector('.doc-item'); if(first) switchDoc(first.dataset.id); }
    else if(e.key==='Escape'){ e.preventDefault(); closeMenus(); }
  });
  // Row interaction:
  //   • tap / left-click → open the document (first tap always lands: touch
  //     switches on a stationary touchend, before the trailing synthetic click
  //     a keyboard-dismiss reflow could swallow; a moved finger is a scroll).
  //   • long-press (touch) / right-click (mouse) → rename-or-delete menu.
  let touchHandledAt=0, tX=0, tY=0, tMoved=false, docHoldTimer=null, docHoldFired=false;
  const cancelDocHold=()=>{ if(docHoldTimer){ clearTimeout(docHoldTimer); docHoldTimer=null; } };
  $('docfind-list').addEventListener('touchstart', e=>{
    const t=e.changedTouches[0]; tX=t.clientX; tY=t.clientY; tMoved=false; docHoldFired=false;
    cancelDocHold();
    const item=e.target.closest('.doc-item');
    if(item && e.touches.length===1){
      const id=item.dataset.id;
      docHoldTimer=setTimeout(()=>{
        docHoldTimer=null; docHoldFired=true;
        touchHandledAt=Date.now();                      // arm the click-guard so the trailing synthetic click can't open the doc
        openDocMenu(tX, tY, id);                        // no-op for pinned docs
        if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(err){} }
      }, 480);
    }
  }, {passive:true});
  $('docfind-list').addEventListener('touchmove', e=>{
    const t=e.changedTouches[0];
    if(Math.abs(t.clientX-tX)>10 || Math.abs(t.clientY-tY)>10){ tMoved=true; cancelDocHold(); }
  }, {passive:true});
  $('docfind-list').addEventListener('touchend', e=>{
    cancelDocHold();
    if(docHoldFired){ e.preventDefault(); touchHandledAt=Date.now(); return; }   // long-press opened the menu — keep the doc from also opening
    if(tMoved) return;                                  // was a scroll, not a tap
    if(e.target.closest('.doc-name-input')) return;     // typing a new name
    const item=e.target.closest('.doc-item'); if(!item) return;
    e.preventDefault();                                 // suppress the trailing synthetic click
    touchHandledAt=Date.now();
    switchDoc(item.dataset.id);                          // immediate — first tap opens
  });
  $('docfind-list').addEventListener('click', e=>{
    if(Date.now()-touchHandledAt < 700) return;         // touchend already handled this tap
    if(e.target.closest('.doc-name-input')) return;     // typing a new name, not navigating
    const item=e.target.closest('.doc-item'); if(!item) return;
    switchDoc(item.dataset.id);
  });
  $('docfind-list').addEventListener('contextmenu', e=>{
    const item=e.target.closest('.doc-item'); if(!item) return;
    e.preventDefault();
    openDocMenu(e.clientX, e.clientY, item.dataset.id);  // no-op for pinned docs
  });
  // rename / delete from the document context menu
  docmenu.addEventListener('click', e=>{
    const btn=e.target.closest('.lm-item'); if(!btn) return;
    const id=docMenuTarget; closeDocMenu();
    if(!id) return;
    if(btn.dataset.act==='rename'){
      // rename where the doc actually lives: a pinned doc on its tab, a manager
      // list row in the popover, or the active UNPINNED doc right on its top-bar
      // pill (which has no tab/row).
      const pinnedTab=document.querySelector('#pinned-tabs .doc-tab[data-id="'+id+'"]');
      const listRow=document.querySelector('#docfind-list .doc-item[data-id="'+id+'"] .doc-name');
      if(pinnedTab) beginRename(id, pinnedTab);
      else if(listRow) beginRename(id, listRow);
      else if(doc() && doc().id===id) beginRenamePill(id);
    } else if(btn.dataset.act==='delete'){
      requestDeleteDoc(id);
    } else if(btn.dataset.act==='pin'){
      togglePin(id);
    }
  });
  // close any open dropdown on outside click / Escape
  document.addEventListener('click', e=>{
    // a click inside the doc context menu must not close the loupe under it
    if(openMenuId && !e.target.closest('.tb-menu') && !e.target.closest('#brand-btn,#doc-find-btn,#sync-status') && !e.target.closest('#docmenu')) closeMenus();
  });
  document.addEventListener('keydown', e=>{
    if(e.key!=='Escape') return;
    if(docmenu.classList.contains('open')){ closeDocMenu(); return; }   // Esc closes the doc menu first
    if(openMenuId) closeMenus();
  });

  // confirmation dialog
  $('confirm-ok').addEventListener('click', ()=>closeConfirm(true));
  $('confirm-cancel').addEventListener('click', ()=>closeConfirm(false));
  $('confirm-overlay').addEventListener('click', e=>{ if(e.target.id==='confirm-overlay') closeConfirm(false); });
  document.addEventListener('keydown', e=>{
    if(!$('confirm-overlay').classList.contains('open')) return;
    if(e.key==='Escape') closeConfirm(false);
    else if(e.key==='Enter') closeConfirm(true);
  });
  // find bar (Ctrl+F) — searches the current document
  const fi=$('find-input');
  fi.addEventListener('input', ()=>setSearchQuery(fi.value,'find'));
  fi.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); navigateSearch(e.shiftKey?-1:1); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); navigateSearch(1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); navigateSearch(-1); }
    else if(e.key==='Escape'){ e.preventDefault(); closeFind(); }
  });
  $('find-next').addEventListener('click', ()=>{ navigateSearch(1); fi.focus(); });
  $('find-prev').addEventListener('click', ()=>{ navigateSearch(-1); fi.focus(); });
  $('find-close').addEventListener('click', closeFind);

  // results column resize
  initResultsResize();

  /* Coalesced to one pass per frame. This handler re-measures the monospace
     metric (which appends a probe element and forces layout), bumps
     layoutEpoch — so the next render re-measures every line — and then renders.
     Undebounced it fired ~60 times during the iOS keyboard slide-in and each
     URL-bar collapse, i.e. exactly when the app most needs to feel smooth. */
  let resizeRaf=0;
  window.addEventListener('resize', ()=>{
    if(resizeRaf) return;
    resizeRaf=requestAnimationFrame(()=>{
      resizeRaf=0;
      measureChar(); applyResultsWidth(store.resultsWidth); render(); syncScroll();
    });
  });
  // The editor font is embedded (data: URIs) but still decodes asynchronously,
  // and its unicode-range subsets (latin / latin-ext / cyrillic) are fetched on
  // first use. Every pixel position derives from the measured glyph width, so
  // pull all three in up front and re-measure + re-render once they land - and
  // again if a subset ever arrives later.
  if(document.fonts && document.fonts.load){
    const refit=()=>{ measureChar(); computeCharsPerLine(); render(); syncScroll(); };
    document.fonts.load('400 16px "JetBrains Mono"', '0aЖ₽').then(refit, ()=>{});
    document.fonts.addEventListener('loadingdone', refit);
  }
  // flush pending edits the moment the tab goes to background / closes —
  // debounced timers freeze on mobile and may never fire otherwise
  // On hide/close, fire BOTH the SDK flush (works if the page lingers) and the
  // keepalive REST write (survives a hard unload/OS shutdown) — belt and suspenders.
  // On wake (visible / restored from bfcache), pull the server copy and merge:
  // a tab that slept through edits made elsewhere must reconcile BEFORE it
  // shows anything or writes anything, not wait for the push channel to notice.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='hidden'){ flushSync(); keepaliveFlush(); }
    else refreshFromServer();
  });
  window.addEventListener('pagehide', ()=>{ flushSync(); keepaliveFlush(); });
  window.addEventListener('pageshow', ()=>{ refreshFromServer(); });
  // desktop window/tab close. Fire the flushes, and if there are still-unsynced
  // changes (never server-acked — offline, blocked, or edited in the last instant)
  // surface the browser's "leave site?" prompt so the user doesn't walk away
  // thinking it saved. Only when signed in and actually dirty, so it's not noise.
  window.addEventListener('beforeunload', e=>{
    flushSync(); keepaliveFlush();
    if(isCloudDirty()){ e.preventDefault(); e.returnValue=''; return ''; }
  });
  // reflect connectivity in the sync pip; a regained connection reconciles
  // with the server first (merge), then re-pushes anything still unsynced
  window.addEventListener('offline', ()=>setSyncStatus('offline'));
  window.addEventListener('online', ()=>{
    setSyncStatus('saved'); refreshIdToken();
    if(hardSavePending){ hardSavePending=false; hardSave(); }
    refreshFromServer();
    if(cloudReady && isCloudDirty()) pushCloud();
  });
  // keep the keepalive token fresh (Firebase ID tokens expire ~1h)
  setInterval(refreshIdToken, 1800000);

}

document.addEventListener('DOMContentLoaded', boot);

/* expose a tiny hook for automated testing */
window.__calcuta={analyze, fmt, plain, parseNum, regroupText, evaluate, evaluateLenient, tokenizeMath, normalizePasted, dateAt,
  getStore:()=>store, mergeStores, syncPayload, urlRanges, urlLenAt, fullUrl, formatAll,
  stamp, observeTime, observeStore, clockNow:()=>_clock, setClock:(v)=>{ _clock=v; },
  curCmdAt, lineCurCmd, setFx:(r,m)=>{ fxRates=r; fxMeta=m||fxMeta; if(typeof render==='function') render(); },
  offsetToLineCol, dateAtIdx,
  convertLegacyMarkup, normalizeStoreDocs, MARKUP_V,
  createDoc, deleteDoc, addTag, setActive:(id)=>{ store.activeId=id; loadActiveIntoEditor(); },
  // seam for tests/staletest.js: drive the real cloud write paths against a
  // fake Firestore, so the "stale device must never clobber newer cloud data"
  // guarantees stay regression-tested. Never used by the app itself.
  __syncTest:{
    inject:(fakeDb,fakeRef,user)=>{ db=fakeDb; cloudRef=fakeRef; currentUser=user; cloudReady=true; cachedIdToken='test-token'; },
    setStore:(s)=>{ store=s; observeStore(store); loadActiveIntoEditor(); },
    setSynced:(payload)=>{ lastSyncedPayload=payload; everEdited=true; },
    setServerSeenAt:(t)=>{ serverSeenAt=t; },
    state:()=>({ serverSeenAt, cloudReady, lastSyncedPayload, hardSavePending, pushInflight }),
    pushCloudNow, flushSync, keepaliveFlush, hardSave, refreshFromServer, reconcileRemote, isCloudDirty, parseRemote,
  }};

})();
</script>
</body>
</html>
