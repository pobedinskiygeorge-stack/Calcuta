/* ---- lazy Firebase loader ----
   The three compat bundles are ~512 KB raw / ~151 KB gzip — 1.8x the whole
   app — and as <script defer> in <head> they blocked DOMContentLoaded, which
   is what boot() waits for. Nothing about reading and editing local notes
   needs them, so they are now injected after the first render instead.
   crossorigin="anonymous" is deliberate: it makes gstatic return a real CORS
   response, so the service worker caches a verifiable entry instead of an
   opaque one (opaque entries are unverifiable and charged to quota with heavy
   padding). Order matters — auth/firestore compat both require app compat. */
const FB_VERSION='10.12.2';
const FB_BASE='https://www.gstatic.com/firebasejs/'+FB_VERSION+'/';
/* Each bundle is requested once; a failed one is forgotten (and its <script>
   removed) so the next attempt fetches only what is still missing. */
const fbFiles={};
function loadFirebase(){
  const one=(file)=>fbFiles[file] || (fbFiles[file]=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=FB_BASE+file; s.async=false; s.crossOrigin='anonymous';
    s.onload=res; s.onerror=()=>{ delete fbFiles[file]; s.remove(); rej(new Error(file)); };
    document.head.appendChild(s);
  }));
  return one('firebase-app-compat.js')
    .then(()=>Promise.all([one('firebase-auth-compat.js'), one('firebase-firestore-compat.js')]));
}
/* Start sign-in + sync. If the bundles cannot be fetched (the page was
   restored before the network came up — the usual first minute of a device
   switched on after a long time), keep retrying: on 'online', on wake, and
   with backoff. It used to try exactly once, so such a device ran the whole
   session without syncing at all. */
let fbStarted=false, fbTried=false, fbRetryTimer=null, fbBackoff=0;
function startFirebase(){
  if(fbStarted) return;
  fbTried=true;
  clearTimeout(fbRetryTimer); fbRetryTimer=null;
  loadFirebase().then(()=>{
    if(fbStarted) return;
    fbStarted=true; initAuth();
  }, ()=>{
    if(fbStarted) return;
    const statusEl=$('authgate-status'), btn=$('google-signin');
    if(statusEl) statusEl.textContent='Не удалось загрузить Firebase (нет сети?) — повторим автоматически';
    if(btn) btn.disabled=true;
    fbBackoff=Math.min(fbBackoff ? fbBackoff*2 : 5000, 60000);
    fbRetryTimer=setTimeout(startFirebase, fbBackoff);
  });
}

function initAuth(){
  const statusEl=$('authgate-status'), btn=$('google-signin');
  if(typeof firebase==='undefined'){
    statusEl.textContent='Не удалось загрузить Firebase (нет сети?)';
    btn.disabled=true;
    return;
  }
  if(!firebaseIsConfigured()){
    statusEl.textContent='Firebase ещё не настроен — см. инструкцию в README.';
    btn.disabled=true;
    return;
  }
  btn.disabled=false; statusEl.textContent='';   // a load that failed before may have left these
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();
  db=firebase.firestore();
  // NO Firestore offline persistence. Every upload is a transaction (which
  // never queues offline) and every edit already lives in localStorage, so
  // the IndexedDB cache only added risk: a device back after weeks first got
  // its weeks-old CACHED copy as a snapshot, and old builds left writes
  // queued in it that could replay over newer data. Builds before this one
  // enabled it, so the leftover cache is wiped once, before first use.
  try{
    if(!localStorage.getItem(FS_CLEARED_KEY) && db.clearPersistence){
      db.clearPersistence().then(()=>{ try{ localStorage.setItem(FS_CLEARED_KEY,"1"); }catch(e){} }, ()=>{});
    }
  }catch(e){}
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
  auth.onAuthStateChanged(onAuthChanged);
  // Completes a signInWithRedirect() round trip (from the popup fallback
  // below, or any future direct call). Resolves as a no-op on an ordinary
  // page load with no pending redirect, so it's safe to call unconditionally
  // every time. Only .catch — success is already handled by onAuthChanged.
  auth.getRedirectResult().catch(err=>{
    if(err && err.code) statusEl.textContent='Не удалось войти: ['+err.code+'] '+err.message;
  });
  /* signInWithPopup is the default: it avoids the cross-domain cookie
     dependency signInWithRedirect has (Safari 16.1+/Firefox 109+/Chrome
     115+ all block third-party cookies between this site and the
     *.firebaseapp.com authDomain by default, so a plain redirect can
     silently drop the user back at the sign-in screen with no error —
     firebase.google.com/docs/auth/web/redirect-best-practices). But popup's
     own relay page (also on that authDomain) needs working sessionStorage
     too, and on mobile Safari with cross-site tracking prevention, or
     in-app webviews (Instagram/TikTok/Telegram etc.), that storage is
     partitioned — throwing auth/missing-initial-state. For exactly that
     class of failure, retry once with a full-page redirect instead of
     giving up. A popup the user closed themselves is NOT retried — that's
     a deliberate action, not a platform failure. */
  const REDIRECT_FALLBACK_CODES = new Set([
    'auth/missing-initial-state',
    'auth/popup-blocked',
    'auth/web-storage-unsupported',
    'auth/operation-not-supported-in-this-environment',
  ]);
  btn.addEventListener('click', ()=>{
    statusEl.textContent='Открываем окно входа Google…';
    btn.disabled=true;
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .then(()=>{ btn.disabled=false; })
      .catch(err=>{
        if(REDIRECT_FALLBACK_CODES.has(err.code)){
          statusEl.textContent='Открываем страницу входа Google…';
          auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider())
            .catch(err2=>{ statusEl.textContent='Не удалось войти: ['+err2.code+'] '+err2.message; btn.disabled=false; });
          return;   // page is about to navigate away; leave the button disabled meanwhile
        }
        statusEl.textContent='Не удалось войти: ['+err.code+'] '+err.message;
        btn.disabled=false;
      });
  });
}
function onAuthChanged(user){
  currentUser=user;
  if(user){
    // bases recorded against another account's cloud copy mean nothing here
    if(docBasesUid!==user.uid){ if(docBasesUid) docBases={}; docBasesUid=user.uid; }
    hideAuthGate();
    // Remember on this device that a real session existed, so the next launch
    // can show the editor immediately instead of waiting for Firebase.
    try{ localStorage.setItem(SIGNED_IN_KEY,'1'); }catch(e){}
    $('authgate-status').textContent='';
    // NB: no other UI to update here — the old top bar's #status (account
    // name) is gone. A stray reference to it here used to throw BEFORE
    // subscribeCloud(), silently killing cross-device sync after sign-in.
    setSyncStatus(navigator.onLine?'saved':'offline');
    requestPersistentStorage();
    subscribeCloud();
    refreshIdToken();   // cache a bearer token for the keepalive close-flush (see below)
  }else{
    try{ localStorage.removeItem(SIGNED_IN_KEY); }catch(e){}
    // No session. Only cover the app if there is nothing local worth showing —
    // otherwise leave the notes editable offline and let the sync pip offer
    // the way back in. Every cloud write already early-returns on !currentUser.
    if(hasLocalContent()) showSignInAffordance(); else showAuthGate();
    cloudReady=false; cloudRef=null; cachedIdToken=null; listenSeq++;
    clearTimeout(listenRetryTimer); clearTimeout(pullRetryTimer); clearTimeout(pushRetryTimer);
    if(cloudUnsub){ cloudUnsub(); cloudUnsub=null; }
    setSyncStatus();   // hides the pip
  }
}

/* Not every failure is "no network, will retry": a store over Firestore's
   1 MB document limit, or rules that refuse this account, will never
   succeed by waiting — say so instead of promising a later save. */
let syncProblem=null;
/* Ask the browser not to evict this site's storage (Chrome may clear it
   under disk pressure; it holds edits that have not reached the cloud yet
   while a device is offline). Chromium and WebKit decide silently; Firefox
   would pop a permission prompt out of nowhere, so it is not asked there. */
let persistAsked=false;
function requestPersistentStorage(){
  if(persistAsked) return; persistAsked=true;
  try{
    if(!navigator.storage || !navigator.storage.persist || /Firefox\//.test(navigator.userAgent)) return;
    navigator.storage.persisted().then(p=>{ if(!p) return navigator.storage.persist(); }).catch(()=>{});
  }catch(e){}
}
function syncError(err){
  if(!err){ syncProblem=null; return; }
  console.error('cloud sync error', err);
  const code=(err && err.code)||'', msg=String((err && err.message)||'');
  if(code==='too-big' || (code==='invalid-argument' && /size|bytes/i.test(msg))) syncProblem='too-big';
  else if(code==='permission-denied') syncProblem='denied';
  setSyncStatus('offline');
}
/* ---- sync status pip in the top bar: 'saving' | 'saved' | 'offline' ---- */
let syncSavedTimer=null;
function setSyncStatus(state){
  const el=document.getElementById('sync-status'); if(!el) return;
  if(!currentUser){ el.className='sync-hidden'; return; }
  if(protoBlocked){ el.className='sync-offline'; el.title='Вышла новая версия приложения — обновите страницу'; return; }
  if(!navigator.onLine && state!=='saving'){ state='offline'; }
  clearTimeout(syncSavedTimer);
  if(state==='saving'){ el.className='sync-saving'; el.title='Сохранение…'; }
  else if(state==='offline'){
    el.className='sync-offline';
    el.title = syncProblem==='too-big' ? 'Не помещается в облако: все документы вместе больше 1 МБ (лимит Firestore) — сохранено только на этом устройстве'
             : syncProblem==='denied' ? 'Облако отказало в доступе (правила Firestore / вход) — сохранено только на этом устройстве'
             : 'Нет сети — сохранится позже';
  }
  else { el.className='sync-saved'; el.title='Сохранено'; }   // 'saved'
}
/* ================================================================
   [SYNC] Merge-based cloud sync.

   The cloud doc (users/{uid}) holds the whole store as JSON in `data`.
   Nothing ever overwrites it blindly: every upload is a Firestore
   transaction that reads the current server copy, MERGES it with this
   device's store, and writes the result — so a device that has not seen the
   latest version (a laptop woken from a week of sleep, a phone that was
   off, a tab left open offline) physically cannot erase newer data.

   The merge is THREE-WAY, per document. For every doc each device keeps a
   "base": the last version of it that it saw on the server (docBases).
   Comparing both copies against the base tells who changed what:
     - only the server copy changed  -> take it (this device was just stale);
     - only the local copy changed   -> keep it (it is the news);
     - both changed                  -> merge the TEXT line by line (diff3),
       so an edit typed on a device that slept, was offline or was switched
       off survives next to the edits made elsewhere in the meantime.
   The older rule — newest timestamp wins the whole document — threw one of
   the two edits away, and a device with a slow clock always lost. Without a
   base (the first sync after this upgrade) it is still the fallback.
   Deletions use tombstones; tags merge per tag; activeId, resultsWidth and
   pins stay device-local.

   Self-healing: nothing in the loop can wedge for good.
     - a push or a server read that never answers is abandoned after a
       timeout and retried (SYNC_T);
     - a live listener that errors is re-opened with backoff, and re-opened
       on wake after a long sleep;
     - while visible and online the server is re-read whenever it has been
       silent for SYNC_T.pullEvery, so a listener that died silently can only
       delay an update, never lose it;
     - a store that differs from what the server confirmed is re-pushed by
       the heartbeat even if every timer was lost.
   ================================================================ */
const SYNC_PROTO=2;   // cloud format version, written with every upload
const SYNC_T={
  pushTimeout:20000,   // a push that has not settled by then is abandoned and retried
  pullTimeout:15000,   // the same for a server read
  pullEvery:60000,     // visible + online: re-read the server after this long without news
  resubAfter:60000,    // waking from a hide this long re-opens the live listener
};
let cloudRef=null, cloudReady=false, cloudSaveTimer=null;
/* Wall-clock of the last time THIS device heard from the server (listener
   snapshot, server read or a committed push). Drives the heartbeat pull. */
let serverSeenAt=0;
/* The cloud was written by a NEWER build than this one (its `proto` is
   higher): stop writing and get the update instead of guessing. */
let protoBlocked=false;
/* Key of this page's entry in the cloud doc's `pending` map (close-flush,
   see keepaliveFlush). Per page load, so two tabs never overwrite each
   other's entry; every regular upload clears the whole map. */
const PENDING_KEY='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* Canonical doc order: stock docs pinned first, then others by id (uid()
   encodes creation time), so all devices order identically → convergence. */
function orderDocs(docs){
  const rank=d=> d.protected==='tasks'?0 : d.protected==='personal'?1 : 2;
  return docs.slice().sort((a,b)=>{
    const ra=rank(a), rb=rank(b);
    if(ra!==rb) return ra-rb;
    return a.id<b.id?-1:(a.id>b.id?1:0);
  });
}
function docSig(d){ return JSON.stringify({n:d.name||'',t:d.text||''}); }

/* ---- three-way text merge ---- */
/* Longest common subsequence of two arrays (lines or characters):
   match[i] = index in b paired with a[i], or -1. The common prefix and
   suffix are paired directly, so the work only spans the edited middle:
   a table DP when it is small, else Myers' O((N+M)·D) diff, which stays
   fast on a huge document as long as the two versions differ in few places
   (edits near both ends of a 3000-line note used to leave the whole middle
   unpaired — one giant "conflict" that duplicated the document). Only a
   middle that is both huge and very different is left unpaired. */
const LCS_CAP=4e6, MYERS_MAX_D=1000;
function myersMatch(a, b, p, N, M, match){
  const maxD=Math.min(N+M, MYERS_MAX_D), off=maxD+1;
  const v=new Int32Array(2*maxD+3), trace=[];
  for(let d=0; d<=maxD; d++){
    trace.push(v.slice(off-d-1, off+d+2));                 // v before step d, indices -d-1..d+1
    for(let k=-d; k<=d; k+=2){
      let x=(k===-d || (k!==d && v[off+k-1]<v[off+k+1])) ? v[off+k+1] : v[off+k-1]+1;
      let y=x-k;
      while(x<N && y<M && a[p+x]===b[p+y]){ x++; y++; }
      v[off+k]=x;
      if(x>=N && y>=M){
        for(let dd=d; dd>=0; dd--){                          // walk the edit script back
          const t=trace[dd], at=kk=>t[kk+dd+1], kx=x-y;
          const pk=(kx===-dd || (kx!==dd && at(kx-1)<at(kx+1))) ? kx+1 : kx-1;
          const px=at(pk), py=px-pk;
          while(x>px && y>py){ x--; y--; match[p+x]=p+y; }
          if(dd>0){ x=px; y=py; }
        }
        return true;
      }
    }
  }
  return false;

  // older cloud copies stored tags without per-tag timestamps
  s.tags.forEach(t=>{ if(typeof t.updated!=='number') t.updated = s.tagsUpdated||1; });
  if(!s.deletedDocs || typeof s.deletedDocs!=='object') s.deletedDocs={};
  if(!s.deletedTags || typeof s.deletedTags!=='object') s.deletedTags={};
  return s;
}
/* Legacy colours / markup, and the logical clock past everything in it. */
function prepRemote(s){ snapStoreColors(s); normalizeStoreDocs(s); observeStore(s); return s; }

function parseRemote(raw){
  if(!raw) return null;
  const pend=(raw.pending && typeof raw.pending==='object' && Object.keys(raw.pending).length) ? raw.pending : null;
  let s=null;
  if(raw.data){
    try{ s=JSON.parse(raw.data); }catch(e){ return null; }
    if(!s||!Array.isArray(s.docs)) return null;
  }else if(pend) s={docs:[]};
  else return null;
  normalizeRemoteShape(s);
  if(pend) s=foldPending(s, pend);
  s.__proto=(typeof raw.proto==='number') ? raw.proto : 0;
  return s;
}
/* Close-flush entries (see keepaliveFlush) are merged into the server copy
   on read, each against the base its device had: they add that device's
   last edits without being able to revert anything newer. The result is
   flagged so the reader uploads it — which also clears the entries. */
function foldPending(s, pend){
  const entries=[];
  for(const k in pend){
    let e=pend[k];
    if(typeof e==='string'){ try{ e=JSON.parse(e); }catch(_){ e=null; } }
    if(e && typeof e==='object' && Array.isArray(e.docs)) entries.push(e);
  }
  entries.sort((a,b)=>(a.at||0)-(b.at||0));
  prepRemote(s);
  // Stamps here are derived from the inputs (one past the newer side), not
  // from this device's clock: every device that reads the same entries folds
  // them to the very same result, so they do not trade extra uploads over
  // whose stamp is higher.
  const det=(L,R)=>Math.max(L.updated||0, R.updated||0)+1;
  for(const e of entries){
    prepRemote(normalizeRemoteShape(e));
    s=mergeStores(e, s, (e.bases && typeof e.bases==='object') ? e.bases : {}, det);
  }

  return s;
}

/* Record the server versions just seen as the new bases. Never moves a base
   backwards (a late, older delivery), and forgets bases of documents gone
   from both this device and the server. */
function setBases(s){
  if(!s || !Array.isArray(s.docs)) return;
  for(const d of s.docs){
    const cur=docBases[d.id];
    if(!cur || (d.updated||0)>=(cur.updated||0)) docBases[d.id]={text:d.text||'', name:d.name||'', updated:d.updated||0};
  }
  for(const id in docBases){
    if(!s.docs.some(d=>d.id===id) && !store.docs.some(d=>d.id===id)) delete docBases[id];
  }
}
/* The store must hold exactly what is on screen before anything merges
   into it (canonicalizeNumbers on blur, for one, only saves 300ms later). */
function flushEditor(){
  if(composing || sharedMode) return;
  const d=doc(); if(d && d.text!==input.value){ window.__calcutaSyncLog && syncTrace('flushEditor', {id:d.id, from:d.text, to:input.value}); d.text=input.value; d.updated=stamp(); }
}

/* Install a merged store as the app's state. The open document is updated
   LIVE — no more holding remote text off the editor while the user types
   (that hold was how a stale editor overwrote newer edits). The caret stays
   on the same text, and the undo history is rebased onto the new text. */
function applyStore(next){
  // nothing new (the echo of our own upload, an idle heartbeat read): keep
  // the store and skip the re-render — only the bases may have moved
  if(syncPayload(next)===syncPayload(store) && (next.forceEpoch||0)<=(store.forceEpoch||0)){ saveLocal(); return; }
  next.activeId=store.activeId;
  next.resultsWidth=store.resultsWidth;
  next.pinned=store.pinned;                 // pins are device-local, like activeId
  if(!Array.isArray(next.tags)) next.tags=[];
  if(!next.deletedDocs || typeof next.deletedDocs!=='object') next.deletedDocs={};
  if(!next.deletedTags || typeof next.deletedTags!=='object') next.deletedTags={};
  if(typeof next.tagsUpdated!=='number') next.tagsUpdated=0;
  delete next.__pending; delete next.__proto;
  if(!next.docs.length) next.docs.push(makeTasksDoc());          // never end up doc-less
  if(!next.docs.some(d=>d.id===next.activeId)) next.activeId=next.docs[0].id;

  const before=new Map(store.docs.map(d=>[d.id, d.text||'']));
  const prevActive=store.activeId, oldVal=input.value;
  const focused=(document.activeElement===input);
  const s0=input.selectionStart, s1=input.selectionEnd;

  store=next;
  applyResultsWidth(store.resultsWidth);
  // the recolour grid targets a tag by its index, which a merge can shift
  if(JSON.stringify(store.tags)!==tagsBefore) closeTagPicker();
  renderTags();
  if(store.activeId!==prevActive){
    loadActiveIntoEditor();               // the open doc was deleted elsewhere: show the fallback
  }else{
    const d=doc(), t=d.text||'';
    let anchorY=null, a=0;
    if(t!==oldVal){
      // where the caret sits on screen now: lines added above it elsewhere
      // must not push the text being typed down the screen
      if(focused) anchorY=caretClientTop(s0);
      a=mapOffset(oldVal, t, s0); const b=(s1===s0) ? a : mapOffset(oldVal, t, s1);
      input.value=t;
      if(focused) input.setSelectionRange(a, b);
      autoIndent(); applyMask();
      if(d.text!==input.value) d.text=input.value;   // formatting is not an edit
    }
    render(); renderDocs();
    if(anchorY!=null){
      const y=caretClientTop(input.selectionStart, true);
      if(y!=null && y!==anchorY) editor.scrollTop+=y-anchorY;
    }
  }
  const changes=new Map();
  for(const d of store.docs){
    const o=(d.id===prevActive) ? oldVal : before.get(d.id), t=d.text||'';
    if(o!==undefined && o!==t) changes.set(d.id, {oldText:o, newText:t});
  }
  rebaseHistories(changes);
  saveLocal();
}

/* Caret top in client pixels, or null when it is not on screen (unless
   `anywhere`). */
function caretClientTop(off, anywhere){
  try{
    const {row,col}=offsetToLineCol(off); const cell=caretCellRect(row,col);
    if(!cell) return null;
    if(anywhere) return cell.top;
    const r=editor.getBoundingClientRect();
    return (cell.top>=r.top && cell.top<=r.bottom) ? cell.top : null;
  }catch(e){ return null; }
}

/* A HARD SAVE from another device (higher forceEpoch) means "make every
   device exactly this version": adopt it wholesale. Only edits made here
   AFTER that save are kept (merged in) — they cannot be what it meant to
   discard. Returns true when such edits were kept (they must be uploaded).
   `fromServer` false: the forced copy came from another tab, not the server,
   so it must not become this device's bases. */
function adoptForced(remote, fromServer){
  const epoch=remote.forceEpoch||0;
  const keep=store.docs.filter(d=>(d.updated||0)>epoch && !remote.docs.some(r=>r.id===d.id && docSig(r)===docSig(d)));
  const next=keep.length ? mergeStores({docs:keep}, remote, docBases) : remote;
  next.forceEpoch=epoch;
  if(fromServer!==false) setBases(remote);
  applyStore(next);
  return keep.length>0;
}

/* Reconcile a server copy into this device: merge, adopt, and report
   whether the server is missing something we have (caller pushes then). */
function reconcileRemote(remote){
  flushEditor();
  prepRemote(remote);
  window.__calcutaSyncLog && syncTrace('reconcile', {local:store.docs.map(d=>[d.id,d.text,d.updated]), remote:remote.docs.map(d=>[d.id,d.text,d.updated]), bases:docBases});
  let diverged;
  if((remote.forceEpoch||0) > (store.forceEpoch||0)){
    diverged=adoptForced(remote);
  }else{
    const merged=mergeStores(store, remote, docBases, undefined, neverSynced);
    setBases(remote);
    applyStore(merged);
    diverged=syncPayload(store)!==syncPayload(remote);
  }
  neverSynced=false;
  if(remote.__pending) diverged=true;       // fold close-flush entries in for good
  if(!diverged) lastSyncedPayload=syncPayload(store);   // cloud already has everything → clean
  reportClashes();
  return diverged;
}

/* Server copies that arrive while a transaction of ours is in flight, or in

   transaction's own result must land first (it sets the bases), and a
   composition must not have the text changed under it. */
let heldRemotes=[];

}
/* Every server copy — listener, wake-up read — comes through here. */
function handleRemoteRaw(raw){
  const remote=parseRemote(raw);
  if(!remote){ cloudReady=true; return; }   // unreadable cloud copy: the next upload replaces it
  if(remote.__proto>SYNC_PROTO){ protoBlock(); return; }
  if(syncBusy()){ heldRemotes.push(remote); if(heldRemotes.length>4) heldRemotes.shift(); return; }
  const diverged=reconcileRemote(remote);
  cloudReady=true;   // reconciled — uploads are safe now
  if(diverged) pushCloud();
}

/* Another tab of the app saved (localStorage). Merge its store in, against
   the older of the two tabs' bases — their common ancestor — and take the
   newer base afterwards. Without this, the tab that saved last wrote back
   its own stale copy and erased the other tab's edits. Returns true when
   the other tab's copy lacks something this tab has (write it back then). */
function integrateLocal(raw){
  let o; try{ o=JSON.parse(raw); }catch(e){ return false; }
  if(!o || !Array.isArray(o.docs)) return false;
  const ob=(o._bases && typeof o._bases==='object' && (o._basesUid||null)===docBasesUid) ? o._bases : {};
  delete o._bases; delete o._basesUid;

  prepRemote(normalizeRemoteShape(o));
  if((o.forceEpoch||0) > (store.forceEpoch||0)){
    for(const id in ob) if(!docBases[id] || (ob[id].updated||0)>(docBases[id].updated||0)) docBases[id]=ob[id];
    adoptForced(o, false);
    return syncPayload(store)!==syncPayload(o);
  }
  const common={};
  for(const id in docBases){ const x=docBases[id], y=ob[id]; if(x && y) common[id]=((y.updated||0)<(x.updated||0)) ? y : x; }
  const merged=mergeStores(store, o, common);
  for(const id in ob) if(!docBases[id] || (ob[id].updated||0)>(docBases[id].updated||0)) docBases[id]=ob[id];
  if(syncPayload(merged)!==syncPayload(store)) applyStore(merged);
  return syncPayload(store)!==syncPayload(o);
}

/* Listen to the cloud doc. The FIRST server snapshot reconciles this device
   with the cloud (merge, adopt, push back what the cloud was missing);
   later ones are live updates from other devices. cloudReady gates uploads
   so a save can never race ahead of that first reconciliation. A listener
   that errors is dead for good in Firestore — it is re-opened with backoff
   (it used to stay dead, and the device silently stopped receiving). */
let listenSeq=0, listenRetryTimer=null, listenBackoff=0, lastResubAt=0;
function subscribeCloud(){
  if(!db||!currentUser) return;
  clearTimeout(listenRetryTimer); listenRetryTimer=null;
  cloudRef=db.collection('users').doc(currentUser.uid);
  const seq=++listenSeq;
  if(cloudUnsub){ try{ cloudUnsub(); }catch(e){} cloudUnsub=null; }
  cloudUnsub=cloudRef.onSnapshot({includeMetadataChanges:true}, snap=>{
    if(seq!==listenSeq) return;
    if(snap.metadata.hasPendingWrites) return;      // our own optimistic write echoing back
    if(!snap.metadata.fromCache){ serverSeenAt=Date.now(); listenBackoff=0; }
    // Only SEED against authoritative data: a cache snapshot that reports the
    // doc missing can be a cold-cache lie, and seeding on it would upload this
    // device's stock content as if the cloud were empty.
    if(snap.metadata.fromCache && !snap.exists) return;
    if(!snap.exists){
      if(!cloudReady){ cloudReady=true; pushCloud(); }   // cloud truly empty (server-confirmed): seed it
      return;
    }
    handleRemoteRaw(snap.data());
  }, err=>{
    if(seq!==listenSeq) return;
    syncError(err);
    cloudUnsub=null;
    listenBackoff=Math.min(listenBackoff ? listenBackoff*2 : 2000, 60000);
    clearTimeout(listenRetryTimer);
    listenRetryTimer=setTimeout(()=>{ if(currentUser && seq===listenSeq) subscribeCloud(); }, listenBackoff);
  });
}
/* Re-open the listener (wake after a long sleep, network back): a socket
   that died without an error would otherwise never deliver again. */
function resubscribe(){
  if(!db||!currentUser) return;
  if(Date.now()-lastResubAt<30000) return;
  lastResubAt=Date.now();
  subscribeCloud();
}

/* Actively read the authoritative server copy and reconcile — on wake, when
   connectivity returns, and from the heartbeat. A read that never answers
   (a wedged connection after sleep) is abandoned after SYNC_T.pullTimeout
   and retried with backoff; it used to block every later read for good. */
let serverPullInflight=false, pullSeq=0, pullStartedAt=0, pullRetryTimer=null, pullBackoff=0;
function refreshFromServer(reason){
  if(!db||!currentUser||!cloudRef) return;

  const seq=++pullSeq;
  serverPullInflight=true; pullStartedAt=Date.now();
  clearTimeout(pullRetryTimer); pullRetryTimer=null;
  refreshIdToken();   // sleep can outlive the ~1h ID token; keepaliveFlush needs a live one
  const fail=()=>{
    if(seq!==pullSeq || !serverPullInflight) return;
    serverPullInflight=false;
    pullBackoff=Math.min(pullBackoff ? pullBackoff*2 : 5000, 60000);
    clearTimeout(pullRetryTimer);
    pullRetryTimer=setTimeout(()=>{ pullRetryTimer=null; if(document.visibilityState==='visible' && navigator.onLine) refreshFromServer(); }, pullBackoff);
  };
  const timer=setTimeout(fail, SYNC_T.pullTimeout);

    clearTimeout(timer);
    serverSeenAt=Date.now();
    if(seq===pullSeq){ serverPullInflight=false; pullBackoff=0; }
    // even a late answer is real server data: merging it is safe (stale
    // copies are recognised per document), so it is never thrown away
    if(!snap.exists){ if(!cloudReady) cloudReady=true; if(isStoreDirty()) pushCloud(); return; }
    const before=syncPayload(store);
    handleRemoteRaw(snap.data());
    // a routine re-read that finds news means the live listener missed it
    // (a socket that died without an error): open a new one
    if(reason==='beat' && syncPayload(store)!==before) resubscribe();
  }, ()=>{ clearTimeout(timer); fail(); });
}

// Dirtiness is derived from CONTENT: lastSyncedPayload holds the
// syncPayload() the server last confirmed (an ack or a matching snapshot).
// `everEdited` keeps the close-time warning quiet after a no-edit session.
let lastSyncedPayload=null, everEdited=false, cachedIdToken=null;
function isStoreDirty(){ return syncPayload(store)!==lastSyncedPayload; }
function isCloudDirty(){ return !!currentUser && everEdited && isStoreDirty(); }

/* Read-merge-write upload. The transaction's get() sees the CURRENT server
   copy, merges per doc (three-way) and commits; Firestore re-runs the
   callback on a concurrent write. Offline it fails instead of queueing a
   blind overwrite — nothing is lost, the edit is in localStorage and the
   retry / 'online' / wake / heartbeat paths re-push. A transaction that
   never settles is abandoned by a watchdog (a wedged channel used to leave
   pushInflight set forever, so no later edit was uploaded again). */
let pushInflight=false, pushRetryTimer=null, pushSeq=0, pushWatchdog=null;
function schedulePushRetry(ms){
  clearTimeout(pushRetryTimer);

}
function pushCloudNow(){
  clearTimeout(cloudSaveTimer); cloudSaveTimer=null;
  if(!db||!currentUser||!cloudRef||!cloudReady||protoBlocked) return;
  if(pushInflight || hardInflight) return;   // the in-flight one re-checks dirtiness when it lands
  // mid-composition (phone keyboards compose every word) the merged result
  // could not be put on screen: wait — compositionend saves and pushes
  if(composing){ schedulePushRetry(1500); return; }
  const seq=++pushSeq;
  pushInflight=true;
  clearTimeout(pushRetryTimer); pushRetryTimer=null;
  setSyncStatus('saving');
  clearTimeout(pushWatchdog);
  pushWatchdog=setTimeout(()=>{
    if(seq!==pushSeq || !pushInflight) return;
    pushInflight=false; pushSeq++;          // a late answer of this attempt is ignored
    syncError(new Error('sync push timed out'));
    schedulePushRetry(3000);
    releaseHeld();
  }, SYNC_T.pushTimeout);

  let result=null;
  db.runTransaction(tx=>tx.get(cloudRef).then(snap=>{
    result=null;                         // reset per attempt — the callback re-runs on contention
    const remote=snap.exists ? parseRemote(snap.data()) : null;
    if(remote && remote.__proto>SYNC_PROTO){ result={blocked:true}; return; }
    if(remote) prepRemote(remote);
    if(remote && (remote.forceEpoch||0)>(store.forceEpoch||0)){ result={forced:remote}; return; }
    const sent=cloneStore(store), bases=Object.assign({}, docBases);
    const next=remote ? mergeStores(sent, remote, bases) : mergeStores(sent, {});
    result={next, sent};

    // same merge first): write nothing — a no-op set() is still a write that
    // wakes every listener
    if(remote && !remote.__pending && remote.__proto>=SYNC_PROTO && syncPayload(next)===syncPayload(remote) &&

    if(utf8Size(out.data)>CLOUD_MAX_BYTES) throw Object.assign(new Error('store exceeds the cloud document size limit'), {code:'too-big'});

    clearTimeout(pushWatchdog);
    pushInflight=false;
    serverSeenAt=Date.now();

    if(result && result.forced){

    }else if(result) afterCommit(result.next, result.sent);

    if(seq!==pushSeq) return;

/* `next` is now the server copy. Bring this device onto it: as is if
   nothing changed here meanwhile, else merged with the typing done during
   the round trip (against `sent`, the store the upload was computed from). */
function afterCommit(next, sent){
  serverSeenAt=Date.now();
  window.__calcutaSyncLog && syncTrace('afterCommit', {next:next.docs.map(d=>[d.id,d.text,d.updated]), sent:sent.docs.map(d=>[d.id,d.text,d.updated]), store:store.docs.map(d=>[d.id,d.text,d.updated])});
  const mine=cloneStore(next);
  if(syncPayload(store)===syncPayload(sent)) applyStore(mine);
  else{
    const anc={};
    sent.docs.forEach(d=>{ anc[d.id]={text:d.text||'', name:d.name||'', updated:0}; });
    applyStore(mergeStores(store, mine, anc));

  saveLocal();
  lastSyncedPayload=syncPayload(next);
  reportClashes();
}
function pushCloud(){
  if(!db||!currentUser||!cloudRef||!cloudReady||protoBlocked) return;
  clearTimeout(cloudSaveTimer);
  setSyncStatus('saving');
  cloudSaveTimer=setTimeout(pushCloudNow, 500);
}
function cloudSave(){ everEdited=true; if(cloudReady) pushCloud(); }

/* HARD SAVE — make sure THIS device's current content lands on the cloud and
   every other device (on or off). Reads the server copy in a transaction,
   MERGES (so a stale device pressing the button cannot roll every other
   device back to an old version), then stamps the merged result with a
   strictly-newer forceEpoch so all devices adopt exactly it. Offline the
   transaction fails; the press is remembered and retried when connectivity
   returns. */

function hardSave(){

  // fresh device can't overwrite the real cloud with un-synced stock content.
  if(!cloudReady && navigator.onLine){
    setSyncStatus('saving');

  }

  clearTimeout(cloudSaveTimer); cloudSaveTimer=null;                // cancel any pending debounced push

  setSyncStatus('saving');

  hardInflight=true;

    if(seq!==hardSeq || !hardInflight) return;
    hardInflight=false; hardSeq++;

    hardSavePending=true; syncError(err);
    releaseHeld();
  };

    const remote=snap.exists ? parseRemote(snap.data()) : null;
    if(remote) prepRemote(remote);
    const sent=cloneStore(store), bases=Object.assign({}, docBases);
    const next=remote ? mergeStores(sent, remote, bases) : mergeStores(sent, {});
    next.forceEpoch=Math.max(store.forceEpoch||0, (remote&&remote.forceEpoch)||0, Date.now())+1;

    const out=cloudDoc(next);

      afterCommit(result.next, result.sent);   // picks up anything newer the server had
      syncError(null); setSyncStatus('saved');
      if(btn) btn.disabled=false;
      if(done) done.classList.add('show');
      clearTimeout(hardSaveDoneTimer);
      hardSaveDoneTimer=setTimeout(()=>{ if(done) done.classList.remove('show'); closeMenus(); }, 1900);

/* Immediate push — no debounce. For moments when timers are about to freeze

   has nothing to say. */
function flushSync(){
  clearTimeout(saveTimer); persist();
  if(!db||!currentUser||!cloudRef||!cloudReady) return;
  if(!isCloudDirty()) return;

}
/* Keep a fresh bearer token cached so the keepalive close-flush below can send

  if(!currentUser||!currentUser.getIdToken) return;
  currentUser.getIdToken().then(t=>{ cachedIdToken=t; }).catch(()=>{});
}
/* Reliable last words on close. The transactional push is async and the
   browser does not wait for it when the page unloads (or the OS shuts
   down), but a fetch(..., {keepalive:true}) may outlive the page. A single
   REST call cannot read-merge-write, so it does NOT touch `data`: it writes
   this page's unsynced documents, each with its base, into its own entry of
   the cloud doc's `pending` map. Whoever reads the doc next merges the
   entry in three-way (foldPending) — it can add these edits but cannot
   revert anything newer — and uploads the result, clearing the map.
   (It used to PATCH the whole store over `data`, which could revert newer
   edits, so it was gated to "talked to the server in the last 3 minutes" —
   and a device closed after a long sleep lost its last edits instead.) */
function keepaliveFlush(){
  if(!currentUser||!cachedIdToken||!navigator.onLine||protoBlocked) return;
  if(!isCloudDirty()) return;
  flushEditor();
  const docs=store.docs.filter(d=>{ const b=docBases[d.id]; return !b || b.text!==(d.text||'') || b.name!==(d.name||''); });
  const bases={}; docs.forEach(d=>{ if(docBases[d.id]) bases[d.id]=docBases[d.id]; });
  const entry={ v:SYNC_PROTO, at:Date.now(), docs, bases, deletedDocs:store.deletedDocs||{},
                tags:store.tags||[], tagsUpdated:store.tagsUpdated||0, deletedTags:store.deletedTags||{}, forceEpoch:store.forceEpoch||0 };
  const body=JSON.stringify({ fields:{ pending:{ mapValue:{ fields:{ [PENDING_KEY]:{ stringValue: JSON.stringify(entry) } } } } } });
  if(body.length>60000) return;                       // keepalive body cap (~64KB) — localStorage still has it
  const url='https://firestore.googleapis.com/v1/projects/'+firebaseConfig.projectId+
    '/databases/(default)/documents/users/'+currentUser.uid+
    '?updateMask.fieldPaths=pending.'+PENDING_KEY;
  try{
    fetch(url,{ method:'PATCH', keepalive:true,
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+cachedIdToken },
      body }).catch(()=>{});
  }catch(e){}
}

/* The cloud was written by a newer build: this one must not write anything
   (it may not understand what it would merge). Fetch the update and reload
   at the first safe moment. */
function protoBlock(){
  if(protoBlocked) return;
  protoBlocked=true;
  setSyncStatus('offline');
  appUpdateReady=true;
  checkAppUpdate(true);
  maybeReloadForUpdate();
}

/* Wake-up (tab visible again / restored from bfcache): re-read the server
   BEFORE anything else, re-open a listener that may have died while asleep,
   and push whatever is still unsynced. */
let hiddenAt=0;
function onSyncWake(){
  checkAppUpdate();
  if(fbTried && !fbStarted) startFirebase();     // only retries: the first start stays lazy (boot)
  if(!currentUser) return;
  refreshIdToken();
  if(hiddenAt && Date.now()-hiddenAt>=SYNC_T.resubAfter) resubscribe();
  refreshFromServer();
  if(cloudReady && isStoreDirty()) pushCloud();
}
/* Heartbeat (every 10s): the server is re-read when it has been silent too
   long, and an unsynced store is re-pushed even if every timer was lost.
   A long gap between two beats while the page stayed "visible" means the
   machine slept (a closed laptop lid often fires no visibilitychange at
   all): treat it as a wake-up — re-read now and re-open the listener,
   whose socket rarely survives the sleep. */
let lastBeatAt=Date.now();
function syncHeartbeat(){
  const now=Date.now(), gap=now-lastBeatAt; lastBeatAt=now;
  if(gap>30000 && document.visibilityState==='visible'){ hiddenAt=now-gap; onSyncWake(); }
  maybeReloadForUpdate();
  if(!currentUser||!cloudRef||protoBlocked) return;
  if(document.visibilityState!=='visible' || !navigator.onLine) return;
  if(Date.now()-serverSeenAt>SYNC_T.pullEvery) refreshFromServer('beat');
  if(cloudReady && !pushInflight && !hardInflight && !cloudSaveTimer && !pushRetryTimer && isStoreDirty()) pushCloud();
  if(Date.now()-swCheckAt>3600e3) checkAppUpdate();
}

/* ---- app updates ----
   A device that was asleep for long often keeps running an OLD build (a
   phone keeps the PWA in memory for weeks; a launch on a slow network gets
   the cached shell). An old build means old sync logic. The service worker
   activates a new build as soon as it is fetched (skipWaiting + claim); this
   asks for it on wake / hourly, and reloads the page onto it when that is
   invisible to the user: while hidden, or with the window unfocused after
   30 idle minutes. */
let swHadController=false, appUpdateReady=false, swCheckAt=0;
function initAppUpdates(){
  if(!('serviceWorker' in navigator)) return;
  swHadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(!swHadController){ swHadController=true; return; }   // first install claiming the page: same code
    appUpdateReady=true;
    maybeReloadForUpdate();
  });
}
function checkAppUpdate(force){
  if(!('serviceWorker' in navigator)) return;
  if(!force && Date.now()-swCheckAt<10*60*1000) return;
  swCheckAt=Date.now();
  try{ navigator.serviceWorker.getRegistration().then(r=>{ if(r) return r.update(); }).catch(()=>{}); }catch(e){}
}
function maybeReloadForUpdate(){
  if(!appUpdateReady || composing) return;
  const hidden=document.visibilityState==='hidden', idle=Date.now()-lastEditAt;
  // visible: only when nobody is at it (window unfocused, 30 min without an
  // edit) — or after a minute's pause when this build may not sync at all
  if(!hidden && !(protoBlocked ? idle>60000 : (idle>30*60*1000 && !document.hasFocus()))) return;
  if(!hidden && document.querySelector('.doc-name-input')) return;   // a rename in progress
  try{
    const last=+(sessionStorage.getItem('calcuta.updReload')||0);
    if(Date.now()-last<60000) return;                                 // never loop
    sessionStorage.setItem('calcuta.updReload', String(Date.now()));
  }catch(e){ return; }
  clearTimeout(saveTimer); persist();
  location.reload();
}

function buildExportHTML(){
  const title=(doc()&&doc().name)||'Calcuta';
  let rows='';
  const kids=highlight.children;
  for(let k=0;k<kids.length;k++){
    const left=kids[k].innerHTML || '&nbsp;';
    const it=model && model.data.lines[k];
    const res = it ? (it.error ? '⁇' : (it.result!=null ? esc(fmt(it.result)) : '')) : '';
    // row-level classes ("superrow", "checked") live on the .hl-line wrapper,
    // whose innerHTML alone would drop them — carry them onto the cell
    const rowCls=kids[k].className.replace('hl-line','').trim();
    rows += '<tr><td class="lcell'+(rowCls?' '+rowCls:'')+'">'+left+'</td><td class="rcell">'+res+'</td></tr>';
  }
  return '<!doctype html><html><head><meta charset="utf-8"><title>'+esc(title)+'</title><style>'+exportStyleBlock()+'</style></head>'
       + '<body><h2>'+esc(title)+'</h2><table>'+rows+'</table></body></html>';
}
function safeName(){ return ((doc()&&doc().name)||'calcuta').replace(/[\\/:*?"<>|]+/g,'_').slice(0,60); }
function downloadBlob(filename, mime, content){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportWord(){
  render();   // make sure the overlay matches the current text
  downloadBlob(safeName()+'.doc', 'application/msword', buildExportHTML());
  showToast('Скачивается Word');
}
function exportPDF(){
  render();
  const html=buildExportHTML();
  // Print from a hidden same-origin iframe INSIDE the app — never open a
  // separate window/tab (on mobile that tab can replace the app with no way
  // back). The iframe is removed after printing, so the app is never left.
  const frame=document.createElement('iframe');
  frame.setAttribute('aria-hidden','true');
  frame.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0';
  frame.srcdoc=html;
  let cleaned=false;
  const cleanup=()=>{ if(cleaned) return; cleaned=true; setTimeout(()=>{ if(frame.parentNode) frame.remove(); }, 800); };
  frame.onload=()=>{
    try{
      const w=frame.contentWindow;
      w.onafterprint=cleanup;
      w.focus();
      w.print();
    }catch(e){ cleanup(); }
    setTimeout(cleanup, 120000);   // safety net if onafterprint never fires
  };
  document.body.appendChild(frame);
  showToast('Печать в PDF');
}

/* ---- share a document via a compressed URL hash (no account needed) ---- */
async function gzipToB64(str){
  if(typeof CompressionStream==='undefined') return 'r'+btoa(unescape(encodeURIComponent(str)));  // raw fallback
  const cs=new CompressionStream('gzip');
  const w=cs.writable.getWriter(); w.write(new TextEncoder().encode(str)); w.close();
  const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());
  let bin=''; for(const b of buf) bin+=String.fromCharCode(b);
  return 'g'+btoa(bin);
}
async function b64ToText(tag){
  const kind=tag[0], b64=tag.slice(1);
  const bin=atob(b64);
  if(kind==='r') return decodeURIComponent(escape(bin));
  const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip');
  const w=ds.writable.getWriter(); w.write(bytes); w.close();
  return new Response(ds.readable).text();
}
let sharedMode=false;
/* Open a "#doc=<compressed>" share link as a read-only preview, bypassing the
   sign-in gate so it can be read without an account. "Сохранить у себя"
   imports it as a normal document (then the gate applies as usual). */
async function openSharedView(){
  const m=location.hash.match(/^#doc=(.+)$/);
  let data=null;
  if(m){ try{ data=JSON.parse(await b64ToText(decodeURIComponent(m[1]))); }catch(e){ data=null; } }
  if(!data || typeof data.t!=='string'){ startFirebase(); return; }   // bad link -> normal app (it used to skip loading Firebase: no sync all session)
  if((data.m|0)<MARKUP_V) data.t=upgradeMarkup(data.t, data.m|0);   // link made by an older build
  sharedMode=true;
  hideAuthGate();
  input.value=data.t; input.readOnly=true;
  render();
  const bar=document.createElement('div');
  bar.className='shared-banner';
  bar.innerHTML='<span class="sb-txt">Присланный расчёт'+(data.n?' · '+esc(data.n):'')+' — только просмотр</span>'
    +'<button class="sb-btn" id="sb-import" type="button">Сохранить у себя</button>';
  document.body.appendChild(bar);
  $('sb-import').addEventListener('click', ()=>importSharedDoc(data));
}
function importSharedDoc(data){
  const d={ id:uid(), name:data.n||'Присланный документ', text:data.t, updated:stamp(), markup:MARKUP_V };
  store.docs.push(d); store.activeId=d.id;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
  history.replaceState(null,'',location.pathname);   // drop the #doc= hash
  location.reload();                                 // reboot into the normal (gated) app
}
async function shareLink(){
  const d=doc(); if(!d) return;
  const payload=JSON.stringify({n:d.name||'Документ', t:input.value, m:MARKUP_V});
  const enc=await gzipToB64(payload);
  const base=location.origin+location.pathname;
  const url=base+'#doc='+encodeURIComponent(enc);
  copyText(url);
  showToast(url.length>1900 ? 'Ссылка скопирована (документ большой)' : 'Ссылка скопирована');
}

    const t=e.changedTouches[0]; tX=t.clientX; tY=t.clientY; tMoved=false; docHoldFired=false;
    cancelDocHold();
    const item=e.target.closest('.doc-item');
    if(item && e.touches.length===1){
      const id=item.dataset.id;
      docHoldTimer=setTimeout(()=>{
        docHoldTimer=null; docHoldFired=true;
        touchHandledAt=Date.now();                      // arm the click-guard so the trailing synthetic click can't open the doc
        openDocMenu(tX, tY, id);                        // no-op for pinned docs
        if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(err){} }
      }, 480);
    }
  }, {passive:true});
  $('docfind-list').addEventListener('touchmove', e=>{
    const t=e.changedTouches[0];
    if(Math.abs(t.clientX-tX)>10 || Math.abs(t.clientY-tY)>10){ tMoved=true; cancelDocHold(); }
  }, {passive:true});
  $('docfind-list').addEventListener('touchend', e=>{
    cancelDocHold();
    if(docHoldFired){ e.preventDefault(); touchHandledAt=Date.now(); return; }   // long-press opened the menu — keep the doc from also opening
    if(tMoved) return;                                  // was a scroll, not a tap
    if(e.target.closest('.doc-name-input')) return;     // typing a new name
    const item=e.target.closest('.doc-item'); if(!item) return;
    e.preventDefault();                                 // suppress the trailing synthetic click
    touchHandledAt=Date.now();
    switchDoc(item.dataset.id);                          // immediate — first tap opens
  });
  $('docfind-list').addEventListener('click', e=>{
    if(Date.now()-touchHandledAt < 700) return;         // touchend already handled this tap
    if(e.target.closest('.doc-name-input')) return;     // typing a new name, not navigating
    const item=e.target.closest('.doc-item'); if(!item) return;
    switchDoc(item.dataset.id);
  });
  $('docfind-list').addEventListener('contextmenu', e=>{
    const item=e.target.closest('.doc-item'); if(!item) return;
    e.preventDefault();
    openDocMenu(e.clientX, e.clientY, item.dataset.id);  // no-op for pinned docs
  });
  // rename / delete from the document context menu
  docmenu.addEventListener('click', e=>{
    const btn=e.target.closest('.lm-item'); if(!btn) return;
    const id=docMenuTarget; closeDocMenu();
    if(!id) return;
    if(btn.dataset.act==='rename'){
      // rename where the doc actually lives: a pinned doc on its tab, a manager
      // list row in the popover, or the active UNPINNED doc right on its top-bar
      // pill (which has no tab/row).
      const pinnedTab=document.querySelector('#pinned-tabs .doc-tab[data-id="'+id+'"]');
      const listRow=document.querySelector('#docfind-list .doc-item[data-id="'+id+'"] .doc-name');
      if(pinnedTab) beginRename(id, pinnedTab);
      else if(listRow) beginRename(id, listRow);
      else if(doc() && doc().id===id) beginRenamePill(id);
    } else if(btn.dataset.act==='delete'){
      requestDeleteDoc(id);
    } else if(btn.dataset.act==='pin'){
      togglePin(id);
    }
  });
  // close any open dropdown on outside click / Escape
  document.addEventListener('click', e=>{
    // a click inside the doc context menu must not close the loupe under it
    if(openMenuId && !e.target.closest('.tb-menu') && !e.target.closest('#brand-btn,#doc-find-btn,#sync-status') && !e.target.closest('#docmenu')) closeMenus();
  });
  document.addEventListener('keydown', e=>{
    if(e.key!=='Escape') return;
    if(docmenu.classList.contains('open')){ closeDocMenu(); return; }   // Esc closes the doc menu first
    if(openMenuId) closeMenus();
  });

  // confirmation dialog
  $('confirm-ok').addEventListener('click', ()=>closeConfirm(true));
  $('confirm-cancel').addEventListener('click', ()=>closeConfirm(false));
  $('confirm-overlay').addEventListener('click', e=>{ if(e.target.id==='confirm-overlay') closeConfirm(false); });
  document.addEventListener('keydown', e=>{
    if(!$('confirm-overlay').classList.contains('open')) return;
    if(e.key==='Escape') closeConfirm(false);
    else if(e.key==='Enter') closeConfirm(true);
  });
  // find bar (Ctrl+F) — searches the current document
  const fi=$('find-input');
  fi.addEventListener('input', ()=>setSearchQuery(fi.value,'find'));
  fi.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); navigateSearch(e.shiftKey?-1:1); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); navigateSearch(1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); navigateSearch(-1); }
    else if(e.key==='Escape'){ e.preventDefault(); closeFind(); }
  });
  $('find-next').addEventListener('click', ()=>{ navigateSearch(1); fi.focus(); });
  $('find-prev').addEventListener('click', ()=>{ navigateSearch(-1); fi.focus(); });
  $('find-close').addEventListener('click', closeFind);

  // results column resize
  initResultsResize();

  /* Coalesced to one pass per frame. This handler re-measures the monospace
     metric (which appends a probe element and forces layout), bumps
     layoutEpoch — so the next render re-measures every line — and then renders.
     Undebounced it fired ~60 times during the iOS keyboard slide-in and each
     URL-bar collapse, i.e. exactly when the app most needs to feel smooth. */
  let resizeRaf=0;
  window.addEventListener('resize', ()=>{
    if(resizeRaf) return;
    resizeRaf=requestAnimationFrame(()=>{
      resizeRaf=0;
      measureChar(); applyResultsWidth(store.resultsWidth); render(); syncScroll();
    });
  });
  // The editor font is embedded (data: URIs) but still decodes asynchronously,
  // and its unicode-range subsets (latin / latin-ext / cyrillic) are fetched on
  // first use. Every pixel position derives from the measured glyph width, so
  // pull all three in up front and re-measure + re-render once they land - and
  // again if a subset ever arrives later.
  if(document.fonts && document.fonts.load){
    const refit=()=>{ measureChar(); computeCharsPerLine(); render(); syncScroll(); };
    document.fonts.load('400 16px "JetBrains Mono"', '0aЖ₽').then(refit, ()=>{});
    document.fonts.addEventListener('loadingdone', refit);
  }
  // Row heights are measured per line and reused until that line changes, so
  // anything that narrows or widens the text column must re-measure them all:
  // a scrollbar appearing once the text outgrows the screen (classic
  // scrollbars take width), rotation, the phone keyboard, a resized window.
  // Window 'resize' misses some of these; watch the column itself.
  if(window.ResizeObserver){
    let colW=stack.clientWidth, refitQueued=false;
    new ResizeObserver(()=>{
      const w=stack.clientWidth;
      if(w===colW || refitQueued) return;   // height changes on every render - ignore those
      colW=w; refitQueued=true;
      // next frame: re-rendering inside the observer resizes the observed
      // element again and trips the browser's "ResizeObserver loop" error
      requestAnimationFrame(()=>{ refitQueued=false; colW=stack.clientWidth; bumpLayout(); computeCharsPerLine(); render(); syncScroll(); });
    }).observe(stack);
  }
  // flush pending edits the moment the tab goes to background / closes —
  // debounced timers freeze on mobile and may never fire otherwise
  // On hide/close, fire BOTH the SDK flush (works if the page lingers) and the
  // keepalive REST write (survives a hard unload/OS shutdown) — belt and suspenders.
  // On wake (visible / restored from bfcache), pull the server copy and merge:
  // a tab that slept through edits made elsewhere must reconcile BEFORE it
  // shows anything or writes anything, not wait for the push channel to notice.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='hidden'){ hiddenAt=Date.now(); flushSync(); keepaliveFlush(); maybeReloadForUpdate(); }
    else onSyncWake();
  });
  window.addEventListener('pagehide', ()=>{ flushSync(); keepaliveFlush(); });
  window.addEventListener('pageshow', e=>{ if(e.persisted) hiddenAt=hiddenAt||1; onSyncWake(); });
  // another tab of the app saved: merge it in now (see integrateLocal), and
  // hand back anything it lacks so neither tab can overwrite the other
  window.addEventListener('storage', e=>{
    if(sharedMode || e.key!==STORE_KEY || e.newValue==null || e.newValue===lastLocalRaw) return;
    if(composing) return;   // the save after compositionend sees the change (saveLocal) and merges it then
    lastLocalRaw=e.newValue;
    if(integrateLocal(e.newValue)) saveLocal();
    if(cloudReady && isStoreDirty()) pushCloud();
  });
  initAppUpdates();
  setInterval(syncHeartbeat, 10000);
  // desktop window/tab close. Fire the flushes, and if there are still-unsynced
  // changes (never server-acked — offline, blocked, or edited in the last instant)
  // surface the browser's "leave site?" prompt so the user doesn't walk away
  // thinking it saved. Only when signed in and actually dirty, so it's not noise.
  window.addEventListener('beforeunload', e=>{
    flushSync(); keepaliveFlush();
    if(isCloudDirty()){ e.preventDefault(); e.returnValue=''; return ''; }
  });
  // reflect connectivity in the sync pip; a regained connection reconciles
  // with the server first (merge), then re-pushes anything still unsynced
  window.addEventListener('offline', ()=>setSyncStatus('offline'));
  window.addEventListener('online', ()=>{
    if(fbTried && !fbStarted) startFirebase();
    setSyncStatus('saved'); refreshIdToken();
    if(hardSavePending){ hardSavePending=false; hardSave(); }
    resubscribe();
    refreshFromServer();
    if(cloudReady && isStoreDirty()) pushCloud();
  });
  // keep the keepalive token fresh (Firebase ID tokens expire ~1h)
  setInterval(refreshIdToken, 1800000);

}

document.addEventListener('DOMContentLoaded', boot);

/* expose a tiny hook for automated testing */
window.__calcuta={analyze, fmt, plain, parseNum, regroupText, evaluate, evaluateLenient, tokenizeMath, normalizePasted, dateAt,
  getStore:()=>store, mergeStores, syncPayload, urlRanges, urlLenAt, fullUrl, formatAll,
  stamp, observeTime, observeStore, clockNow:()=>_clock, setClock:(v)=>{ _clock=v; },
  curCmdAt, lineCurCmd, setFx:(r,m)=>{ fxRates=r; fxMeta=m||fxMeta; if(typeof render==='function') render(); },
  offsetToLineCol, dateAtIdx, hang:()=>HANG, editSurface:()=>EDIT.ce ? 'contenteditable' : 'textarea',
  caretCell:(off)=>{ const {row,col}=offsetToLineCol(off); return caretCellRect(row,col); },   // tests: the glyph cell at a caret offset
  convertLegacyMarkup, normalizeStoreDocs, MARKUP_V,
  createDoc, deleteDoc, addTag, setActive:(id)=>{ store.activeId=id; loadActiveIntoEditor(); },
  // seam for tests/staletest.js: drive the real cloud write paths against a
  // fake Firestore, so the "stale device must never clobber newer cloud data"
  // guarantees stay regression-tested. Never used by the app itself.
  __syncTest:{
    inject:(fakeDb,fakeRef,user)=>{ db=fakeDb; cloudRef=fakeRef; currentUser=user; cloudReady=true; cachedIdToken='test-token'; },
    setStore:(s)=>{ store=s; observeStore(store); loadActiveIntoEditor(); },
    getBases:()=>JSON.parse(JSON.stringify(docBases)), setBases:(b)=>{ docBases=b||{}; },
    merge3, mapOffset, lcsMatch, PENDING_KEY, checkAppUpdate, appUpdateReady:()=>appUpdateReady,
    setSynced:(payload)=>{ lastSyncedPayload=payload; everEdited=true; },
    setServerSeenAt:(t)=>{ serverSeenAt=t; },
    state:()=>({ serverSeenAt, cloudReady, lastSyncedPayload, hardSavePending, pushInflight, hardInflight, serverPullInflight, protoBlocked, held:heldRemotes.length }),
    pushCloudNow, flushSync, keepaliveFlush, hardSave, refreshFromServer, reconcileRemote, isCloudDirty, parseRemote,
  }};

})();
</script>
</body>
