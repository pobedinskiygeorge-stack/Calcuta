<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calcuta — редактор с математикой</title>
</head>
<body>
<!-- ============================================================
     Calcuta — a code-editor-styled text editor with a live math
     engine, inspired by numbr.dev. Single self-contained file.
     Sections: [STYLE] · [MARKUP] · [ENGINE] · [EDITOR] · [BOOT]
     ============================================================ -->

<style>
/* ---------- Theme (warm dark, Claude-like) ---------- */
:root{
  --bg:#1c1a18;
  --bg-editor:#211f1c;
  --bg-panel:#171614;
  --border:#332f2a;
  --border-soft:#2a2723;
  --text:#d8d3ca;          /* default / subtask text */
  --text-strong:#f3efe8;   /* subtasks (white) */
  --dim:#6b665c;           /* gutter, muted */
  --dim-2:#4d4941;
  --accent:#c96442;        /* Claude clay */
  --accent-soft:rgba(201,100,66,.16);
  --var:#c79bf0;           /* variables (purple) — top priority */
  --super:#6fb2f0;         /* supertask // (blue) */
  --date:#e3b755;          /* dates dd.mm (yellow) */
  --num:#d9d4c8;           /* numbers */
  --op:#8c8778;            /* operators / keywords */
  --result:#8fc7a8;        /* right-column results */
  --checked-bg:rgba(101,158,120,.15);
  --checked-text:#79856f;
  --row-hover:rgba(255,255,255,.035);
  --row-src:rgba(201,100,66,.14);
  --sel:rgba(201,100,66,.30);

  --font-mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace;
  --font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --fs:14px;
  --lh:24px;
  --pad-y:14px;
  --pad-x:16px;
  --gutter-w:52px;
  --results-w:150px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-ui);font-size:var(--fs);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
::selection{background:var(--sel)}
button{font-family:inherit;color:inherit}

#app{display:flex;height:100vh;width:100vw}

/* ---------- Sidebar ---------- */
#sidebar{
  flex:0 0 250px;background:var(--bg-panel);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;
  transition:margin-left .18s ease;
}
#sidebar.collapsed{margin-left:-250px}
.brand{
  display:flex;align-items:center;gap:9px;
  padding:16px 18px 14px;border-bottom:1px solid var(--border-soft);
}
.brand .logo{
  width:24px;height:24px;border-radius:6px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),#e08a5f);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;
}
.brand .name{font-weight:600;color:var(--text-strong);letter-spacing:.2px}
.brand .name small{display:block;font-weight:400;font-size:11px;color:var(--dim)}

.side-scroll{overflow-y:auto;padding:16px 18px 24px;flex:1 1 auto;min-height:0}
.side-section{margin-bottom:26px}
.side-title{
  font-size:11px;text-transform:uppercase;letter-spacing:.9px;
  color:var(--dim);margin:0 0 11px;font-weight:600;
}

/* tags */
.tag-form{display:flex;gap:7px;align-items:center;margin-bottom:12px}
.tag-form input[type=text]{
  flex:1 1 auto;min-width:0;background:var(--bg-editor);border:1px solid var(--border);
  color:var(--text);border-radius:7px;padding:7px 9px;font-size:13px;outline:none;
}
.tag-form input[type=text]:focus{border-color:var(--accent)}
.swatch-btn{
  flex:0 0 auto;width:30px;height:30px;border-radius:7px;border:1px solid var(--border);
  cursor:pointer;padding:0;position:relative;
}
.swatch-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.add-btn{
  flex:0 0 auto;width:30px;height:30px;border-radius:7px;border:1px solid var(--border);
  background:var(--bg-editor);color:var(--text);cursor:pointer;font-size:18px;line-height:1;
}
.add-btn:hover{border-color:var(--accent);color:var(--accent)}
.tag-list{display:flex;flex-direction:column;gap:6px}
.tag-chip{
  display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;
  background:var(--bg-editor);border:1px solid var(--border-soft);
}
.tag-chip .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.tag-chip .label{flex:1 1 auto;font-size:13px;font-family:var(--font-mono);color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag-chip .del{border:none;background:none;color:var(--dim);cursor:pointer;font-size:15px;padding:0 2px}
.tag-chip .del:hover{color:var(--accent)}
.empty-hint{font-size:12px;color:var(--dim);line-height:1.5}

/* cheatsheet */
.cheat{display:flex;flex-direction:column;gap:8px}
.cheat .row{display:flex;gap:10px;align-items:baseline;font-size:12px}
.cheat code{
  font-family:var(--font-mono);background:var(--bg-editor);border:1px solid var(--border-soft);
  padding:1px 6px;border-radius:5px;color:var(--text);white-space:nowrap;flex:0 0 auto;min-width:58px;
}
.cheat .desc{color:var(--dim);line-height:1.4}

/* ---------- Workspace ---------- */
#workspace{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;background:var(--bg-editor)}
.topbar{
  height:44px;flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:0 14px;border-bottom:1px solid var(--border-soft);background:var(--bg-panel);
}
.icon-btn{
  width:30px;height:30px;border-radius:7px;border:1px solid transparent;background:none;
  color:var(--dim);cursor:pointer;display:grid;place-items:center;
}
.icon-btn:hover{background:var(--bg-editor);color:var(--text)}
.topbar .title{font-size:13px;color:var(--dim);font-family:var(--font-mono)}
.topbar .spacer{flex:1 1 auto}
.topbar .status{font-size:12px;color:var(--dim-2);font-family:var(--font-mono)}

/* editor grid */
#editor{
  flex:1 1 auto;display:flex;min-height:0;overflow-y:auto;overflow-x:hidden;
  font-family:var(--font-mono);font-size:var(--fs);line-height:var(--lh);
}
#editor::-webkit-scrollbar{width:11px}
#editor::-webkit-scrollbar-thumb{background:#3a3630;border-radius:8px;border:3px solid var(--bg-editor)}

/* gutter (line numbers) — thin dim column, selectable, colorable */
#gutter{
  flex:0 0 var(--gutter-w);padding:var(--pad-y) 0;text-align:right;
  user-select:none;position:relative;z-index:2;
}
.gutter-line{
  height:var(--lh);line-height:var(--lh);padding-right:12px;color:var(--dim);
  font-size:12px;cursor:pointer;position:relative;white-space:nowrap;
}
.gutter-line:hover{color:var(--text)}
.gutter-line.selected{background:var(--accent-soft)}
.gutter-line.src::after{content:"";position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--accent)}

/* stack: layered highlight / textarea / hotspots. Height driven by in-flow #highlight. */
#stack{flex:1 1 auto;position:relative;min-width:0;overflow:hidden}

.layer{
  margin:0;padding:var(--pad-y) var(--pad-x);
  font-family:var(--font-mono);font-size:var(--fs);line-height:var(--lh);
  white-space:pre;tab-size:4;border:0;
}

/* highlight is the in-flow layer that gives #stack its height */
#highlight{position:relative;z-index:1;pointer-events:none;color:var(--text);
  width:100%;min-height:100%}
.hl-line{height:var(--lh);width:100%}
.hl-line.hover{background:var(--row-hover)}
.hl-line.src{background:var(--row-src)}
.hl-line.checked{background:var(--checked-bg)}
#highlight .num{color:var(--num)}
#highlight .op{color:var(--op)}
#highlight .date{color:var(--date);font-weight:500}
#highlight .super{color:var(--super)}
#highlight .header{color:var(--dim);font-weight:600}
#highlight .var{color:var(--var);font-weight:500}
#highlight .tag{font-weight:500;border-radius:4px}
#highlight .sub{color:var(--text-strong)}
#highlight .checkmark{color:var(--result);font-weight:600}
#highlight .cbox{color:var(--dim)}
.hl-line.checked{color:var(--checked-text)}
.hl-line.checked .num,.hl-line.checked .var,.hl-line.checked .op,
.hl-line.checked .date,.hl-line.checked .tag,.hl-line.checked .sub{
  color:var(--checked-text)!important;font-weight:400}
.hl-line.checked .checkmark{color:var(--result)!important}

#input{
  position:absolute;top:0;left:0;width:100%;height:100%;z-index:3;resize:none;overflow:hidden;
  background:transparent;color:transparent;caret-color:var(--accent);
  outline:none;white-space:pre;
}
#input::selection{background:var(--sel)}

#hotspots{position:absolute;top:0;left:0;width:100%;height:100%;z-index:4;pointer-events:none}
.cbox-hit{
  position:absolute;width:3ch;height:var(--lh);cursor:pointer;pointer-events:auto;border-radius:4px;
}
.cbox-hit:hover{background:rgba(255,255,255,.06)}

/* results column */
#results{
  flex:0 0 var(--results-w);padding:var(--pad-y) 0;position:relative;z-index:2;
  border-left:1px solid var(--border-soft);user-select:none;
}
.result-line{
  height:var(--lh);line-height:var(--lh);padding:0 14px;text-align:right;
  color:var(--result);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:default;position:relative;
}
.result-line.has:hover{background:var(--accent-soft);cursor:pointer}
.result-line.copied{color:#fff}
.result-line .eq{color:var(--dim-2);margin-right:4px}

/* context menu (line-number colors) */
#ctxmenu{
  position:fixed;z-index:50;background:var(--bg-panel);border:1px solid var(--border);
  border-radius:10px;padding:9px;box-shadow:0 12px 34px rgba(0,0,0,.5);display:none;
}
#ctxmenu.open{display:block}
.ctx-title{font-size:11px;color:var(--dim);margin:0 2px 8px;letter-spacing:.4px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.sw{width:22px;height:22px;border-radius:6px;cursor:pointer;border:1px solid rgba(255,255,255,.12)}
.sw:hover{transform:scale(1.12)}
.sw.clear{display:grid;place-items:center;background:var(--bg-editor);color:var(--dim);font-size:13px}

/* toast */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--bg-panel);border:1px solid var(--border);color:var(--text);
  padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.45);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:720px){
  #sidebar{position:absolute;z-index:40;height:100%;box-shadow:0 0 40px rgba(0,0,0,.5)}
  :root{--results-w:104px;--gutter-w:44px}
}
</style>

<!-- ================= MARKUP ================= -->
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">∑</div>
      <div class="name">Calcuta<small>текст + математика</small></div>
    </div>
    <div class="side-scroll">
      <div class="side-section">
        <h3 class="side-title">Тэги</h3>
        <div class="tag-form">
          <input id="tag-name" type="text" placeholder="имя тэга" maxlength="24" autocomplete="off">
          <button class="swatch-btn" id="tag-swatch" title="цвет тэга">

          </button>

      </div>
    </div>
  </aside>

  <div id="workspace">

  </div>
</div>

<div id="ctxmenu">
  <p class="ctx-title">Цвет номеров строк</p>
  <div class="swatches" id="ctx-swatches"></div>
</div>
<div id="toast"></div>

<!-- ================= SCRIPT ================= -->
<script>
"use strict";
(function(){

/* ================================================================
   [ENGINE] — number formatting & math evaluation
   ================================================================ */

const NBSP = ' ';           // narrow no-break space — visual thousands separator
const GROUP_RE = new RegExp(NBSP, 'g');

/* Group the integer part every 3 digits with NBSP. */
function groupDigits(intStr){
  return intStr.replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
}

/* Format a JS number for display: grouped integer, comma decimal. */
function fmt(n){
  if(n===null||n===undefined||!isFinite(n)) return '';
  const neg = n<0; let x = Math.abs(n);
  // round to kill FP noise, keep up to 8 decimals
  let s = x.toFixed(8);
  s = s.replace(/\.?0+$/,'');           // trim trailing zeros / dot
  let [intPart, frac] = s.split('.');
  intPart = groupDigits(intPart);
  let out = intPart + (frac ? (','+frac) : '');
  return (neg?'-':'') + out;
}

/* Plain copy form: comma decimal, no grouping spaces. */
function plain(n){ return fmt(n).replace(GROUP_RE,''); }

/* Parse a numeric literal (already isolated) into a JS number.
   Accepts NBSP/space grouping and comma decimal; suffix k/M. */
function parseNum(raw){
  let s = raw.replace(GROUP_RE,'').replace(/\s/g,'');
  let mult = 1;
  const suf = s.slice(-1);
  if(suf==='k'||suf==='K'){ mult=1e3; s=s.slice(0,-1); }
  else if(suf==='M'){ mult=1e6; s=s.slice(0,-1); }
  s = s.replace(',', '.');
  const v = parseFloat(s);
  return isFinite(v) ? v*mult : NaN;
}

/* ---- Date detection: dd.mm with a dot (comma stays decimal) ---- */
const DATE_RE = /\b(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?\b/;
function isDateMatch(d,m){ d=+d;m=+m; return d>=1&&d<=31&&m>=1&&m<=12; }

/* ---- Number token regex.
   Alt 1: space/NBSP-grouped thousands ("2 500 000", "1 234,5").
   Alt 2: plain / NBSP-run / suffixed ("2500000", "500k", "12,5").
   Regular space (U+0020) and NBSP (U+202F) both act as group separators. ---- */
const SEP_RE = /[  ]/g;
const NUM_RE = /\d{1,3}(?:[  ]\d{3})+(?:,\d+)?|\d[\d ]*(?:,\d+)?(?:[kKM])?/;

/* ================================================================
   Tokenizer for math evaluation.
   Produces a flat token list; unknown words are dropped ("context").
   `vars` is a Set of known variable names (lower-cased).
   ================================================================ */
const KEYWORDS = new Set(['sum','total','subtotal','prev','previous','avg','average','mean']);

function tokenizeMath(text, vars){
  const toks = [];
  let i=0; const n=text.length;
  // Build a sorted list of var names (longest first) for greedy matching.
  const varNames = [...vars].sort((a,b)=>b.length-a.length);
  while(i<n){
    const c = text[i];
    if(c===' '||c==='\t'){ i++; continue; }
    // date -> skip (treated as context for math)
    const dm = text.slice(i).match(/^(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?\b/);
    if(dm && isDateMatch(dm[1],dm[2])){ i+=dm[0].length; continue; }
    // number
    const nm = text.slice(i).match(new RegExp('^(?:'+NUM_RE.source+')'));
    if(nm && /\d/.test(nm[0])){ toks.push({t:'num',v:parseNum(nm[0])}); i+=nm[0].length; continue; }
    // operators & parens
    if('+-*/^()'.includes(c)){ toks.push({t:c}); i++; continue; }
    if(c==='x'||c==='X'){ // 'x' as multiply only between values
      const prev=toks[toks.length-1];
      const nextCh=text[i+1]||'';
      if(prev&&(prev.t==='num'||prev.t===')'||prev.t==='var'||prev.t==='agg')&&/[\s\d(]/.test(nextCh)){
        toks.push({t:'*'}); i++; continue;
      }
    }
    if(c==='%'){ toks.push({t:'%'}); i++; continue; }
    // word: keyword / variable / 'of' / context
    const wm = text.slice(i).match(/^[\p{L}\p{L}_][\p{L}\d_]*/u);
    if(wm){
      // try greedy multi-word variable match starting here
      let matchedVar = matchVarAt(text, i, varNames);
      if(matchedVar){ toks.push({t:'var',name:matchedVar.name}); i+=matchedVar.len; continue; }
      const w = wm[0].toLowerCase();
      if(w==='of'){ toks.push({t:'of'}); i+=wm[0].length; continue; }
      if(KEYWORDS.has(w)){ toks.push({t:'agg',v:w}); i+=wm[0].length; continue; }
      i+=wm[0].length; continue; // context word -> ignore
    }
    i++; // unknown char -> skip
  }
  return toks;
}

/* Match the longest known variable name at position i (word-boundary aware). */
function matchVarAt(text, i, varNames){
  const before = text[i-1]||' ';
  if(/[\p{L}\d_]/u.test(before)) return null; // must start at a word boundary
  for(const name of varNames){
    const seg = text.substr(i, name.length);
    if(seg.toLowerCase()===name){
      const after = text[i+name.length]||' ';
      if(!/[\p{L}\d_]/u.test(after)) return {name, len:name.length};
    }
  }
  return null;
}

/* ================================================================
   Recursive-descent parser over the token list.
   Values carry a `pct` flag for percentage semantics.
   Returns a JS number or null.
   ================================================================ */
function evaluate(toks, scope, ctx){
  let p=0;
  const peek=()=>toks[p];
  const next=()=>toks[p++];

  function val(v,pct){ return {v, pct:!!pct}; }
  function num(node){ return node.pct ? node.v/100 : node.v; }

  function parseExpr(){ return parseAdd(); }

  function parseAdd(){
    let a=parseMul();
    while(peek() && (peek().t==='+'||peek().t==='-')){
      const op=next().t; const b=parseMul();
      if(b.pct)      a=val(op==='+'? a.v + a.v*b.v/100 : a.v - a.v*b.v/100);
      else if(a.pct) a=val(op==='+'? a.v/100 + b.v    : a.v/100 - b.v);
      else           a=val(op==='+'? a.v + b.v         : a.v - b.v);
    }
    return a;
  }
  function parseMul(){
    let a=parseUnary();
    while(peek() && (peek().t==='*'||peek().t==='/'||peek().t==='of')){
      const op=next().t; const b=parseUnary();
      if(op==='of') a=val((a.pct? a.v/100 : a.v) * b.v);
      else if(op==='*') a=val(num(a)*num(b));
      else a=val(num(a)/num(b));
    }
    return a;
  }
  function parseUnary(){
    if(peek() && peek().t==='-'){ next(); const u=parseUnary(); return val(-u.v, u.pct); }
    if(peek() && peek().t==='+'){ next(); return parseUnary(); }
    return parsePow();
  }
  function parsePow(){
    let a=parsePostfix();
    if(peek() && peek().t==='^'){ next(); const b=parseUnary(); return val(Math.pow(num(a),num(b))); }
    return a;
  }
  function parsePostfix(){
    let a=parsePrimary();
    while(peek() && peek().t==='%'){ next(); a=val(a.v, true); }
    return a;
  }
  function parsePrimary(){
    const tk=peek();
    if(!tk) throw 0;
    if(tk.t==='num'){ next(); return val(tk.v); }
    if(tk.t==='('){ next(); const e=parseExpr(); if(peek()&&peek().t===')') next(); else throw 0; return e; }
    if(tk.t==='var'){ next(); const key=tk.name.toLowerCase();
      const v=scope[key]; if(v===undefined||v===null||isNaN(v)) throw 0; return val(v); }
    if(tk.t==='agg'){ next();
      const w=tk.v;
      if(w==='prev'||w==='previous') return val(ctx.prev==null?0:ctx.prev);
      const arr=ctx.section;
      if(w==='avg'||w==='average'||w==='mean') return val(arr.length? arr.reduce((s,x)=>s+x,0)/arr.length : 0);
      return val(arr.reduce((s,x)=>s+x,0)); // sum/total/subtotal
    }
    throw 0;
  }

  try{
    if(toks.length===0) return null;
    const r=parseExpr();
    if(p!==toks.length) return null;      // leftover tokens -> not a clean expression
    const out = r.pct ? r.v/100 : r.v;
    return isFinite(out) ? out : null;
  }catch(e){ return null; }
}

/* ================================================================
   Line classification & document analysis.
   ================================================================ */
const CB_RE   = /^(\s*)\[([ xX])\]\s?/;     // checkbox marker
const SUPER_RE= /^(\s*)\/\/\s?/;            // supertask //
const HEADER_RE=/^(\s*)#\s?/;               // header #

function classify(line){
  let m;
  if((m=CB_RE.exec(line)))    return {kind:'checkbox', checked:/x/i.test(m[2]), markerLen:m[0].length, indent:m[1].length};
  if((m=SUPER_RE.exec(line))) return {kind:'super', markerLen:m[0].length};
  if((m=HEADER_RE.exec(line)))return {kind:'header', markerLen:m[0].length};
  return {kind:'text', markerLen:0};
}

/* Collect all variable-assignment names across the whole document. */
const ASSIGN_RE = /^\s*(?:\[[ xX]\]\s?|\/\/\s?|#\s?)?([\p{L}][\p{L}\d _]*?)\s*=\s*(.+)$/u;
function collectVars(lines){
  const set=new Set();
  for(const line of lines){
    const m=ASSIGN_RE.exec(line);
    if(m){
      const name=m[1].trim().toLowerCase();
      // reject if the "name" is actually a number or a keyword
      if(name && !/^\d/.test(name) && !KEYWORDS.has(name)) set.add(name);
    }
  }
  return set;
}

/* Analyze the full document top-to-bottom, producing per-line results. */
function analyze(text){
  const lines=text.split('\n');
  const vars=collectVars(lines);
  const scope={};
  const ctx={section:[], prev:null};
  const varDefLine={};                       // name -> first defining line index
  const out=[];

  lines.forEach((line, idx)=>{
    const cls=classify(line);
    const content=line.slice(cls.markerLen);
    let result=null, assignedName=null;

    // section boundary
    if(cls.kind==='super'||cls.kind==='header'){ ctx.section=[]; ctx.prev=null; }

    // assignment?
    const am=ASSIGN_RE.exec(line);
    if(am){
      const name=am[1].trim().toLowerCase();
      if(name && !/^\d/.test(name) && !KEYWORDS.has(name)){
        const rhs=am[2];
        const toks=tokenizeMath(rhs, vars);
        const v=evaluate(toks, scope, ctx);
        if(v!==null){ scope[name]=v; result=v; assignedName=name; }
        if(varDefLine[name]===undefined) varDefLine[name]=idx;
      }
    }

    if(result===null && cls.kind!=='super' && cls.kind!=='header'){
      const toks=tokenizeMath(content, vars);
      result=evaluate(toks, scope, ctx);
    }

    // feed section aggregation (skip boundary lines)
    if(result!==null && cls.kind!=='super' && cls.kind!=='header'){
      ctx.section.push(result);
      ctx.prev=result;
    }

    out.push({raw:line, cls, content, result, assignedName});
  });

  return {lines:out, vars, varDefLine, scope};
}

/* ================================================================
   [HIGHLIGHT] — build colored spans per line, respecting priority:
   var > tag > super/header(line) > date > number > operator > text
   Also returns token ranges for hover source-mapping.
   ================================================================ */
function esc(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function buildLineHTML(item, vars, varDefLine, tags){
  const {raw, cls} = item;
  const len=raw.length;
  // char-class array; higher priority overrides
  const P={base:0, num:1, date:2, op:3, tag:4, varr:5};
  const cclass=new Array(len).fill('');   // css class per char
  const cmeta =new Array(len).fill(null); // {type, defLine} for hover
  const prio  =new Array(len).fill(-1);
  const color =new Array(len).fill(null); // inline color (tags)

  function paint(s,e,cls,pr,meta,col){
    for(let k=s;k<e&&k<len;k++){
      if(pr>=prio[k]){ prio[k]=pr; cclass[k]=cls; cmeta[k]=meta||cmeta[k]; color[k]=col||null; }
    }
  }

  const markerLen=cls.markerLen;
  // Only checkboxes render their marker separately; super/header render the
  // whole line (marker included) so char widths match the textarea exactly.
  const bodyStart=(cls.kind==='checkbox')?markerLen:0;

  // ---- whole-line styles for super/header (include the // or # marker) ----
  if(cls.kind==='super'){ paint(0,len,'super',P.base); }
  else if(cls.kind==='header'){ paint(0,len,'header',P.base); }

  const scanText=raw;

  // ---- numbers (skip dates) ----
  if(cls.kind!=='super'&&cls.kind!=='header'){
    let i=bodyStart;
    while(i<len){
      const dm=scanText.slice(i).match(/^(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?\b/);
      if(dm && isDateMatch(dm[1],dm[2])){ paint(i,i+dm[0].length,'date',P.date,{type:'date'}); i+=dm[0].length; continue; }
      const nm=scanText.slice(i).match(new RegExp('^(?:'+NUM_RE.source+')'));
      if(nm && /\d/.test(nm[0]) && !/[\p{L}_]/u.test(scanText[i-1]||' ')){
        paint(i,i+nm[0].length,'num',P.num,{type:'num'}); i+=nm[0].length; continue;
      }
      i++;
    }
    // ---- operators ----
    for(let k=bodyStart;k<len;k++){
      if('+-*/^()%='.includes(scanText[k]) && prio[k]<P.op) paint(k,k+1,'op',P.op,{type:'op'});
    }
    // ---- dates already painted above ----
  }

  // ---- tags (custom colors) ----
  for(const tag of tags){
    if(!tag.label) continue;
    const re=new RegExp('(?<![\\p{L}\\d_])'+escapeRe(tag.label)+'(?![\\p{L}\\d_])','giu');
    let mt;
    while((mt=re.exec(raw))){
      paint(mt.index, mt.index+mt[0].length, 'tag', P.tag, {type:'tag'}, tag.color);
      if(mt.index===re.lastIndex) re.lastIndex++;
    }
  }

  // ---- variables (top priority) ----
  if(vars.size){
    const names=[...vars].sort((a,b)=>b.length-a.length);
    for(const name of names){
      const re=new RegExp('(?<![\\p{L}\\d_])'+escapeRe(name)+'(?![\\p{L}\\d_])','giu');
      let mt;
      while((mt=re.exec(raw))){
        const def=varDefLine[name];
        paint(mt.index, mt.index+mt[0].length, 'var', P.varr, {type:'var', name, defLine:def});
        if(mt.index===re.lastIndex) re.lastIndex++;
      }
    }
  }

  // ---- checkbox marker: render the LITERAL "[ ]"/"[x]" so column widths
  //      stay identical to the textarea (perfect monospace alignment). ----
  let markerHTML='';
  if(cls.kind==='checkbox'){
    const brCls = cls.checked ? 'checkmark' : 'cbox';
    markerHTML = '<span class="'+brCls+'">'+esc(raw.slice(0,3))+'</span>'
               + '<span class="cbox">'+esc(raw.slice(3,markerLen))+'</span>';
  }

  // Build body spans, grouping consecutive same class+color.
  let bodyHTML='';
  let k=bodyStart;
  while(k<len){
    const cl=cclass[k], col=color[k];
    let j=k+1;
    while(j<len && cclass[j]===cl && color[j]===col) j++;
    const chunk=esc(raw.slice(k,j));
    if(cl){
      const style=col? ' style="color:'+col+'"' : '';
      bodyHTML+='<span class="'+cl+'"'+style+'>'+chunk+'</span>';
    }else{
      bodyHTML+='<span class="'+(cls.kind==='text'?'sub':'')+'">'+chunk+'</span>';
    }
    k=j;
  }

  // Empty lines keep their height via the fixed .hl-line height; no filler
  // char is added so overlay text stays 1:1 with the textarea.
  const html = markerHTML + bodyHTML;
  return {html, cmeta, markerLen, checked:(cls.kind==='checkbox'&&cls.checked)};
}

function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

/* ================================================================
   [EDITOR] — DOM wiring, layers, interaction
   ================================================================ */
const $=id=>document.getElementById(id);
const input=$('input'), highlight=$('highlight'),
      gutter=$('gutter'), results=$('results'), hotspots=$('hotspots'),
      stack=$('stack'), editor=$('editor'), ctxmenu=$('ctxmenu'),
      toast=$('toast'), statusEl=$('status');

const STORE_KEY='calcuta.v1';
let state={
  text:'',
  tags:[],                 // {label,color}
  lineColors:{},           // lineIndex -> color
};
let model=null;            // last analyze() + per-line meta
let selectedGutter=new Set();
let charW=8.4;             // measured monospace char width

/* ---------- measure monospace metrics ---------- */
function measureChar(){
  const probe=document.createElement('span');
  probe.style.cssText='position:absolute;visibility:hidden;white-space:pre;'+
    'font-family:var(--font-mono);font-size:var(--fs)';
  probe.textContent='0000000000';
  document.body.appendChild(probe);
  charW=probe.getBoundingClientRect().width/10;
  probe.remove();
  window.__charW=charW;
}

/* ---------- number masking (live grouping) ---------- */
/* Masking matcher: a digit run that may already carry NBSP grouping (but NOT
   regular spaces). Only NBSP is added/removed by masking, which keeps the
   caret-preservation math valid (it counts non-NBSP characters). */
const MASK_NUM_RE = '\\d[\\d\\u202f]*(?:,\\d+)?(?:[kKM])?';

/* Regroup standalone numbers in `text` (dates & identifiers preserved).
   Collapses any existing NBSP grouping then regroups the whole run so
   mid-typing states like "1<NBSP>2345" become "12 345", not "1 2345". */
function regroupText(text){
  let out=''; let i=0; const n=text.length;
  let prevChar='';
  while(i<n){
    const rest=text.slice(i);
    // date -> passthrough
    const dm=rest.match(/^(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?\b/);
    if(dm && isDateMatch(dm[1],dm[2])){ out+=dm[0]; i+=dm[0].length; prevChar=dm[0].slice(-1); continue; }
    const ch=text[i];
    if(/\d/.test(ch)){
      if(/[\p{L}_]/u.test(prevChar)){ // part of identifier -> passthrough alnum run
        const wm=rest.match(/^[\p{L}\d_]+/u); out+=wm[0]; i+=wm[0].length; prevChar=wm[0].slice(-1); continue;
      }
      const nm=rest.match(new RegExp('^'+MASK_NUM_RE));   // digits + NBSP only
      let tok=nm[0];
      let suffix=''; if(/[kKM]$/.test(tok)){ suffix=tok.slice(-1); tok=tok.slice(0,-1); }
      let [ip,fp]=tok.replace(GROUP_RE,'').split(',');    // strip NBSP, keep run whole
      ip=groupDigits(ip);
      out+= ip + (fp!==undefined? (','+fp):'') + suffix;
      i+=nm[0].length; prevChar=nm[0].slice(-1); continue;
    }
    out+=ch; i++; prevChar=ch;
  }
  return out;
}

/* Apply masking to the textarea, preserving caret by counting non-NBSP chars. */
function applyMask(){
  const val=input.value;
  const caret=input.selectionStart;
  const nonSepBefore=countNonSep(val, caret);
  const masked=regroupText(val);
  if(masked===val) return;
  const newCaret=posAfterNonSep(masked, nonSepBefore);
  input.value=masked;
  input.setSelectionRange(newCaret,newCaret);
}
function countNonSep(s, upto){ let c=0; for(let k=0;k<upto;k++) if(s[k]!==NBSP) c++; return c; }
function posAfterNonSep(s, count){ let c=0,k=0; for(;k<s.length;k++){ if(c===count) return k; if(s[k]!==NBSP) c++; } return s.length; }

/* ---------- render pipeline ---------- */
function render(){
  const text=input.value;
  const A=analyze(text);
  model={data:A, meta:[]};

  const n=A.lines.length;
  // gutter
  let g='';
  for(let k=0;k<n;k++){
    const col=state.lineColors[k];
    const sel=selectedGutter.has(k)?' selected':'';
    g+='<div class="gutter-line'+sel+'" data-i="'+k+'"'+(col?' style="color:'+col+'"':'')+'>'+(k+1)+'</div>';
  }
  gutter.innerHTML=g;

  // highlight + hotspots + results
  let hl='', hs='', rs='';
  for(let k=0;k<n;k++){
    const built=buildLineHTML(A.lines[k], A.vars, A.varDefLine, state.tags);
    model.meta[k]=built.cmeta;
    hl+='<div class="hl-line'+(built.checked?' checked':'')+'" data-i="'+k+'">'+built.html+'</div>';

    const it=A.lines[k];
    if(it.cls.kind==='checkbox'){
      const top=k*24 + 14;                       // lineIndex*lh + padY
      const left=(it.cls.indent||0)*charW + 16;  // + padX
      hs+='<div class="cbox-hit" data-i="'+k+'" style="top:'+top+'px;left:'+left+'px"></div>';
    }
    if(it.result!==null){
      rs+='<div class="result-line has" data-i="'+k+'" data-v="'+esc(plain(it.result))+'">'
        +'<span class="eq">=</span>'+esc(fmt(it.result))+'</div>';
    }else{
      rs+='<div class="result-line" data-i="'+k+'"></div>';
    }
  }
  highlight.innerHTML=hl;
  hotspots.innerHTML=hs;
  results.innerHTML=rs;

  // status
  const words=text.trim()?text.trim().split(/\s+/).length:0;
  statusEl.textContent=n+' стр · '+words+' сл';

  syncScroll();
}

/* ---------- persistence ---------- */
let saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    state.text=input.value;
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  },300);
}
function load(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(STORE_KEY)||'null'); }catch(e){}
  if(s){ state=Object.assign(state, s); }
  input.value = state.text || DEFAULT_DOC;
  applyMask();
  renderTags();
  render();
}

const DEFAULT_DOC=
`// Проект: ремонт кухни
[ ] купить плитку
[ ] заказать столешницу
[x] замерить стены

бюджет = 500k
плитка = 1200 * 8
столешница = 45000
sum

срок 12.05
скидка = бюджет - 10%
итого = бюджет + столешница + плитка`;

/* ---------- checkbox transform (++ -> [ ]) & toggle ---------- */
function transformDoubleplus(){
  // If the caret line starts with "++ " or "++", convert to "[ ] ".
  const val=input.value;
  const caret=input.selectionStart;
  const lineStart=val.lastIndexOf('\n',caret-1)+1;
  const lineEnd=val.indexOf('\n',caret); const end=lineEnd===-1?val.length:lineEnd;
  const line=val.slice(lineStart,end);
  // Require the completing space ("++ ") so it fires on command completion,
  // not on the bare "++" mid-typing (which would duplicate the space).
  const m=/^(\s*)\+\+ (.*)$/.exec(line);
  if(m){
    const rebuilt=m[1]+'[ ] '+m[2];
    const before=val.slice(0,lineStart), after=val.slice(end);
    input.value=before+rebuilt+after;
    const delta=rebuilt.length-line.length;
    const nc=Math.max(lineStart+m[1].length+4, caret+delta);
    input.setSelectionRange(nc,nc);
    return true;
  }
  return false;
}
function toggleCheckbox(i){
  const lines=input.value.split('\n');
  if(i<0||i>=lines.length) return;
  lines[i]=lines[i].replace(/^(\s*)\[([ xX])\]/, (mm,sp,st)=> sp+'['+(/[xX]/.test(st)?' ':'x')+']');
  input.value=lines.join('\n');
  onChange();
}

/* ---------- main change handler ---------- */
let composing=false;
function onInput(){
  if(composing) return;
  transformDoubleplus();
  applyMask();
  onChange();
}
function onChange(){ render(); scheduleSave(); }

/* ---------- tags UI ---------- */
function renderTags(){
  const list=$('tag-list');
  if(!state.tags.length){ list.innerHTML='<p class="empty-hint">Добавь тэг — его текст будет подсвечен выбранным цветом (приоритет ниже переменных).</p>'; return; }
  list.innerHTML=state.tags.map((t,idx)=>
    '<div class="tag-chip"><span class="dot" style="background:'+t.color+'"></span>'+
    '<span class="label">'+esc(t.label)+'</span>'+
    '<button class="del" data-i="'+idx+'" title="удалить">×</button></div>').join('');
}
function addTag(){
  const name=$('tag-name').value.trim();
  const color=$('tag-color').value;
  if(!name) return;
  if(!state.tags.some(t=>t.label.toLowerCase()===name.toLowerCase())) state.tags.push({label:name,color});
  $('tag-name').value='';
  renderTags(); render(); scheduleSave();
}

/* ---------- line-number color context menu ---------- */
const PALETTE=['#e0663f','#e3b755','#8fcf9c','#6fb2f0','#c79bf0','#e78ab0',
               '#7fd4c4','#b7c96b','#d98f5a','#9aa0aa','#f0d071','#ffffff'];
function buildSwatches(){
  const wrap=$('ctx-swatches');
  wrap.innerHTML=PALETTE.map(c=>'<div class="sw" data-c="'+c+'" style="background:'+c+'"></div>').join('')
    +'<div class="sw clear" data-c="" title="сбросить">×</div>';
}
function openCtxMenu(x,y){
  ctxmenu.style.left=Math.min(x, window.innerWidth-200)+'px';
  ctxmenu.style.top=Math.min(y, window.innerHeight-160)+'px';
  ctxmenu.classList.add('open');
}
function closeCtxMenu(){ ctxmenu.classList.remove('open'); }

/* ---------- hover: row lighten + source-line highlight ---------- */
let hoverRow=-1, srcRow=-1;
function clearRowFx(){
  highlight.querySelectorAll('.hl-line.hover,.hl-line.src').forEach(el=>el.classList.remove('hover','src'));
  gutter.querySelectorAll('.gutter-line.src').forEach(el=>el.classList.remove('src'));
}
function setRowFx(){
  clearRowFx();
  const rb=highlight.children;
  if(hoverRow>=0 && rb[hoverRow]) rb[hoverRow].classList.add('hover');
  if(srcRow>=0 && rb[srcRow]){ rb[srcRow].classList.add('src'); const gl=gutter.children[srcRow]; if(gl) gl.classList.add('src'); }
}
function hitTest(clientX,clientY){
  const r=stack.getBoundingClientRect();
  const y=clientY-r.top + stack.scrollTop - 14;      // minus padY
  const x=clientX-r.left + stack.scrollLeft - 16;    // minus padX
  const row=Math.floor(y/24);
  const col=Math.floor(x/charW);
  return {row,col};
}
function onStackMove(e){
  const {row,col}=hitTest(e.clientX,e.clientY);
  const n=model?model.data.lines.length:0;
  hoverRow=(row>=0&&row<n)?row:-1;
  srcRow=-1;
  if(hoverRow>=0 && model.meta[hoverRow]){
    const meta=model.meta[hoverRow][col];
    if(meta){
      if(meta.type==='var' && meta.defLine!==undefined && meta.defLine!==null) srcRow=meta.defLine;
      else if(meta.type==='op'||meta.type==='num') srcRow=hoverRow;
    }
  }
  setRowFx();
}
function onStackLeave(){ hoverRow=-1; srcRow=-1; setRowFx(); }

/* Mirror the textarea's horizontal auto-scroll (long lines) onto the overlay
   layers so highlighted text and checkbox hotspots stay pixel-aligned. */
function syncScroll(){
  const x='translateX('+(-input.scrollLeft)+'px)';
  highlight.style.transform=x;
  hotspots.style.transform=x;
}

/* ---------- clipboard: strip NBSP on copy/cut ---------- */
function stripOnCopy(e){
  const sel=window.getSelection?window.getSelection().toString():'';
  const ta=input;
  const s=ta.selectionStart, en=ta.selectionEnd;
  if(document.activeElement===ta && en>s){
    const txt=ta.value.slice(s,en).replace(GROUP_RE,'');
    e.clipboardData.setData('text/plain',txt);
    e.preventDefault();
    if(e.type==='cut'){
      ta.value=ta.value.slice(0,s)+ta.value.slice(en);
      ta.setSelectionRange(s,s); onChange();
    }
  }
}
/* ---------- paste: normalize numbers to app format ---------- */
function onPaste(e){
  const txt=(e.clipboardData||window.clipboardData).getData('text');
  if(!txt) return;
  e.preventDefault();
  const normalized=normalizePasted(txt);
  document.execCommand('insertText',false,normalized);
}
function normalizePasted(txt){
  // Convert loose numbers (1,234.56 / 1 234,56 / 1234.5) to app format.
  return txt.replace(/\d[\d.,   ]*\d|\d/g, (m)=>{
    // ignore date-looking dd.mm(.yyyy)
    const dm=m.match(/^(\d{1,2})\.(\d{1,2})(?:\.\d{2,4})?$/);
    if(dm && isDateMatch(dm[1],dm[2])) return m;
    let s=m.replace(/[   ]/g,'');
    // decide decimal separator: last '.' or ',' followed by 1-2..n digits, only if single
    let dec=null;
    const lastComma=s.lastIndexOf(','), lastDot=s.lastIndexOf('.');
    const sep=Math.max(lastComma,lastDot);
    if(sep>=0){
      const tail=s.slice(sep+1);
      if(/^\d+$/.test(tail) && tail.length<=6 && (s.slice(0,sep).match(/[.,]/g)||[]).length>=0){
        // treat as decimal if there are digits after and it's the last separator
        dec=sep;
      }
    }
    let intp, frac='';
    if(dec!==null){ intp=s.slice(0,dec).replace(/[.,]/g,''); frac=s.slice(dec+1); }
    else{ intp=s.replace(/[.,]/g,''); }
    if(!/^\d+$/.test(intp)) return m;
    let out=groupDigits(intp)+(frac?(','+frac):'');
    return out;
  });
}

/* ---------- gutter selection ---------- */
let lastGutterClick=-1;
function onGutterClick(e){
  const el=e.target.closest('.gutter-line'); if(!el) return;
  const i=+el.dataset.i;
  if(e.shiftKey && lastGutterClick>=0){
    const [a,b]=[Math.min(lastGutterClick,i),Math.max(lastGutterClick,i)];
    for(let k=a;k<=b;k++) selectedGutter.add(k);
  }else if(e.metaKey||e.ctrlKey){
    selectedGutter.has(i)?selectedGutter.delete(i):selectedGutter.add(i);
    lastGutterClick=i;
  }else{
    selectedGutter.clear(); selectedGutter.add(i); lastGutterClick=i;
  }
  refreshGutterSel();
}
function refreshGutterSel(){
  gutter.querySelectorAll('.gutter-line').forEach(el=>{
    el.classList.toggle('selected', selectedGutter.has(+el.dataset.i));
  });
}
function onGutterCtx(e){
  const el=e.target.closest('.gutter-line'); if(!el) return;
  e.preventDefault();
  const i=+el.dataset.i;
  if(!selectedGutter.has(i)){ selectedGutter.clear(); selectedGutter.add(i); lastGutterClick=i; refreshGutterSel(); }
  openCtxMenu(e.clientX,e.clientY);
}
function applyLineColor(color){
  selectedGutter.forEach(i=>{
    if(color) state.lineColors[i]=color; else delete state.lineColors[i];
  });
  closeCtxMenu(); render(); refreshGutterSel(); scheduleSave();
}

/* ---------- copy result ---------- */
function onResultsClick(e){
  const el=e.target.closest('.result-line.has'); if(!el) return;
  const v=el.dataset.v||'';
  copyText(v);
  el.classList.add('copied');
  setTimeout(()=>el.classList.remove('copied'),450);
  showToast('Скопировано: '+v);
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t)); }
  else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove();
}
let toastTimer=null;
function showToast(msg){
  toast.textContent=msg; toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),1400);
}

/* ---------- scroll sync (highlight/rows already absolute in stack) ---------- */
/* stack scrolls horizontally; gutter & results scroll vertically with #editor. */

/* ================================================================
   [BOOT]
   ================================================================ */
function boot(){
  measureChar();
  buildSwatches();
  load();

  input.addEventListener('input', onInput);
  input.addEventListener('compositionstart', ()=>composing=true);
  input.addEventListener('compositionend', ()=>{ composing=false; onInput(); });
  input.addEventListener('copy', stripOnCopy);
  input.addEventListener('cut', stripOnCopy);
  input.addEventListener('paste', onPaste);
  input.addEventListener('scroll', syncScroll);

  stack.addEventListener('mousemove', onStackMove);
  stack.addEventListener('mouseleave', onStackLeave);

  hotspots.addEventListener('click', e=>{
    const hit=e.target.closest('.cbox-hit'); if(hit){ toggleCheckbox(+hit.dataset.i); }
  });

  gutter.addEventListener('click', onGutterClick);
  gutter.addEventListener('contextmenu', onGutterCtx);

  results.addEventListener('click', onResultsClick);

  $('ctx-swatches').addEventListener('click', e=>{
    const sw=e.target.closest('.sw'); if(!sw) return; applyLineColor(sw.dataset.c);
  });
  document.addEventListener('click', e=>{ if(!ctxmenu.contains(e.target)) closeCtxMenu(); });
  document.addEventListener('contextmenu', e=>{ if(!e.target.closest('#gutter')&&!ctxmenu.contains(e.target)) closeCtxMenu(); });

  $('tag-add').addEventListener('click', addTag);
  $('tag-name').addEventListener('keydown', e=>{ if(e.key==='Enter') addTag(); });
  $('tag-list').addEventListener('click', e=>{
    const del=e.target.closest('.del'); if(!del) return;
    state.tags.splice(+del.dataset.i,1); renderTags(); render(); scheduleSave();
  });

  $('toggle-sidebar').addEventListener('click', ()=>$('sidebar').classList.toggle('collapsed'));

  window.addEventListener('resize', ()=>{ measureChar(); render(); });

  // keep gutter/results scrolled with editor vertical scroll is automatic (flex children)
}

document.addEventListener('DOMContentLoaded', boot);

/* expose a tiny hook for automated testing */
window.__calcuta={analyze, fmt, plain, parseNum, regroupText, evaluate, tokenizeMath};

})();
</script>
</body>
</html>
