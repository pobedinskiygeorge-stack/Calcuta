    if(dm){ out+=dm[0]; i+=dm[0].length; prevChar=dm[0].slice(-1); continue; }
    const ch=text[i];
    if(/\d/.test(ch)){
      if(/[\p{L}_]/u.test(prevChar)){ // part of identifier -> passthrough alnum run
        IDENT_AT_RE.lastIndex=i;
        const wm=IDENT_AT_RE.exec(text); out+=wm[0]; i+=wm[0].length; prevChar=wm[0].slice(-1); continue;
      }
      MASK_NUM_AT_RE.lastIndex=i;
      const nm=MASK_NUM_AT_RE.exec(text);
      let tok=nm[0];
      let suffix=''; if(/[kKM]$/.test(tok)){ suffix=tok.slice(-1); tok=tok.slice(0,-1); }
      const hadDot=/\./.test(tok);
      let [ip,fp]=tok.replace(GROUP_RE,'').split(/[.,]/);
      ip=groupDigits(ip);
      // a dot decimal becomes a comma, unless the caret is still inside this
      // token (so a date like 12.05 can be finished before it flips to 12,05)
      const underCaret = caret>=i && caret<=i+nm[0].length;
      const sep = (hadDot && underCaret) ? '.' : ',';
      out+= ip + (fp!==undefined? (sep+fp):'') + suffix;
      i+=nm[0].length; prevChar=nm[0].slice(-1); continue;
    }
    out+=ch; i++; prevChar=ch;
  }
  return out;
}

/* Nothing but the digit grouping is ever inserted: operators and the "()"
   round marker stay exactly as typed. Older builds padded both with U+00A0,
   and that padding lives on in saved text. dropPadding() removes it - every
   U+00A0 touching an operator or "()" - and turns any other U+00A0 (a no-
   break space typed with Option+Space, or pasted) into a plain space, so the
   text holds no invisible characters a Backspace could stumble over. */
const PAD_RE=new RegExp(OSP+'+(?=[-+*/^=]|\\(\\))|(?<=[-+*/^=]|\\(\\))'+OSP+'+','g');
function dropPadding(s){ return s.indexOf(OSP)<0 ? s : s.replace(PAD_RE,'').replace(/\u00a0/g,' '); }

/* Full format pass: group numbers, dot→comma, then drop old padding. Grouping
   (NBSP) is formatter whitespace, so the
   caret is preserved by counting the core (non-formatter) characters. */
function formatAll(text, caret){ return dropPadding(regroupText(text, caret)); }

/* Apply masking to the textarea, preserving caret by counting core chars. */
function applyMask(){
  const val=input.value;
  const caret=input.selectionStart;
  let coreBefore=countNonSep(val, caret);
  // legacy padding dropped before the caret no longer counts towards its spot
  if(val.indexOf(OSP)>=0){ PAD_RE.lastIndex=0; let m; while((m=PAD_RE.exec(val))) coreBefore-=Math.max(0, Math.min(caret, m.index+m[0].length)-m.index); }
  const masked=formatAll(val, caret);
  if(masked===val) return;
  const newCaret=posAfterNonSep(masked, coreBefore);
  input.value=masked;
  input.setSelectionRange(newCaret,newCaret);
}
/* On blur, flip any lingering dot decimals to comma (canonical form). */
function canonicalizeNumbers(){
  const masked=formatAll(input.value, -1);
  if(masked!==input.value){ const c=input.selectionStart; input.value=masked; input.setSelectionRange(c,c); render(); scheduleSave(); }
}
function countNonSep(s, upto){ let c=0; for(let k=0;k<upto;k++) if(isCore(s[k])) c++; return c; }
function posAfterNonSep(s, count){ let c=0,k=0; for(;k<s.length;k++){ if(c===count) return k; if(isCore(s[k])) c++; } return s.length; }

/* ---------- render pipeline ---------- */
function render(){
  const text=input.value;
  // a "()" autoPair just inserted, caret still inside: a pair being typed, not a round marker
  let pairAt=-1;
  if(pairPending){
    const c=input.selectionStart;
    if(document.activeElement===input && c===input.selectionEnd && text[c-1]==='(' && text[c]===')') pairAt=c-1;
    else pairPending=false;
  }
  const A=analyze(text, pairAt);
  model={data:A, meta:[]};
  hidePillHover();   // stale pixel geometry from before this render is worthless; next mousemove re-shows it correctly

  const n=A.lines.length;

  // 1) Build and paint the highlight layer FIRST. Its real wrapped height per
  //    line is the source of truth: a char-count prediction (ceil(len/cpl))
  //    can't match the browser once the text contains no-break spaces —
  //    grouped numbers ("1 800") and padded operators ("euro * наценка") —
  //    which stop word-break:break-all from packing rows uniformly, so long
  //    lines wrap into more rows than predicted and every column below drifts.
  // a "/тег" or "/13.05" trigger inside a note must not activate anything
  const textCode=text.split('\n').map(stripLineComment).join('\n');
  const activeTags=activeSpotlightTags(textCode, store.tags);
  const activeDates=activeSpotlightDates(textCode);
  // First pass: build each line's HTML and its tint list. We collect the tint
  // "signature" per line so a second pass can merge vertically-adjacent rows
  // that share the exact same tint into one continuous rounded block (no concave
  // notch between two same-colored lines).
  const builtRows=new Array(n), tintRows=new Array(n), sigRows=new Array(n);
  for(let k=0;k<n;k++){
    const lineSec=A.lines[k].section;
    const built=buildLineHTML(A.lines[k], A.varsBySection[lineSec]||EMPTY_VARS, A.varDefLineBySection[lineSec]||EMPTY_OBJ, store.tags, activeTags, activeDates);
    model.meta[k]=built.cmeta;
    const tints=[];
    if(built.spotlightColor) tints.push('inset 0 0 0 999px '+hexToRgba(built.spotlightColor, TAG_SPOTLIGHT_ALPHA));
    else if(built.dateSpotlight) tints.push('inset 0 0 0 999px var(--date-spot)');
    builtRows[k]=built; tintRows[k]=tints;
    sigRows[k]=tints.join('|');
  }
  // Reconcile the highlight layer: write only the lines whose rendered form
  // changed. `dirty` collects those indices — they're the only ones whose
  // wrapped height can have moved, so they're the only ones re-measured below.
  const hlCls=new Array(n), hlStyle=new Array(n), hlSig=new Array(n);
  for(let k=0;k<n;k++){
    const built=builtRows[k], tints=tintRows[k], sig=sigRows[k];
    const styles=[];
    if(tints.length) styles.push('box-shadow:'+tints.join(','));
    if(sig){
      // round only the OUTER corners of a run of identically-tinted rows: an
      // interior edge shared with a same-color neighbour gets a square (0) corner
      // so the two rows fuse seamlessly instead of pinching inward.
      const top = (k>0 && sigRows[k-1]===sig) ? '0' : '9px';
      const bot = (k<n-1 && sigRows[k+1]===sig) ? '0' : '9px';
      if(top!=='9px' || bot!=='9px') styles.push('border-radius:'+top+' '+top+' '+bot+' '+bot);
    }
    hlCls[k]='hl-line'+(built.checked?' checked':'')+(built.superRow?' superrow':'');
    hlStyle[k]=styles.join(';');
    hlSig[k]=hlCls[k]+'\u0001'+hlStyle[k]+'\u0001'+built.html;
  }
  const hlEls=highlight.children;
  while(hlEls.length>n) highlight.removeChild(highlight.lastChild);
  const dirty=[];
  for(let k=0;k<n;k++){
    if(k<hlEls.length){
      if(prevHlSig[k]===hlSig[k]) continue;
      const el=hlEls[k];
      // className/setAttribute (not style.cssText) so the serialized markup is
      // byte-identical to what the old innerHTML string produced.
      if(el.className!==hlCls[k]) el.className=hlCls[k];
      if(hlStyle[k]) el.setAttribute('style', hlStyle[k]); else el.removeAttribute('style');
      el.innerHTML=builtRows[k].html;
    }else{
      const el=document.createElement('div');
      el.className=hlCls[k];
      el.setAttribute('data-i', k);
      if(hlStyle[k]) el.setAttribute('style', hlStyle[k]);
      el.innerHTML=builtRows[k].html;
      highlight.appendChild(el);
    }
    dirty.push(k);
  }
  prevHlSig=hlSig;

  // 2) Measure the row span of every line whose content changed (one batched
  //    reflow), then recompute the cumulative offsets arithmetically. Every
  //    visual row is exactly LH tall (line-height:LH), so offsetHeight/LH is
  //    the true row count. Untouched lines keep the height measured earlier —
  //    a line's wrap depends on its own text and the container width, and the
  //    latter bumps layoutEpoch when it changes.
  const remeasureAll = (layoutEpoch!==measuredEpoch) || lineRowCount.length!==n;
  const oldRowCount = lineRowCount;
  lineRowTop=new Array(n); lineRowCount=new Array(n);
  if(remeasureAll){
    for(let k=0;k<n;k++){
      const el=hlEls[k];
      lineRowCount[k]= el ? Math.max(1, Math.round(el.offsetHeight/LH)) : 1;
    }
    measuredEpoch=layoutEpoch;
  }else{
    for(let k=0;k<n;k++) lineRowCount[k]=oldRowCount[k];
    for(let d=0;d<dirty.length;d++){
      const k=dirty[d], el=hlEls[k];
      lineRowCount[k]= el ? Math.max(1, Math.round(el.offsetHeight/LH)) : 1;
    }
  }
  let acc=0;
  for(let k=0;k<n;k++){ lineRowTop[k]=acc; acc+=lineRowCount[k]; }

  // 3) Checkbox hotspots and results column — sized/positioned from the
  //    measured rows so every column lines up with the wrapped text.
  let hs='';
  const resSig=new Array(n);
  const newResultVals={};
  let wantsFx=false;   // does anything on screen actually need a currency rate?
  for(let k=0;k<n;k++){
    const it=A.lines[k];
    const h=lineRowCount[k]*LH;
    let rs='';
    if(it.cls.kind==='checkbox'){
      const top=lineRowTop[k]*LH + 14;            // cumulative row offset + padY (always row 0 of its line)
      const left=(it.cls.indent||0)*charW + 16;   // + padX
      hs+='<div class="cbox-hit" data-i="'+k+'" style="top:'+top+'px;left:'+left+'px"></div>';
    }
    if(it.rateCmd){
      // currency slash-command pill: "1 $ = 78,4 \u20bd" (or "\u2026" while the rate loads)
      wantsFx=true;
      const rc=it.rateCmd, per=fxRates[rc.code], ready=per>0;
      const disp = ready ? ('1 '+rc.sym+' = '+fmt(per)+' \u20bd') : '\u2026';
      const anim = resultsPainted && prevResultVals[k]!==undefined && prevResultVals[k]!==disp ? ' changed' : '';
      newResultVals[k]=disp;
      rs+='<div class="result-line" data-i="'+k+'" style="height:'+h+'px">'
        +'<span class="pill cur'+anim+'">'+esc(disp)+'</span></div>';
    }else if(it.result!==null || it.error){
      const disp = it.error ? '\u2047' : fmt(it.result);   // U+2047 = "??" glyph
      // fade a pill only when its shown value actually changed at this row
      // (nice while typing); never on the very first paint of the document.
      const anim = resultsPainted && prevResultVals[k]!==undefined && prevResultVals[k]!==disp ? ' changed' : '';
      newResultVals[k]=disp;
      if(it.error){
        rs+='<div class="result-line err" data-i="'+k+'" style="height:'+h+'px">'
          +'<span class="pill err'+anim+'">'+disp+'</span></div>';
      }else{
        rs+='<div class="result-line has" data-i="'+k+'" data-v="'+esc(plain(it.result))+'" style="height:'+h+'px">'
          +'<span class="pill'+anim+'">'+esc(disp)+'</span></div>';
      }
    }else{
      rs+='<div class="result-line" data-i="'+k+'" style="height:'+h+'px"></div>';
    }
    resSig[k]=rs;
  }
  prevResultVals=newResultVals; resultsPainted=true;
  // Hotspots are sparse (checkbox lines only), so a single string compare is
  // enough to skip the rebuild entirely on the overwhelming majority of edits.
  if(hs!==prevHsHTML){ hotspots.innerHTML=hs; prevHsHTML=hs; }

  renderRails(true);
  // Results: one node per line, replaced only where the rendered string moved.
  const resEls=results.children;
  while(resEls.length>n) results.removeChild(results.lastChild);
  for(let k=0;k<n;k++){
    if(k<resEls.length){
      if(prevResSig[k]===resSig[k]) continue;
      resEls[k].outerHTML=resSig[k];
    }else{
      results.insertAdjacentHTML('beforeend', resSig[k]);
    }
  }
  prevResSig=resSig;
  maybeRefreshFx(wantsFx);   // network only when a rate is on screen and stale

  // NOTE: syncScroll() is deliberately NOT called here. It reads
  // input.scrollLeft, and a read right after the four innerHTML writes above
  // forces a full synchronous layout of the whole freshly-rebuilt document —
  // it measured at ~15% of the cost of every keystroke. The stray scrollLeft
  // it corrects can only appear from an actual scroll or a resize, so it is
  // now driven by those events alone (see the 'scroll' and 'resize' listeners).
  if(searchQuery){ computeMatches(); renderSearch(); }
  renderSelection();   // re-place the rounded selection overlay after layout
  renderCaret();        // re-place the empty-line ghost
  updateBracketMatch(); // re-check the caret against the freshly rebuilt bracket map
}

/* ---------- persistence ---------- */
/* Write to localStorage only, without bumping `updated` — used at boot so
   merely loading the app (or seeding the stock docs on a device that has
   never saved anything locally) never looks "newer" than a real cloud save.
   Only an actual edit should move `updated` forward. */
/* ---- Lamport-style logical clock for sync ordering ----
   The per-document/tag `updated` field orders the merge. Using raw wall-clock
   Date.now() is DEFEATED BY CLIENT CLOCK SKEW: a device whose clock runs ahead
   (e.g. a work PC set wrong) stamps a HIGHER number than a later edit made on a
   correctly-set device, so the older content wins the merge and can even
   overwrite the server. A logical clock fixes this: it advances past every
   timestamp we OBSERVE (local or remote), so any edit made after seeing
   another device's version always gets a strictly higher number — causality is
   respected regardless of wall-clock differences. stamp() also stays close to
   real time (max with Date.now()) so timestamps remain human-meaningful. */
let _clock = 0;
function observeTime(t){ if(typeof t==='number' && isFinite(t) && t>_clock) _clock=t; }
function stamp(){ _clock = Math.max(_clock+1, Date.now()); return _clock; }
/* Advance the clock past everything already in a store (called on load and for
   every remote snapshot) so the next local stamp() beats all of it. */
function observeStore(s){
  if(!s) return;
  (s.docs||[]).forEach(d=>observeTime(d && d.updated));
  (s.tags||[]).forEach(t=>observeTime(t && t.updated));
  observeTime(s.tagsUpdated);
  const scan=m=>{ if(m&&typeof m==='object') for(const k in m) observeTime(m[k]); };
  scan(s.deletedDocs); scan(s.deletedTags);
}
/* ---- sync bases ----
   For every document, the last version of it this device saw ON THE SERVER
   (its text, name and stamp). It is the common ancestor for a three-way
   merge: comparing the local copy and the server copy against it tells
   which side actually changed what — so an edit made on a device that was
   asleep, offline or switched off is merged with newer edits from other
   devices instead of one of them being thrown away by timestamp. Saved in
   the same localStorage blob as the store (key "_bases"), so the two can
   never be read out of step with each other. */
let docBases={}, docBasesUid=null;   // bases belong to one account's cloud copy
/* No session has ever existed on this device and it holds no bases: its
   documents share no history with the account's (see unionDoc). */
let neverSynced=false;
/* test hook (tests/devicesim.js): a timeline of sync events, never set in the app */
function syncTrace(ev, data){ if(window.__calcutaSyncLog) try{ window.__calcutaSyncLog(ev, data); }catch(e){} }
/* The raw blob this tab last wrote or read. If localStorage holds anything
   else, another tab of the app has saved since: merge that in before
   writing, or the stale tab's write would erase the other tab's edits. */
let lastLocalRaw=null;
function saveLocal(){
  if(sharedMode) return;   // see persist()
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw!==null && lastLocalRaw!==null && raw!==lastLocalRaw){ lastLocalRaw=raw; integrateLocal(raw); }
    const out=JSON.stringify(Object.assign({}, store, {_bases:docBases, _basesUid:docBasesUid}));
    try{ localStorage.setItem(STORE_KEY, out); lastLocalRaw=out; }
    catch(e){
      // over the quota with the bases (they roughly double the blob): the
      // documents themselves must still be saved — drop the bases (the next
      // sync of a doc falls back to last-writer-wins) rather than everything
      const lean=JSON.stringify(Object.assign({}, store, {_bases:{}, _basesUid:docBasesUid}));
      localStorage.setItem(STORE_KEY, lean); lastLocalRaw=lean;
    }
  }catch(e){}
}
function persist(){
  // A shared-link preview shows SOMEONE ELSE'S text in the editor; the store
  // still holds the user's own docs. Saving here wrote that text into the
  // user's open document (on hide, close, blur) — and the next normal launch
  // uploaded it to every device as the newest version.
  if(sharedMode) return;
  // Only move a doc's `updated` forward when its TEXT actually changed — so
  // navigation (switch/create/delete all call persist()) can't spuriously
  // bump an untouched doc and let its stale copy out-compete a newer edit made
  // to the same doc on another device. Real edits already bumped `updated` in
  // onChange(); by the time this debounced save runs, text===value → no re-bump.
  const d=doc(); if(d && d.text!==input.value){ window.__calcutaSyncLog && syncTrace('persist', {id:d.id, from:d.text, to:input.value}); d.text=input.value; d.updated=stamp(); }
  store.updated=Date.now();
  saveLocal();
  cloudSave();
}
let saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(persist,300);
}

/* ---- markup v2: "#" is a heading, "//" a note ----
   Until v2 the two markers had the opposite roles ("//" heading, "#" note).
   A doc saved before the swap carries no `markup` field: its markers are
   rewritten ONCE and the doc is stamped, so the conversion can never run a
   second time (a second pass would swap everything straight back). Every doc
   this build creates is stamped at birth. Like snapStoreColors, the rewrite
   is deterministic and leaves `updated` alone, so each device converges on
   the identical text by itself; it runs on load and on every remote
   snapshot, so a legacy copy still arriving from a device on an older cached
   build is converted on receipt. The stamp travels inside the doc object,
   which every sync path (merge, adopt, cloud JSON) carries whole. */
const MARKUP_V=3;
/* v3: a short-lived build had Ctrl+B wrap text in "**…**". That feature is
   gone, so the markers it left behind are removed once ("**слово**" ->
   "слово", an empty "****" -> ""), keeping the text itself. */
const LEGACY_BOLD_RE=/\*\*(?!\s)(.*?)(?<!\s)\*\*/g;
function stripLegacyBold(text){ return text.indexOf('**')<0 ? text : text.replace(LEGACY_BOLD_RE, '$1'); }
/* Bring text saved at markup version `from` up to the current one, step by step. */
function upgradeMarkup(text, from){
  if(from<2) text=convertLegacyMarkup(text);
  if(from===2) text=stripLegacyBold(text);   // only v2 text can carry Ctrl+B markers; older "**" was typed by hand
  return text;
}
/* The pre-v2 inline-comment rule, verbatim, but for "#": only needed to find
   legacy tails ("x = 100 #note") so they can become "//" notes. */
function legacyCommentStart(s){
  if(s.indexOf('#')===-1) return -1;
  const urls=urlRanges(s);
  const quotes=[]; const qre=/"[^"\n]*"/g; let qm;
  while((qm=qre.exec(s))) quotes.push([qm.index, qm.index+qm[0].length]);
  for(let i=0;i<s.length;i++){
    if(s[i]!=='#') continue;
    if(i>0 && !/[ \t\u00a0\u202f]/.test(s[i-1])) continue;
    if(urls.some(r=>i>=r.start&&i<r.end)) continue;
    if(quotes.some(([a,b])=>i>a&&i<b)) continue;
    return i;
  }
  return -1;
}
function convertLegacyMarkup(text){
  return text.split('\n').map(line=>{
    let m;
    if(!CB_RE.test(line)){   // a checkbox outranked both markers, as it still does
      if((m=/^(\s*)\/\/(.*)$/.exec(line))) return m[1]+'#'+m[2];   // old heading
      if((m=/^(\s*)#(.*)$/.exec(line)))     return m[1]+'//'+m[2];  // old comment line
    }
    const cs=legacyCommentStart(line);                                // old inline tail
    return cs<0 ? line : line.slice(0,cs)+'//'+line.slice(cs+1);
  }).join('\n');
}
function migrateDocMarkup(d){
  if(!d || (d.markup|0)>=MARKUP_V) return;
  if(typeof d.text==='string') d.text=upgradeMarkup(d.text, d.markup|0);
  d.markup=MARKUP_V;
}
/* Every stored or incoming doc passes through here (load + each remote
   snapshot). All steps are idempotent and leave `updated` alone. */
function normalizeStoreDocs(s){
  ((s&&s.docs)||[]).forEach(d=>{
    if(!d) return;
    migrateDocMarkup(d);
    // operators are no longer padded: drop old OSP padding
    if(typeof d.text==='string') d.text=dropPadding(d.text);
    // line numbers (and the per-line colours assigned through them) are gone
    delete d.lineColors;
    // a "#" heading always has a space before its title
    if(typeof d.text==='string') d.text=d.text.replace(/^([ \t]*)#(?=\S)/gm, '$1# ');
  });
}

/* Stock docs use FIXED ids keyed to their role (not a random uid) so that the
   "Задачи"/"Личное" doc seeded independently on two devices is recognized as
   the SAME document by the per-id merge and reconciled — instead of both
   copies surviving as duplicates. They're also seeded with updated:0 so a REAL
   copy of the same doc from the cloud (any timestamp > 0) always wins the
   merge — a freshly-seeded device can never clobber real data. */
const TASKS_ID='stock-tasks', PERSONAL_ID='stock-personal';
function makeTasksDoc(){
  return { id:TASKS_ID, name:'Задачи', protected:'tasks', text:DEFAULT_DOC, updated:0, markup:MARKUP_V };
}
function makePersonalDoc(){
  return { id:PERSONAL_ID, name:'Личное', protected:'personal', text:'', updated:0, markup:MARKUP_V };
}
/* Force any protected doc onto its canonical id, so stock docs that were
   created before fixed ids existed (random uid) still merge as one across
   devices. Returns the id it should be keyed under. */
function canonicalDocId(d){
  if(d.protected==='tasks') return TASKS_ID;
  if(d.protected==='personal') return PERSONAL_ID;
  return d.id;
}
function load(){
  let s=null;
  try{ lastLocalRaw=localStorage.getItem(STORE_KEY); s=JSON.parse(lastLocalRaw||'null'); }catch(e){}
  if(s && Array.isArray(s.docs)){
    docBases=(s._bases && typeof s._bases==='object') ? s._bases : {};
    docBasesUid=(typeof s._basesUid==='string') ? s._basesUid : null;
    delete s._bases; delete s._basesUid;
    store=s;
  }else{
    // migrate from v1 single-document format, or start fresh
    let old=null; try{ old=JSON.parse(localStorage.getItem('calcuta.v1')||'null'); }catch(e){}
    store={ docs:[], activeId:null, tags:(old&&old.tags)||[] };
    if(old && old.text) store.docs.push({id:uid(), name:'Черновик', text:old.text});
  }
  // schema normalization / migration for the merge-based sync fields
  store.docs.forEach(d=>{
    if(!d.id) d.id=uid();
    // only "tasks"/"personal" are real pinned roles — clear any stray value so
    // no extra document shows up pinned/undeletable.
    if(d.protected && d.protected!=='tasks' && d.protected!=='personal') delete d.protected;
    // Legacy docs from before stock pages got a `protected` flag / fixed id
    // are recognized only by their exact reserved name. Without this they
    // survive as a second, unpinned "Задачи"/"Личное" alongside the real
    // pinned one instead of being folded into it.
    if(!d.protected && d.name==='Задачи') d.protected='tasks';
    if(!d.protected && d.name==='Личное') d.protected='personal';
    const cid=canonicalDocId(d);
    if(cid!==d.id){ if(store.activeId===d.id) store.activeId=cid; d.id=cid; }   // pin protected docs to their fixed id
    // pre-sync docs had no per-doc timestamp: seed from the store-level one
    // (a real prior save time) so they read as real data, not stock.
    if(typeof d.updated!=='number') d.updated = (typeof store.updated==='number' ? store.updated : 0);
  });
  // Collapse duplicate docs sharing an id (a device that seeded a stock doc
  // under a random uid before fixed ids existed could otherwise leave two
  // pinned "Задачи"/"Личное" entries). Keep the newer / longer copy.
  {
    const byId=new Map(), order=[];
    for(const d of store.docs){
      const ex=byId.get(d.id);
      if(!ex){ byId.set(d.id,d); order.push(d.id); }
      else if((d.updated||0)>(ex.updated||0) ||
              ((d.updated||0)===(ex.updated||0) && (d.text||'').length>(ex.text||'').length)) byId.set(d.id,d);
    }
    store.docs=order.map(id=>byId.get(id));
  }
  if(!store.tags) store.tags=[];
  if(typeof store.tagsUpdated!=='number') store.tagsUpdated=0;
  if(!store.deletedDocs || typeof store.deletedDocs!=='object') store.deletedDocs={};
  if(!store.deletedTags || typeof store.deletedTags!=='object') store.deletedTags={};
  if(!Array.isArray(store.pinned)) store.pinned=[];
  // give every tag a per-tag timestamp (older stores had none) so tags merge
  // per-item across devices instead of whole-list last-write-wins.
  store.tags.forEach(t=>{ if(typeof t.updated!=='number') t.updated = store.tagsUpdated||1; });
  // collapse duplicate tags by lowercased label, keeping the newest
  {
    const seen=new Map();
    for(const t of store.tags){
      const k=(t.label||'').toLowerCase();
      const ex=seen.get(k);
      if(!ex || (t.updated||0)>=(ex.updated||0)) seen.set(k,t);
    }
    store.tags=Array.from(seen.values());
  }
  // legacy tag/line colours: pull anything picked before the palette closed
  // back onto a base colour (idempotent, see snapStoreColors)
  snapStoreColors(store);
  // pre-v2 docs: "//" headings / "#" comments become "#" / "//" (once, stamped)
  normalizeStoreDocs(store);
  // ensure the stock, undeletable documents exist (pinned to top, in order)
  if(!store.docs.some(d=>d.protected==='tasks')){
    const tasks=makeTasksDoc();
    store.docs.unshift(tasks);
    if(!store.activeId) store.activeId=tasks.id;
  }
  if(!store.docs.some(d=>d.protected==='personal')){
    const idx=store.docs.findIndex(d=>d.protected==='tasks');
    store.docs.splice(idx+1, 0, makePersonalDoc());
  }
  if(!store.docs.some(d=>d.id===store.activeId)) store.activeId=store.docs[0].id;

  neverSynced=!docBasesUid && !Object.keys(docBases).length && !wasSignedIn();
  observeStore(store);   // seed the logical clock past everything already stored
  window.__calcutaSyncLog && syncTrace('load', {store:store.docs.map(d=>[d.id,d.text,d.updated]), bases:docBases});

  applyResultsWidth(store.resultsWidth);
  loadActiveIntoEditor();
  renderTags();
  renderDocs();
  saveLocal();
}

/* Load the active document's text into the editor. */
function loadActiveIntoEditor(){
  const d=doc();
  useHistoryFor(d.id);   // Ctrl+Z only ever walks this document's own history
  input.value=d.text||'';
  autoIndent();
  applyMask();
  // Formatting (auto-indent / number masking) may canonicalize the text right
  // here. Write it back WITHOUT bumping `updated`: formatting is not an edit.
  // The debounced persist() used to see the diff and stamp Date.now() — which
  // made a freshly-seeded device's STOCK "Задачи" look newer than the user's
  // real cloud copy and silently clobber it on every new device / cleared
  // browser. That was the "documents don't sync between devices" failure.
  if(d && d.text!==input.value) d.text=input.value;
  render();
  renderDocs();
}

/* ---------- document management ---------- */
function switchDoc(id){
  closeMenus();
  if(id===store.activeId) return;
  persist();                 // save current doc's text first
  store.activeId=id;
  loadActiveIntoEditor();
  persist();
}
function createDoc(){
  persist();
  const n=store.docs.length+1;
  const d={ id:uid(), name:'Документ '+n, text:'', updated:stamp(), markup:MARKUP_V };
  store.docs.push(d);
  store.activeId=d.id;
  loadActiveIntoEditor();
  persist();
  closeMenus();
}
/* Ask for confirmation before deleting (protected docs can't be deleted). */
function requestDeleteDoc(id){
  const d=store.docs.find(x=>x.id===id);
  if(!d || d.protected) return;
  askConfirm('Удалить документ «'+(d.name||'Без названия')+'»? Это действие необратимо.',
             ()=>deleteDoc(id));
}
function deleteDoc(id){
  const idx=store.docs.findIndex(d=>d.id===id);
  if(idx<0 || store.docs[idx].protected) return;
  const wasActive=(store.activeId===id);
  store.docs.splice(idx,1);
  // tombstone so the deletion propagates to other devices instead of the doc
  // being resurrected by the next merge from a device that still has it.
  store.deletedDocs[id]=stamp();
  if(wasActive){ store.activeId=store.docs[Math.max(0,idx-1)].id; loadActiveIntoEditor(); }
  else renderDocs();
  persist();
}
/* Inline rename of a document row (invoked from the context menu). */
function beginRename(id, nameEl){
  const d=store.docs.find(x=>x.id===id);
  if(!d || d.protected || !nameEl) return;
  const inp=document.createElement('input');
  inp.className='doc-name-input'; inp.value=d.name||''; inp.maxLength=60; inp.spellcheck=false;
  nameEl.replaceWith(inp);
  inp.focus(); inp.select();
  let done=false;
  const commit=()=>{ if(done) return; done=true; const cur=store.docs.find(x=>x.id===id); if(cur){ cur.name=(inp.value.trim()||'Без названия'); cur.updated=stamp(); } renderDocs(); scheduleSave(); };
  const cancel=()=>{ if(done) return; done=true; renderDocs(); };
  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); commit(); }
    else if(e.key==='Escape'){ e.preventDefault(); cancel(); }
    e.stopPropagation();
  });
  inp.addEventListener('blur', commit);
  inp.addEventListener('click', e=>e.stopPropagation());
  inp.addEventListener('dblclick', e=>e.stopPropagation());
}
/* Rename the ACTIVE unpinned doc right on its top-bar pill (#doc-find-btn).
   The button isn't replaced (renderDocs updates it by id and would lose it) —
   the input is inserted beside it and the button is hidden, then restored. */
function beginRenamePill(id){
  const d=store.docs.find(x=>x.id===id);
  if(!d || d.protected) return;
  const fb=$('doc-find-btn'); if(!fb) return;
  const inp=document.createElement('input');
  inp.className='doc-name-input'; inp.value=d.name||''; inp.maxLength=60; inp.spellcheck=false;
  fb.style.display='none';
  fb.parentNode.insertBefore(inp, fb);
  inp.focus(); inp.select();
  let done=false;
  const restore=()=>{ if(inp.parentNode) inp.remove(); fb.style.display=''; };
  const commit=()=>{ if(done) return; done=true; d.name=(inp.value.trim()||'Без названия'); d.updated=stamp(); restore(); renderDocs(); scheduleSave(); };
  const cancel=()=>{ if(done) return; done=true; restore(); renderDocs(); };
  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); commit(); }
    else if(e.key==='Escape'){ e.preventDefault(); cancel(); }
    e.stopPropagation();
  });
  inp.addEventListener('blur', commit);
  inp.addEventListener('click', e=>e.stopPropagation());
}
/* Pinned user docs (max 2, device-local): sanitize against deleted ids. */
function pinnedIds(){
  store.pinned=(store.pinned||[]).filter(id=>store.docs.some(d=>d.id===id && !d.protected)).slice(0,2);
  return store.pinned;
}
function togglePin(id){
  pinnedIds();
  const i=store.pinned.indexOf(id);
  if(i>=0) store.pinned.splice(i,1);
  else{
    if(store.pinned.length>=2){ showToast('Можно закрепить не более двух документов'); return; }
    store.pinned.push(id);
  }
  renderDocs(); if(docFindOpen()) renderDocFind(); scheduleSave();
}

/* Update the top-bar doc UI: pinned button states, the third slot's label
   (open non-pinned doc's name, or a dim placeholder), and the open list. */
function renderDocs(){
  const d=doc();
  const tt=$('tab-tasks'), tp=$('tab-personal'), fb=$('doc-find-btn'), pt=$('pinned-tabs');
  if(tt) tt.classList.toggle('active', !!d && d.protected==='tasks');
  if(tp) tp.classList.toggle('active', !!d && d.protected==='personal');
  if(pt){
    pt.innerHTML=pinnedIds().map(id=>{
      const p=store.docs.find(v=>v.id===id);
      const act=(d && d.id===id)?' active':'';
      return '<button class="doc-tab pinned'+act+'" data-id="'+id+'" type="button">'+esc(p.name||'Без названия')+'</button>';
    }).join('');
  }
  if(fb){
    // pinned docs have their own tab - the third slot only names an
    // UNPINNED user doc, otherwise it's the dim manager placeholder
    const other=(d && !d.protected && !store.pinned.includes(d.id)) ? d : null;
    fb.textContent=other ? (other.name||'Без названия') : 'документы';
    fb.classList.toggle('active', !!other);
    fb.classList.toggle('placeholder', !other);
  }
  if(docFindOpen()) renderDocFind();
}

/* ---------- the doc-name popover: the whole document manager ----------
   Opens from the third top-bar slot (the open doc's name / "документы").
   Lists ALL documents (filtered by name/content while typing); click opens,
   right-click / long-press renames or deletes (stock pages have neither). */
let docFindQuery='';
function docFindOpen(){ const m=$('docfind-menu'); return m && !m.hidden; }
function renderDocFind(){
  const list=$('docfind-list'); if(!list) return;
  const q=docFindQuery.trim().toLowerCase();
  pinnedIds();
  const items=store.docs.filter(d=>{
    if(d.protected || store.pinned.includes(d.id)) return false;   // already in the tabs
    if(!q) return true;
    if((d.name||'').toLowerCase().includes(q)) return true;
    return countMatches((d.id===store.activeId?input.value:(d.text||'')), q)>0;
  });
  if(!items.length){ list.innerHTML='<div class="docfind-empty">ничего не найдено</div>'; return; }
  list.innerHTML=items.map(d=>{
    const active=d.id===store.activeId?' active':'';
    const cnt=q ? countMatches((d.id===store.activeId?input.value:(d.text||'')), q) : 0;
    const badge=cnt>0 ? '<span class="doc-badge">'+cnt+'</span>' : '';
    // Rename/delete moved to a context menu (right-click / long-press); rows no
    // longer carry an inline × button.
    return '<div class="doc-item'+active+(d.protected?' protected':'')+'" data-id="'+d.id+'">'
      +'<span class="doc-name">'+esc(d.name||'Без названия')+'</span>'+badge+'</div>';
  }).join('');
}

/* ---------- custom confirmation dialog (works inside sandboxed iframes) ---------- */
let confirmCb=null;
function askConfirm(msg, onOk){
  confirmCb=onOk;
  $('confirm-msg').textContent=msg;
  $('confirm-overlay').classList.add('open');
  $('confirm-ok').focus();
}
function closeConfirm(run){
  $('confirm-overlay').classList.remove('open');
  const cb=confirmCb; confirmCb=null;
  if(run && cb) cb();
}

/* ================================================================
   [SEARCH] — highlight matches in the active doc (yellow), count them,
   navigate with arrows, and show per-document match counts.
   ================================================================ */
let searchQuery='';
let searchMatches=[];   // [{line,col,len}] in the active document
let searchIdx=-1;

function countMatches(text, qLower){
  if(!qLower) return 0;
  let n=0,i=0; const hay=text.toLowerCase();
  while((i=hay.indexOf(qLower,i))!==-1){ n++; i+=qLower.length; }
  return n;
}

function computeMatches(){
  searchMatches=[];
  const q=searchQuery;
  if(!q){ searchIdx=-1; return; }
  // Digit grouping is display-only: "1000" must find "1 000", and so must
  // "1 000" typed with an ordinary space. Both sides are compared without it,
  // and each hit is mapped back to its span in the real line.
  const ql=q.toLowerCase().replace(/(\d)[ \u00a0\u202f](?=\d)/g,'$1');
  if(!ql){ searchIdx=-1; return; }
  const lines=docLines();
  lines.forEach((line,li)=>{
    const map=[]; let hay='';
    for(let k=0;k<line.length;k++){ if(isFmtWS(line[k])) continue; map.push(k); hay+=line[k].toLowerCase(); }
    let c=0;
    while((c=hay.indexOf(ql,c))!==-1){
      const from=map[c], to=map[c+ql.length-1]+1;
      searchMatches.push({line:li,col:from,len:to-from}); c+=ql.length;
    }
  });
  if(searchMatches.length===0) searchIdx=-1;
  else if(searchIdx<0||searchIdx>=searchMatches.length) searchIdx=0;
}

/* Stack-relative rects of a {line,col,len} match, measured from the rendered
   text so marks land exactly — even on wrapped lines, where a match can span
   two visual rows (one rect per fragment). */
function matchRects(m){
  const rects=charRangeRects(m.line, m.col, m.col+m.len);
  const sb=stack.getBoundingClientRect();
  return rects.map(r=>({top:r.top-sb.top+stack.scrollTop, left:r.left-sb.left+stack.scrollLeft, width:r.width, height:r.height}));
}
function renderSearch(){
  // marks
  if(!searchQuery){ searchlayer.innerHTML=''; }
  else{
    let html='';
    searchMatches.forEach((m,k)=>{
      const cls='search-mark'+(k===searchIdx?' active':'');
      for(const r of matchRects(m)){
        html+='<div class="'+cls+'" style="top:'+r.top+'px;left:'+r.left+'px;width:'+r.width+'px;height:'+r.height+'px"></div>';
      }
    });
    searchlayer.innerHTML=html;
    syncScroll();
  }
  // counter (Ctrl+F find bar)
  const label = !searchQuery ? '' : (searchMatches.length===0 ? 'нет совпадений' : (searchIdx+1)+' / '+searchMatches.length);
  $('find-count').textContent = label;
}

/* Draw the current text selection as rounded rectangles behind the text, so the
   selection looks oval like the line-number colour wash instead of the square
   native highlight (which we've made transparent). One rounded rect per visual
   row; a run of vertically-adjacent full-width rows fuses (square inner edges)
   into a single block so there's no concave notch between them. */
function renderSelection(){
  if(!sellayer) return;
  const s=input.selectionStart, e=input.selectionEnd;
  if(document.activeElement!==input || s==null || e==null || s===e){ sellayer.innerHTML=''; return; }
  const v=input.value, lines=v.split('\n');
  const starts=[]; let off=0;
  for(let i=0;i<lines.length;i++){ starts.push(off); off+=lines[i].length+1; }
  const locate=pos=>{ let line=0; while(line+1<starts.length && starts[line+1]<=pos) line++; return {line, col:pos-starts[line]}; };
  const a=locate(s), b=locate(e);
  const sb=stack.getBoundingClientRect();
  const sample=highlight.children[a.line]||highlight.children[0];
  if(!sample){ sellayer.innerHTML=''; return; }
  const sr=sample.getBoundingClientRect();
  const contentLeft=sr.left-sb.left+stack.scrollLeft;      // where text starts
  const contentRight=sr.right-sb.left+stack.scrollLeft;    // full text-column width

  // Collect the selection as spans per VISUAL row. For each logical line,
  // charRangeRects gives one rect per wrapped sub-row: the sub-rows that AREN'T
  // the line's last are soft-wrap continuations (text flows edge-to-edge there)
  // and fill to the right edge, while the LAST sub-row of every logical line hugs
  // its real content — so a hard line-break's empty tail is never painted as a
  // full-width strip. Fragments on one row (split by a coloured token) are merged.
  const rows=[];
  for(let line=a.line; line<=b.line; line++){
    const cs=(line===a.line)?a.col:0;
    const ce=(line===b.line)?b.col:lines[line].length;
    let rects=charRangeRects(line, cs, ce);
    if(!rects.length){                                     // empty line inside the selection
      const el=highlight.children[line];
      if(el){ const er=el.getBoundingClientRect(); rects=[{left:er.left, top:er.top, width:0, height:LH}]; }
    }
    const m=new Map();
    for(const r of rects){
      const top=r.top-sb.top+stack.scrollTop, left=r.left-sb.left+stack.scrollLeft;
      const key=Math.round(top), ex=m.get(key);
      if(ex){ ex.left=Math.min(ex.left,left); ex.right=Math.max(ex.right,left+r.width); }
      else m.set(key,{top, left, right:left+r.width, height:r.height});
    }
    const tops=[...m.keys()].sort((x,y)=>x-y);
    tops.forEach((t,idx)=>{
      const span=m.get(t);
      if(idx<tops.length-1) span.right=contentRight;   // soft-wrap continuation → fill to the edge
      rows.push(span);
    });
  }
  // Flush the very first row's left past a leading marker/indent (checkbox, //,
  // #, spaces) so a block that starts on such a line isn't stepped in on the left.
  const firstCls=classify(lines[a.line]);
  const firstLead=firstCls.markerLen || (lines[a.line].match(/^\s*/)[0].length);
  if(rows.length>1 && a.col<=firstLead) rows[0].left=contentLeft;

  // Per-CORNER rounding: a corner is square when the vertically-adjacent row
  // shares that same edge, so consecutive rows join with no concave notch — only
  // the true outer corners of the selection outline are rounded.
  const eq=(x,y)=>Math.abs(x-y)<=1;
  let html='';
  for(let i=0;i<rows.length;i++){
    const it=rows[i], prev=rows[i-1], next=rows[i+1];
    const up  = prev && Math.abs(prev.top+prev.height-it.top)<=1;
    const down= next && Math.abs(it.top+it.height-next.top)<=1;
    const tl=(up   && eq(prev.left, it.left))  ?0:7;
    const tr=(up   && eq(prev.right,it.right)) ?0:7;
    const br=(down && eq(next.right,it.right)) ?0:7;
    const bl=(down && eq(next.left, it.left))  ?0:7;
    html+='<div class="sel-rect" style="top:'+Math.round(it.top)+'px;left:'+Math.round(it.left)
      +'px;width:'+Math.max(2,Math.round(it.right-it.left))+'px;height:'+Math.round(it.height)
      +'px;border-radius:'+tl+'px '+tr+'px '+br+'px '+bl+'px"></div>';
  }
  sellayer.innerHTML=html;
}

/* Single source of truth for the in-document (Ctrl+F) query. */
function setSearchQuery(q, source){
  searchQuery=q;
  searchIdx=q?0:-1;
  if(source!=='find') $('find-input').value=q;
  computeMatches();
  renderSearch();
  if(searchMatches.length) scrollToMatch();
}

/* ---------- Ctrl+F find bar (searches the current document) ---------- */
function openFind(){
  $('findbar').classList.add('open');
  const fi=$('find-input');
  fi.value=searchQuery;
  fi.focus(); fi.select();
}
function closeFind(){
  $('findbar').classList.remove('open');
  // Closing dismisses the search entirely: highlights vanish, the query and
  // the match counter reset, so the next Ctrl+F starts from a clean box.
  setSearchQuery('', 'close');
  input.focus();
}

function navigateSearch(dir){
  if(!searchMatches.length) return;
  searchIdx=(searchIdx+dir+searchMatches.length)%searchMatches.length;
  renderSearch();
  scrollToMatch();
}

function scrollToMatch(){
  const m=searchMatches[searchIdx]; if(!m) return;
  const rects=matchRects(m); if(!rects.length) return;
  const top=rects[0].top;
  const view=editor.clientHeight;
  if(top<editor.scrollTop+40 || top>editor.scrollTop+view-40){
    editor.scrollTop=Math.max(0, top-view/2);
  }
  // text always wraps within the visible width now, so there's no horizontal
  // overflow left to reveal (unlike before, when long lines could scroll off).
}

const DEFAULT_DOC=
`# Ремонт кухни
[ ] купить плитку
[ ] заказать столешницу
[x] замерить стены

# Бюджет
плитка = 1200 * 8
столешница = 45000
доставка = 3500
sum

итого = плитка + столешница + доставка
скидка = итого - 10%
срок 12.05`;

/* ---------- "/текст" -> checkbox, and toggle ----------
   A line that starts with "/" glued to a word becomes a task: "/купить хлеб"
   -> "[ ] купить хлеб". A "/" at a line start already means other things,
   and those always win:
   - "/тег", "/12.05", "/usd": tag / date spotlight, currency-rate command;
   - "/переменная": division by a variable defined in this "#" section (the
     continuation line of a multi-line assignment, say);
   - "//" is a note; "/12" and "/ x" have no word glued to the slash.
   The word must be finished first - a space after it on the line being
   typed, or Enter for the line just left - because "/бюдж" may still grow
   into "/бюджет" or "/usd". While the text after the slash could still
   become a multi-word variable or tag ("/личный " -> "/личный бюджет"),
   the line keeps waiting. Deletions never convert anything. */
/* The word may be wrapped: "/(текст)", "/«текст»", "/"текст"", "/[текст]"
   become "[ ] (текст)" etc. With a wrapper the line is finished once the caret
   has stepped past the matching closer (typing ")" over the auto-inserted one
   does that) - never while still inside, where "/(личный " may yet become
   "/(личный бюджет)". Without a wrapper the word must be followed by a space,
   or the line be left with Enter, as before. Pasted lines count as finished. */
const SLASH_TASK_RE=/^([ \t]*)\/([(\[{«"']*)(\p{L}[\p{L}\d_]*)/u;
const TASK_CLOSE={'(':')','[':']','{':'}','«':'»','"':'"',"'":"'"};
/* Index of the closer matching the opener at `at`, or -1 (same-char quotes: the next one). */
function matchingCloser(line, at){
  const o=line[at], c=TASK_CLOSE[o];
  if(o===c) return line.indexOf(c, at+1);
  let depth=0;
  for(let k=at;k<line.length;k++){ if(line[k]===o) depth++; else if(line[k]===c && --depth===0) return k; }
  return -1;
}
function slashTaskAt(lines, row, complete, caretCol){
  const line=lines[row], m=SLASH_TASK_RE.exec(line);
  if(!m) return -1;
  const i=m[1].length, open=m[2], wordEnd=i+1+open.length+m[3].length;
  if(!open && wordEnd<line.length && !/\s/.test(line[wordEnd])) return -1;    // "/a/b", "/слово,": no lone word
  if(!complete){
    if(open){ const c=matchingCloser(line, i+1); if(c<0 || (caretCol>i+1 && caretCol<=c)) return -1; }   // caret still between the wrapper's brackets
    else if(wordEnd>=line.length) return -1;                                  // word still being typed
  }
  if(!open && (tagTriggerLenAt(line,i) || dateTriggerLenAt(line,i) || curCmdAt(line,i))) return -1;
  const A=analyze(lines.join('\n'));
  const vars=[...(A.varsBySection[A.lines[row].section]||[])];
  const names=open ? vars : vars.concat((store.tags||[]).map(t=>(t.label||'').toLowerCase()));
  const rest=line.slice(i+1+open.length).toLowerCase();
  for(const v of names){
    if(!v) continue;
    if(rest.startsWith(v) && !/[\p{L}\d_]/u.test(rest[v.length]||' ')) return -1;   // "/переменная", "/(переменная…)": real division
    if(!complete && !open && v.startsWith(rest)) return -1;                        // could still become one
  }
  return i;
}
let pasteInfo=null;   // {start} while onPaste's insertText runs: no pairing, pasted lines are finished
function transformSlashTask(e){
  if(e && e.inputType && (e.inputType.startsWith('delete') || e.inputType.startsWith('history'))) return;
  const val=input.value, caret=input.selectionStart;
  const lines=val.split('\n');
  const row=countLinesBefore(val, caret);

      if(e.key==='ArrowRight' && pos===s){ e.preventDefault(); input.setSelectionRange(en,en); return; }
      if(e.key==='ArrowLeft'  && pos===en){ e.preventDefault(); input.setSelectionRange(s,s); return; }
      if(e.key==='Backspace'  && pos===en){ e.preventDefault(); const v=input.value; commitValue(v.slice(0,s)+v.slice(en), s); return; }
      if(e.key==='Delete'     && pos===s){ e.preventDefault(); const v=input.value; commitValue(v.slice(0,s)+v.slice(en), s); return; }
    }
  }

  // variable USAGE pills: unlike result pills/links the caret CAN enter them
  // (a double-click places it inside for normal editing), but a plain
  // Backspace sitting exactly at the right edge erases the whole label in
  // one press. The DEFINITION is exempt: where the variable is originally
  // set it must edit like plain text, one character at a time.
  if(e.key==='Backspace' && !e.shiftKey && collapsed && !(e.ctrlKey||e.altKey||e.metaKey)){
    const pos=input.selectionStart, {row,col}=offsetToLineCol(pos);
    const rng=varPillRangeAt(row, col-1);
    if(rng && !rng.def && rng.end===col){
      e.preventDefault();
      const v=input.value, lineStart=pos-col;
      const from=lineStart+rng.start, to=lineStart+rng.end;
      commitValue(v.slice(0,from)+v.slice(to), from);
      return;
    }
  }

  if(e.key==='Backspace' && !e.shiftKey && collapsed && !(e.ctrlKey||e.altKey||e.metaKey) && isEmptyPairAt(input.value, input.selectionStart)){
    e.preventDefault();                               // "(|)" -> "|": both halves of an empty pair
    const v=input.value, pos=input.selectionStart;
    commitValue(v.slice(0,pos-1)+v.slice(pos+1), pos-1);
    return;
  }
  const delMode = e.metaKey ? 'line' : (e.ctrlKey||e.altKey) ? 'word' : 'char';   // Cmd = line, Ctrl/Alt/Option = word
  if(e.key==='Backspace' && !e.shiftKey && collapsed && smartBackspace(delMode)){ e.preventDefault(); return; }
  if(e.key==='Delete' && !e.shiftKey && collapsed && smartDelete(delMode)){ e.preventDefault(); return; }
  if(e.key==='ArrowLeft' && !e.shiftKey && collapsed){
    const pos=input.selectionStart, {lineStart,contentStart}=lineBounds(pos);
    if(pos<=contentStart && lineStart>0){ e.preventDefault(); input.setSelectionRange(lineStart-1,lineStart-1); return; }
  }
  if(e.key==='Home' && !e.shiftKey){
    const {contentStart}=lineBounds(input.selectionStart);
    e.preventDefault(); input.setSelectionRange(contentStart,contentStart); return;
  }
}

/* ---------- undo / redo (native history is lost to programmatic formatting) ---------- */
let undoStack=[], redoStack=[], undoTimer=null, suppressHistory=false, lastInputType='';
/* One history per document. A single global stack let Ctrl+Z, pressed right
   after switching documents, restore the PREVIOUS document's text into the
   one now open — and the save that followed pushed it to every device. */
const histories=new Map();   // doc id -> {undo, redo}; the active one is aliased by undoStack/redoStack
let histDocId=null;
function useHistoryFor(id){
  if(id===histDocId) return;
  let h=histories.get(id);
  if(!h){ h={undo:[], redo:[]}; histories.set(id,h); }
  undoStack=h.undo; redoStack=h.redo; histDocId=id;
  clearTimeout(undoTimer); undoTimer=null; lastInputType='';
}
/* A synced change replaced a doc's text from `oldText` to `newText`. Carry
   it into every undo/redo snapshot of that doc (three-way merge), so undoing
   your own typing later never rolls back an edit that came from another
   device. Histories of documents that no longer exist are dropped. */
function rebaseHistories(changes){
  for(const [id,h] of histories){
    if(!store.docs.some(d=>d.id===id)){ histories.delete(id); if(id===histDocId){ undoStack.length=0; redoStack.length=0; } continue; }
    const ch=changes.get(id); if(!ch) continue;
    for(const st of [h.undo, h.redo]){
      if(st.length>100) st.splice(0, st.length-100);
      for(const s of st){
        if(s.text===ch.oldText){ s.caret=mapOffset(ch.oldText, ch.newText, s.caret); s.text=ch.newText; continue; }
        const t=merge3(ch.oldText, s.text, ch.newText, false, true);
        s.caret=Math.min(mapOffset(s.text, t, s.caret), t.length); s.text=t;
      }
    }
  }
}
function histState(){ return {text:input.value, caret:input.selectionStart}; }
function pushHistory(st){
  const top=undoStack[undoStack.length-1];
  if(top && top.text===st.text) return;
  undoStack.push(st); if(undoStack.length>400) undoStack.shift();
  redoStack.length=0;
}
function onBeforeInput(e){
  // Edit menu / shake-to-undo: the app's own history is the only real one
  // (the browser's is broken by every programmatic edit)
  if(e.inputType==='historyUndo' || e.inputType==='historyRedo'){ e.preventDefault(); if(e.inputType==='historyUndo') doUndo(); else doRedo(); return; }
  if(suppressHistory) return;
  const boundary = !undoTimer || (e.inputType && e.inputType!==lastInputType);
  if(boundary) pushHistory(histState());          // snapshot pre-change state at burst boundaries
  lastInputType=e.inputType||'';
  clearTimeout(undoTimer); undoTimer=setTimeout(()=>{ undoTimer=null; }, 600);
  if(!composing && autoPair(e)) e.preventDefault();
}

/* ---------- auto-closing brackets and quotes (code-editor style) ----------
   Typing an opener inserts its closer too, caret in between: "(" -> "(|)".
   - only before whitespace, end of line, a closer or punctuation - typed in
     front of a word it stays single, so wrapping existing text by hand works;
   - a quote right after a letter/digit is a closing quote or an apostrophe
     ("don't", слово"), so it is never paired there;
   - typing a closer that is already the next character steps over it;
   - with text selected, an opener wraps the selection in the pair;
   - Backspace between an empty pair deletes both halves (see also the
     keydown Backspace branch, which handles it on desktop).
   Runs from beforeinput, which phones deliver reliably (keydown there often
   reports "Unidentified"), and re-enters the normal input pipeline itself. */
const PAIR_CLOSE={'(':')','[':']','{':'}','«':'»','"':'"',"'":"'"};
const PAIR_CLOSERS=new Set([')',']','}','»','"',"'"]);
function isEmptyPairAt(v, pos){ const o=v[pos-1]; return !!PAIR_CLOSE[o] && v[pos]===PAIR_CLOSE[o]; }
function autoPair(e){
  if(!e.cancelable || pasteInfo) return false;        // can't stop the browser's own edit / a paste: leave it alone
  const v=input.value, s=input.selectionStart, en=input.selectionEnd;
  // Soft keyboards (Android) send no usable keydown, so Backspace / Delete
  // arrive only here: route them through the same logic as the keyboard.
  if(e.inputType==='deleteContentBackward'){
    if(s!==en) return false;
    if(isEmptyPairAt(v,s)){ commitValue(v.slice(0,s-1)+v.slice(s+1), s-1); return true; }
    return smartBackspace('char');
  }
  if(e.inputType==='deleteContentForward'){ return s===en && smartDelete('char'); }
  if(s===en && (e.inputType==='deleteWordBackward')) return smartBackspace('word');
  if(s===en && (e.inputType==='deleteSoftLineBackward' || e.inputType==='deleteHardLineBackward')) return smartBackspace('line');
  if(s===en && (e.inputType==='deleteWordForward')) return smartDelete('word');
  if(s===en && (e.inputType==='deleteSoftLineForward' || e.inputType==='deleteHardLineForward')) return smartDelete('line');
  // Enter right before the line's own auto-closers ("/(позвонить|)") jumps out
  // past them, so the closer stays on its line instead of being split off.
  // Assignment lines keep the plain split: "итого = (1000 +" ↵ "500)" is a
  // real multi-line expression.
  if((e.inputType==='insertLineBreak' || e.inputType==='insertParagraph') && s===en){
    const ls=s>0 ? v.lastIndexOf('\n', s-1)+1 : 0; let le=v.indexOf('\n', s); if(le<0) le=v.length;
    const line=v.slice(ls,le);
    if(!trailingAutoClosers(line, s-ls) || assignHead(line)) return false;
    input.value=v.slice(0,le)+'\n'+v.slice(le); input.setSelectionRange(le+1,le+1);
    onInput({inputType:'insertLineBreak'});
    return true;
  }
  if(e.inputType!=='insertText' || !e.data || e.data.length!==1) return false;
  const ch=e.data, close=PAIR_CLOSE[ch];
  if(s!==en){
    if(!close) return false;
    const sel=v.slice(s,en);
    if(sel.includes('\n')) return false;              // a multi-line selection (Ctrl+A…) is replaced, not wrapped
    input.value=v.slice(0,s)+ch+sel+close+v.slice(en); input.setSelectionRange(en+1,en+1);
    onInput({inputType:'insertText', data:ch});
    // keep the wrapped text selected when formatting left it in place
    const at=input.value.indexOf(ch+sel+close, Math.max(0,s-2));
    if(at>=0 && at<=s+2) input.setSelectionRange(at+1, at+1+sel.length);
    return true;
  }
  if(PAIR_CLOSERS.has(ch) && v[s]===ch){                                                  // type over the closer
    input.setSelectionRange(s+1,s+1);
    // ...which can finish a "/(текст)" line: run that check (only it - no text was typed)
    const before=input.value; transformSlashTask({inputType:'insertText', data:ch});
    if(input.value!==before){ autoIndent(); applyMask(); onChange(); }
    return true;
  }
  if(!close) return false;
  const next=v[s]||'', prev=v[s-1]||'';
  if(next && !/[\s)\]}»"',.;:]/.test(next)) return false;
  if((ch==='"'||ch==="'") && /[\p{L}\d_]/u.test(prev)) return false;
  input.value=v.slice(0,s)+ch+close+v.slice(s); input.setSelectionRange(s+1,s+1);
  if(ch==='(') pairPending=true;                       // see render(): not a round marker while typed into
  onInput({inputType:'insertText', data:ch});
  return true;
}
let pairPending=false;
/* True when everything after `col` on the line is closers that close openers
   earlier on the same line (in order) - i.e. what autoPair put there. */
function trailingAutoClosers(line, col){
  const rest=line.slice(col);
  if(!rest || !/^[)\]}»"']+$/.test(rest)) return false;
  const want=[];                                        // expected closers, innermost last
  for(const ch of line.slice(0,col)){
    if(ch==='"' || ch==="'"){ if(want[want.length-1]===ch) want.pop(); else want.push(ch); }
    else if(PAIR_CLOSE[ch]) want.push(PAIR_CLOSE[ch]);
    else if(ch===want[want.length-1]) want.pop();
  }
  for(const ch of rest) if(want.pop()!==ch) return false;
  return true;
}
/* Once the caret leaves an auto-closed "()" it is a real round marker (if still
   empty): re-render so its line rounds. */
function onPairCaretMove(){
  if(!pairPending) return;
  const v=input.value, c=input.selectionStart;
  if(document.activeElement===input && c===input.selectionEnd && v[c-1]==='(' && v[c]===')') return;
  pairPending=false; render();
}
function restoreHistory(st){
  suppressHistory=true;
  input.value=st.text;
  input.setSelectionRange(st.caret, st.caret);
  render(); scheduleSave();
  suppressHistory=false; undoTimer=null; lastInputType='';
}
function doUndo(){ if(!undoStack.length) return; redoStack.push(histState()); restoreHistory(undoStack.pop()); }
function doRedo(){ if(!redoStack.length) return; undoStack.push(histState()); restoreHistory(redoStack.pop()); }

/* ---------- delete a line (right-click menu / swipe) ---------- */
function deleteLine(i){
  const lines=input.value.split('\n');
  if(i<0||i>=lines.length) return;
  const before=lines.slice(0,i).join('\n');
  lines.splice(i,1);
  const newText=lines.join('\n');
  const caret=Math.min(before.length, newText.length);
  commitValue(newText, i===0?0:caret);
}

/* ---------- tags UI ----------
   Colour comes from the same base-palette swatch grid as the line numbers (a
   free <input type="color"> would let any of 16M colours into the palette).
   One inline grid serves both jobs: tagPickTarget is null while it is choosing
   the colour for the tag about to be added, or a tag index while recolouring
   an existing one. */
// PALETTE is declared further down, so resolve the default lazily rather than
// at load time (a top-level PALETTE[0] here would hit its temporal dead zone).
let newTagColor=null;
let tagPickTarget=null;
function tagColor(){ return newTagColor || PALETTE[0]; }
function paintTagSwatch(){ $('tag-swatch').style.background=tagColor(); }
function closeTagPicker(){
  tagPickTarget=null;
  const box=$('tag-swatches'); if(box) box.hidden=true;
  document.querySelectorAll('.tag-chip .dot.picking').forEach(d=>d.classList.remove('picking'));
}
function openTagPicker(target){
  // tapping the same trigger again closes the grid
  if(!$('tag-swatches').hidden && tagPickTarget===target){ closeTagPicker(); return; }
  closeTagPicker();
  tagPickTarget=target;
  const cur = target===null ? tagColor() : (store.tags[target]||{}).color;
  const box=$('tag-swatches');
  box.innerHTML=swatchHTML(cur, false);
  box.hidden=false;
  if(target!==null){
    const dot=document.querySelector('.tag-chip .dot[data-i="'+target+'"]');
    if(dot) dot.classList.add('picking');
  }
}
function pickTagColor(color){
  if(!color) return;
  if(tagPickTarget===null){ newTagColor=color; paintTagSwatch(); }
  else{
    const t=store.tags[tagPickTarget];
    if(t){ t.color=color; t.updated=stamp(); store.tagsUpdated=t.updated; renderTags(); render(); scheduleSave(); }
  }
  closeTagPicker();
}
function renderTags(){
  const list=$('tag-list');
  if(!store.tags.length){ list.innerHTML='<p class="empty-hint">Добавь тэг — его текст будет подсвечен выбранным цветом (приоритет ниже переменных).</p>'; return; }
  list.innerHTML=store.tags.map((t,idx)=>
    '<div class="tag-chip">'+
    '<button class="dot" data-i="'+idx+'" style="background:'+t.color+'" title="изменить цвет" type="button"></button>'+
    '<span class="label">'+esc(t.label)+'</span>'+
    '<button class="del" data-i="'+idx+'">×</button></div>').join('');
}
function addTag(){
  const name=$('tag-name').value.trim();
  const color=tagColor();
  if(!name) return;
  const key=name.toLowerCase();
  const now=stamp();
  if(!store.tags.some(t=>t.label.toLowerCase()===key)) store.tags.push({label:name,color,updated:now});
  if(store.deletedTags) delete store.deletedTags[key];   // re-adding a previously deleted tag revives it
  store.tagsUpdated=now;
  $('tag-name').value='';
  closeTagPicker();
  renderTags(); render(); scheduleSave();
}

/* ---------- top-bar dropdowns (calcuta / rest / find document) ----------
   Only one is open at a time; a menu is anchored under its trigger and
   nudged left if it would overflow the right edge of the viewport. */
let openMenuId=null;
const MENU_IDS=['brand-menu','docfind-menu','cloud-menu'];
const MENU_BTNS={'brand-menu':'brand-btn','docfind-menu':'doc-find-btn','cloud-menu':'sync-status'};
function closeMenus(){
  MENU_IDS.forEach(id=>{ const m=$(id); if(m) m.hidden=true; });
  Object.values(MENU_BTNS).forEach(bid=>{ const b=$(bid); if(b) b.setAttribute('aria-expanded','false'); });
  openMenuId=null;
  closeDocMenu();
  closeTagPicker();   // the tag swatch grid lives inside the calcuta dropdown
}
function clampMenu(m){
  m.style.left='0px';
  const r=m.getBoundingClientRect();
  const over=r.right-(window.innerWidth-8);
  if(over>0) m.style.left=(-Math.ceil(over))+'px';
}
/* Touch device? matchMedia('(pointer:coarse)') alone misses some phones/
   webviews (they report a fine primary pointer), so OR in hover:none and the
   touch-points count. Used to skip auto-focusing search fields (which would
   raise the keyboard) and to switch documents on the first tap. */
const IS_TOUCH = matchMedia('(pointer: coarse)').matches
              || matchMedia('(hover: none)').matches
              || (navigator.maxTouchPoints||0) > 0;
function toggleMenu(id){
  if(openMenuId===id){ closeMenus(); return; }
  closeMenus();
  const m=$(id); if(!m) return;
  m.hidden=false; openMenuId=id;
  const b=$(MENU_BTNS[id]); if(b) b.setAttribute('aria-expanded','true');
  clampMenu(m);
  if(id==='docfind-menu'){
    const i=$('docfind-input'); i.value=docFindQuery; renderDocFind();
    // The search box lives folded behind the loupe; it only starts open when
    // a query is already active. Focus is taken ONLY by an explicit loupe
    // tap (see the loupe handler) - never on menu open, so the first tap on
    // a row always lands (no on-screen-keyboard reflow to eat it).
    $('docfind-bar').classList.toggle('open', !!docFindQuery.trim());
  }
  if(id==='cloud-menu'){
    const d=$('cloud-done'); if(d) d.classList.remove('show');   // fresh each open
    const b=$('cloud-save'); if(b) b.disabled=false;
  }
}

/* ---------- theme (dark / light) — device-local, not synced ---------- */
const THEME_KEY='calcuta.theme';
function currentTheme(){ try{ return localStorage.getItem(THEME_KEY)||'dark'; }catch(e){ return 'dark'; } }
function applyTheme(t){
  document.documentElement.classList.toggle('light', t==='light');
  document.querySelectorAll('#brand-menu .theme-opt').forEach(b=>b.classList.toggle('active', b.dataset.theme===t));
  // keep the browser/PWA chrome in step — the <meta> ships with the dark value
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());
}
function setTheme(t){ try{ localStorage.setItem(THEME_KEY,t); }catch(e){} applyTheme(t); }

/* The app's base palette — the ONLY colours a user can put into a document
   (tag colours). Everything here matches a CSS token, so the
   picked colours read as part of the same system instead of drifting away from
   it. (They are stored as literal hex, so a tag keeps its colour across a
   theme switch.) */
const PALETTE=['#e8802c','#5ecb7e','#b98cf5','#7ec8f5','#e3b755',
               '#f14065','#8f897c','#f0f2f4'];

/* ---------- snapping legacy colours onto the base palette ----------
   Stored tag colours predate the closed palette — the tag colour used
   to be a free <input type="color">, so a document can carry any of 16M values.
   snapStoreColors() pulls them back in, on load and on every remote snapshot.
   It is idempotent, so each device converges on the same value on its own and
   no timestamp has to be bumped (which would otherwise churn the sync).

   The metric is CIEDE2000, not a plain Lab distance, and that choice decides
   real cases: a vermilion like #d13a20 sits 30.2 from orange and 31.3 from red
   by ΔE76 — a coin flip that lands on orange — while ΔE2000's hue/chroma
   weighting puts it clearly with red (17.5 vs 20.9), which is what a colour
   like that actually reads as. */
function srgbToLab(hex){
  const h=hex.replace('#','');
  const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255)
    .map(c=>c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4));
  const X=(r*.4124+g*.3576+b*.1805)/.95047,
        Y= r*.2126+g*.7152+b*.0722,
        Z=(r*.0193+g*.1192+b*.9505)/1.08883;
  const f=t=>t>0.008856 ? Math.cbrt(t) : 7.787*t+16/116;
  const fx=f(X), fy=f(Y), fz=f(Z);
  return [116*fy-16, 500*(fx-fy), 200*(fy-fz)];
}
function deltaE2000(hexA, hexB){
  const [L1,a1,b1]=srgbToLab(hexA), [L2,a2,b2]=srgbToLab(hexB);
  const RAD=Math.PI/180, DEG=180/Math.PI, P25=Math.pow(25,7);
  const pow7=v=>Math.pow(v,7);
  const C1=Math.hypot(a1,b1), C2=Math.hypot(a2,b2), Cb=(C1+C2)/2;
  const G=.5*(1-Math.sqrt(pow7(Cb)/(pow7(Cb)+P25) || 0));
  const a1p=(1+G)*a1, a2p=(1+G)*a2;
  const C1p=Math.hypot(a1p,b1), C2p=Math.hypot(a2p,b2);
  const h1p=(Math.atan2(b1,a1p)*DEG+360)%360, h2p=(Math.atan2(b2,a2p)*DEG+360)%360;
  const dLp=L2-L1, dCp=C2p-C1p;
  let dhp=0;
  if(C1p*C2p!==0){ dhp=h2p-h1p; if(dhp>180) dhp-=360; else if(dhp<-180) dhp+=360; }
  const dHp=2*Math.sqrt(C1p*C2p)*Math.sin(dhp*RAD/2);
  const Lbp=(L1+L2)/2, Cbp=(C1p+C2p)/2;
  let hbp;
  if(C1p*C2p===0) hbp=h1p+h2p;
  else if(Math.abs(h1p-h2p)<=180) hbp=(h1p+h2p)/2;
  else hbp=(h1p+h2p<360) ? (h1p+h2p+360)/2 : (h1p+h2p-360)/2;
  const T=1-.17*Math.cos((hbp-30)*RAD)+.24*Math.cos(2*hbp*RAD)
           +.32*Math.cos((3*hbp+6)*RAD)-.20*Math.cos((4*hbp-63)*RAD);
  const Sl=1+(.015*Math.pow(Lbp-50,2))/Math.sqrt(20+Math.pow(Lbp-50,2));
  const Sc=1+.045*Cbp, Sh=1+.015*Cbp*T;
  const Rc=2*Math.sqrt(pow7(Cbp)/(pow7(Cbp)+P25) || 0);
  const Rt=-Math.sin(2*(30*Math.exp(-Math.pow((hbp-275)/25,2)))*RAD)*Rc;
  return Math.sqrt(Math.pow(dLp/Sl,2)+Math.pow(dCp/Sc,2)+Math.pow(dHp/Sh,2)
                   +Rt*(dCp/Sc)*(dHp/Sh));
}
/* Nearest base-palette colour, or null when the input isn't a plain #rrggbb
   (an unset/cleared colour must stay unset rather than snap to a swatch). */
function nearestPaletteColor(hex){
  if(typeof hex!=='string' || !/^#[0-9a-fA-F]{6}$/.test(hex)) return null;
  const h=hex.toLowerCase();
  if(PALETTE.indexOf(h)>=0) return h;
  let best=null, bd=Infinity;
  for(const c of PALETTE){ const d=deltaE2000(h,c); if(d<bd){ bd=d; best=c; } }
  return best;
}
function snapStoreColors(s){
  if(!s) return s;
  if(Array.isArray(s.tags)) s.tags.forEach(t=>{
    const n=nearestPaletteColor(t && t.color); if(n) t.color=n;
  });
  return s;
}

function swatchHTML(sel, withClear){
  return PALETTE.map(c=>'<div class="sw'+(c===sel?' sel':'')+'" data-c="'+c+'" style="background:'+c+'"></div>').join('')
    +(withClear?'<div class="sw clear" data-c="" title="сбросить">×</div>':'');
}

/* Pasted text is normalized line-by-line, but any URL run within a line is
   passed through untouched: normalizeNumberRun() below happily inserts a
   grouping space into a bare digit run like a product id or a port number,
   and urlLenAt() stops recognizing a link the instant it hits ANY whitespace
   (NBSP included) - so reformatting numbers inside a pasted link silently
   breaks it into unclickable fragments. */
function normalizePasted(txt){
  return txt.split('\n').map(line=>{
    let out='', i=0;
    while(i<line.length){
      const ul=urlLenAt(line,i);
      if(ul){ out+=line.substr(i,ul); i+=ul; continue; }
      let j=i+1;
      while(j<line.length && !urlLenAt(line,j)) j++;
      out+=normalizeNumberRun(line.slice(i,j));
      i=j;
    }
    return out;
  }).join('\n');
}
function normalizeNumberRun(txt){
  // Convert loose numbers (1,234.56 / 1234.5 / 714285,71428571 / "1 234,56")
  // pasted from mail/spreadsheets/Word to app format so they're recognized as
  // real numbers and take part in math: the decimal separator (dot or comma)
  // becomes a comma and thousands regroup.
  // 0) strip invisible zero-width/soft-hyphen junk that web pages embed inside
  //    digit runs (it silently splits a number into unrecognizable pieces), and
  //    turn the typographic minus into the ASCII one. Zero-width chars are only
  //    removed next to a digit so emoji ZWJ sequences stay intact.
  txt = txt.replace(/[\u200B\u200C\u200D\u2060\uFEFF\u00AD]+(?=\d)/g, '')
           .replace(/(?<=\d)[\u200B\u200C\u200D\u2060\uFEFF\u00AD]+/g, '')
           .replace(/\u2212/g, '-');
  // 0b) Swiss apostrophe grouping ("1'234'567.89") → plain digits
  txt = txt.replace(/\d{1,3}(?:['\u2019]\d{3})+(?![\d'])/g, s => s.replace(/['\u2019]/g,''));
  // 0c) multi-group comma/dot thousands WITHOUT a decimal part ("1,234,567",
  //     "1.234.567") → plain digits. Two-plus groups make the intent
  //     unambiguous; a single "2,013" stays a decimal (comma = decimal here).
  txt = txt.replace(/(?<![\d.,])\d{1,3}(?:,\d{3}){2,}(?!\d)/g, s => s.replace(/,/g,''));
  txt = txt.replace(/(?<![\d.,])\d{1,3}(?:\.\d{3}){2,}(?!\d)/g, s => s.replace(/\./g,''));
  // 1) normalize the non-breaking / narrow / thin / figure spaces web content
  //    uses for grouping into a regular space, then 2) collapse genuine
  //    space-grouped thousands ("1 234 567,89" → "1234567,89") so the
  //    decimal-aware pass sees a clean number (a lone "17 6" is NOT collapsed —
  //    "6" isn't a 3-digit group).
  txt = txt.replace(/[\u00a0\u2007\u2008\u2009\u200a\u202f\u205f]/g, ' ');
  txt = txt.replace(/\d{1,3}(?: \d{3})+(?:[.,]\d+)?/g, s => s.replace(/ /g, ''));
  return txt.replace(/\d[\d.,]*\d|\d/g, (m)=>{
    const dm=dateAt(m); if(dm && dm[0]===m) return m;   // keep pure dates
    const lastSep=Math.max(m.lastIndexOf(','), m.lastIndexOf('.'));
    let intp, frac='';
    if(lastSep>=0){
      const tail=m.slice(lastSep+1);
      if(/^\d+$/.test(tail)){ intp=m.slice(0,lastSep).replace(/[.,]/g,''); frac=tail; }
      else { intp=m.replace(/[.,]/g,''); }
    } else { intp=m; }
    if(!/^\d+$/.test(intp)) return m;
    return groupDigits(intp)+(frac?(','+frac):'');
  });
}

/* ---------- copy result ---------- */
function onResultsClick(e){
  const el=e.target.closest('.result-line.has'); if(!el) return;
  const v=el.dataset.v||'';
  // Copy a clean number (no invisible sentinel, no grouping spaces) so it
  // pastes as a real, computable number into Sheets/Excel/Word etc. Pasting it
  // back into Calcuta is fine too — normalizePasted keeps it a usable number.
  copyText(v);
  lastCopiedResult={v, at:Date.now()};   // so pasting it back becomes a pill
  el.classList.add('copied');
  setTimeout(()=>el.classList.remove('copied'),450);
  showToast('Скопировано: '+v);
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t)); }
  else fallbackCopy(t);
}
function fallbackCopy(t){
  // The temp textarea steals focus via select(); give it back afterwards so
  // a copy never visibly moves the user's caret (this path also runs LATE -
  // as the async .catch of navigator.clipboard - so callers can't restore).
  const prev=document.activeElement;
  const ps=(prev&&prev.setSelectionRange)?[prev.selectionStart,prev.selectionEnd]:null;
  const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove();
  if(prev&&prev.focus){ prev.focus({preventScroll:true}); if(ps) try{ prev.setSelectionRange(ps[0],ps[1]); }catch(e){} }
}
let toastTimer=null;
function showToast(msg, ms){
  toast.textContent=msg; toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'), ms||1400);
}

/* ---------- resizable results column ---------- */
function applyResultsWidth(w){
  bumpLayout();   // the text column narrows/widens, so every line can re-wrap
  if(window.innerWidth<=720){
    // phones have no drag handle: clear any stored inline width so the fixed
    // width from the mobile media query governs instead.
    document.documentElement.style.removeProperty('--results-w');
    computeCharsPerLine();
    return;
  }
  w=Math.max(90, Math.min(560, w||150));
  document.documentElement.style.setProperty('--results-w', w+'px');
  computeCharsPerLine();
}
function initResultsResize(){
  const rz=$('results-resize'); let dragging=false;
  const move=(e)=>{
    if(!dragging) return;
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const w=editor.getBoundingClientRect().right - cx;
    store.resultsWidth=Math.max(90, Math.min(560, w));
    applyResultsWidth(store.resultsWidth);
    render();                  // live rewrap as the results column is dragged wider/narrower
    if(e.cancelable) e.preventDefault();
  };
  const stop=()=>{ if(dragging){ dragging=false; rz.classList.remove('dragging'); document.body.style.userSelect=''; persist(); } };
  rz.addEventListener('mousedown', e=>{ dragging=true; rz.classList.add('dragging'); document.body.style.userSelect='none'; e.preventDefault(); });
  rz.addEventListener('touchstart', ()=>{ dragging=true; rz.classList.add('dragging'); }, {passive:true});
  document.addEventListener('mousemove', move);
  document.addEventListener('touchmove', move, {passive:false});
  document.addEventListener('mouseup', stop);
  document.addEventListener('touchend', stop);
}

   old always-on gate survives un-gating: after leaving, nothing is readable

   sign-out control in the UI today — this is the function one would call. */
function signOutAndWipe(){
